# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Lean CI — single job, shared build cache.
# Binary distribution handled by plasmidBin CI/CD (auto-harvest.yml).
# This workflow validates code quality only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No @stable: the version comes from rust-toolchain.toml so CI and local
      # builds cannot drift apart. @stable floated CI onto whatever shipped
      # that week, independently of the checked-in pin.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Asserts every test target *builds*, which is a different question from
      # whether tests pass and is not answered by any other step. 21 targets had
      # rotted to non-compiling before this gate existed (S382, D-TEST-COMPILE).
      - name: Test compilation
        run: cargo test --workspace --no-run --locked

      - name: Test
        run: cargo test --workspace --lib
