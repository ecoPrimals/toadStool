[package]
name = "toadstool-examples"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Examples for ToadStool Universal Compute Platform"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "../README.md"
keywords = ["examples", "demos", "tutorials", "compute"]
categories = ["development-tools"]

# Examples excluded from docs.rs — standalone binaries, not library documentation
[package.metadata.docs.rs]
# Skip this package when building workspace documentation
build = false

[[bin]]
name = "basic_usage"
path = "basic_usage.rs"

[[bin]]
name = "basic_working_demo"
path = "basic_working_demo.rs"

[[bin]]
name = "production_universal_demo"
path = "production_universal_demo.rs"

[[bin]]
name = "performance_benchmark"
path = "performance_benchmark.rs"

[[bin]]
name = "biomeos_substrate_demo"
path = "biomeos_substrate_demo.rs"

[[bin]]
name = "cooperative_network_demo"
path = "cooperative_network_demo.rs"

[[bin]]
name = "capability_discovery_demo"
path = "capability_discovery_demo.rs"

[[bin]]
name = "enhanced_universal_substrate_demo"
path = "enhanced_universal_substrate_demo.rs"

[[bin]]
name = "exotic_platforms_showcase"
path = "exotic_platforms_showcase.rs"

[[bin]]
name = "final_universal_substrate_summary"
path = "final_universal_substrate_summary.rs"

[[bin]]
name = "native_execution_demo"
path = "native_execution_demo.rs"

[[bin]]
name = "runtime_engines_demo"
path = "runtime_engines_demo.rs"

[[bin]]
name = "simple_demo"
path = "simple_demo.rs"

[[bin]]
name = "simplified_distributed_demo"
path = "simplified_distributed_demo.rs"

[[bin]]
name = "squirrel_mcp_coordination_demo"
path = "squirrel_mcp_coordination_demo.rs"

[[bin]]
name = "standalone_universal_compute"
path = "standalone_universal_compute/main.rs"

[[bin]]
name = "universal_compute_demo"
path = "universal_compute_demo.rs"

[[bin]]
name = "universal_compute_ecosystem_demo"
path = "universal_compute_ecosystem_demo.rs"

[[bin]]
name = "universal_platform_test"
path = "universal_platform_test.rs"

[[bin]]
name = "config_management_demo"
path = "config_management_demo.rs"

[[bin]]
name = "network_performance_benchmark"
path = "network_performance_benchmark.rs"

[[bin]]
name = "modern_patterns_showcase"
path = "modern_patterns_showcase.rs"

[[bin]]
name = "real_gpu_pool"
path = "real_gpu_pool.rs"

[[bin]]
name = "distributed_gpu_demo"
path = "distributed_gpu_demo.rs"

[[bin]]
name = "unified_memory_demo"
path = "unified_memory_demo.rs"

[dependencies]
bytes = { workspace = true }
# Core ToadStool
toadstool = { path = "../crates/core/toadstool" }
toadstool-common = { path = "../crates/core/common" }
toadstool-config = { path = "../crates/core/config" }
# Pure Ecosystem Runtime Engines (no external dependencies)
toadstool-runtime-native = { path = "../crates/runtime/native" }
toadstool-runtime-wasm = { path = "../crates/runtime/wasm" }
toadstool-runtime-gpu = { path = "../crates/runtime/gpu" }

# Ecosystem Integration
toadstool-distributed = { path = "../crates/distributed" }

# Management and Monitoring
toadstool-management-monitoring = { path = "../crates/management/monitoring" }

# Standard dependencies
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Test utilities
temp-env = "0.3"


[features]
default = ["pure-ecosystem"]
pure-ecosystem = []
full-ecosystem = ["pure-ecosystem"]