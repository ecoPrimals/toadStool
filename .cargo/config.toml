# Current approach: Enable via Cargo.toml workspace.lints incrementally

# ============================================================================
# ECOBIN: Cross-Compilation Configuration (Jan 17, 2026)
# ============================================================================
# Pure Rust cross-compilation configuration
# Philosophy: Lean INTO compile time - each optimization is a runtime improvement

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"
