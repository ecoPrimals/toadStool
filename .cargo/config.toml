# biomeOS Cross-Compilation Configuration
# TRUE ecoBin v2.0 → genomeBin Evolution
# Created: January 30, 2026

[build]
# NOTE: -D warnings moved to [workspace.lints.rust] in Cargo.toml
# This enables proper override via [lints.clippy] for transitive dep conflicts
# genomeBin PIE compliance: verified — x86_64 and aarch64 Linux default to PIE.
# Explicit flag not needed; would conflict with target-specific rustflags.
# Verified: `file target/release/toadstool` → "ELF 64-bit LSB pie executable"

# ARM64 Linux (musl for static linking)
[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static",
    "-C", "link-arg=-lc"
]

# ARM64 Android (for Pixel 8a / GrapheneOS)
[target.aarch64-linux-android]
linker = "aarch64-linux-android-ld"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static"
]

# x86_64 Linux (musl for static linking - current standard)
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static"
]

# ARM64 macOS (Apple Silicon)
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-dead_strip"
]

# RISC-V (future expansion)
[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"

# GPU tests share a single device — high parallelism causes device-lost.
# The dispatch semaphore handles serialization, but wgpu's internal state
# can still corrupt under extreme thread counts. 4 threads is the sweet
# spot: fast enough for CI, safe enough for GPU-backed tests.
# Override: RUST_TEST_THREADS=N cargo test
[env]
RUST_TEST_THREADS = { value = "4", force = false }

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Single codegen unit for maximum optimization
strip = true           # Strip symbols
panic = "abort"        # Smaller binary size

[profile.release-fast]
inherits = "release"
opt-level = 3          # Optimize for speed instead of size
