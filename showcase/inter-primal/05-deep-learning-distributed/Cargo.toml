[package]
name = "toadstool-deep-learning"
version = "0.1.0"
edition = "2021"

# Standalone project - not part of parent workspace
[workspace]

[dependencies]
# ML Framework - Using tch-rs (PyTorch bindings) for speed
tch = { version = "0.22", features = [] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Dataset handling
image = "0.25"
ndarray = "0.15"

[[bin]]
name = "train-single"
path = "src/bin/train_single.rs"

[[bin]]
name = "train-distributed"
path = "src/bin/train_distributed.rs"

[[bin]]
name = "train-scale"
path = "src/bin/train_scale.rs"

[[bin]]
name = "download-cifar10"
path = "src/bin/download_cifar10.rs"

[lib]
name = "toadstool_deep_learning"
path = "src/lib.rs"
