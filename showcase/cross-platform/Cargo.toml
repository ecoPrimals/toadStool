[package]
name = "cross-platform-showcase"
version = "0.1.0"
edition = "2021"
description = "Cross-platform compute showcase: GPU, NPU, and CPU pipelines"
license = "MIT"

[[bin]]
name = "gpu_parity"
path = "src/gpu_parity.rs"

[[bin]]
name = "cascade_demo"
path = "src/cascade_demo.rs"

[[bin]]
name = "hotspring_bridge"
path = "src/hotspring_bridge.rs"

[dependencies]
# BarraCUDA for GPU compute
barracuda = { path = "../../crates/barracuda" }

# ToadStool for hardware discovery
toadstool-core = { path = "../../crates/toadstool-core" }

# Akida driver for NPU
akida-driver = { path = "../../crates/neuromorphic/akida-driver" }

# NeuroBench harness
neurobench-runner = { path = "../../crates/neuromorphic/neurobench-runner" }

# Burn for ML inference
burn-inference = { path = "../../crates/ml/burn-inference" }

# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Timing
std-time = { package = "chrono", version = "0.4" }
