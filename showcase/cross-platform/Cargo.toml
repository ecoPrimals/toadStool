[features]
default = []
cuda = ["cudarc"]
rocm = []  # Uses system hipcc, no Rust crate needed
cuda-comparison = ["cuda"]  # Enable CUDA performance comparison benchmarks

[dependencies]
# BarraCuda for GPU compute
barracuda = { path = "../../crates/barracuda" }

# ToadStool for hardware discovery
toadstool-core = { path = "../../crates/toadstool-core" }

# Akida driver for NPU
akida-driver = { path = "../../crates/neuromorphic/akida-driver" }

# NeuroBench harness
neurobench-runner = { path = "../../crates/neuromorphic/neurobench-runner" }

# Burn for ML inference
burn-inference = { path = "../../crates/ml/burn-inference" }

# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parallel CPU baseline
rayon = "1.8"

# Direct wgpu access for shader optimization benchmarks
wgpu = { workspace = true }
bytemuck = { version = "1.14", features = ["derive"] }

# Optional: Native CUDA comparison (NVIDIA only)
# Upgraded from 0.11 to 0.19 for proper device queries (Feb 2026)
# cuda-12050: explicit version for --all-features builds without nvcc (ecoBin)
cudarc = { version = "0.19", optional = true, features = ["cuda-12050"] }
