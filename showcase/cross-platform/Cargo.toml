[package]
name = "cross-platform-showcase"
version = "0.1.0"
edition = "2021"
description = "Cross-platform compute showcase: GPU, NPU, and CPU pipelines"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/toadStool"
readme = "README.md"
keywords = ["gpu", "npu", "compute", "benchmark", "cross-platform"]
categories = ["science", "hardware-support"]

