[package]
name = "cross-platform-showcase"
version = "0.1.0"
edition = "2021"
description = "Cross-platform compute showcase: GPU, NPU, and CPU pipelines"
license = "MIT"

[[bin]]
name = "gpu_parity"
path = "src/gpu_parity.rs"

[[bin]]
name = "cascade_demo"
path = "src/cascade_demo.rs"

[[bin]]
name = "hotspring_bridge"
path = "src/hotspring_bridge.rs"

[[bin]]
name = "npu_test"
path = "src/npu_test.rs"

[[bin]]
name = "multi_gpu_bench"
path = "src/multi_gpu_bench.rs"

[[bin]]
name = "heterogeneous_ensemble"
path = "src/heterogeneous_ensemble.rs"

[[bin]]
name = "streaming_pipeline"
path = "src/streaming_pipeline.rs"

[[bin]]
name = "vendor_benchmark"
path = "src/vendor_benchmark.rs"

[[bin]]
name = "cuda_vs_barracuda"
path = "src/cuda_vs_barracuda.rs"

[[bin]]
name = "parity_benchmark"
path = "src/parity_benchmark.rs"

[features]
default = []
cuda = ["cudarc"]

[dependencies]
# BarraCUDA for GPU compute
barracuda = { path = "../../crates/barracuda" }

# ToadStool for hardware discovery
toadstool-core = { path = "../../crates/toadstool-core" }

# Akida driver for NPU
akida-driver = { path = "../../crates/neuromorphic/akida-driver" }

# NeuroBench harness
neurobench-runner = { path = "../../crates/neuromorphic/neurobench-runner" }

# Burn for ML inference
burn-inference = { path = "../../crates/ml/burn-inference" }

# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Timing
std-time = { package = "chrono", version = "0.4" }

# Parallel CPU baseline
rayon = "1.8"

# Optional: Native CUDA comparison (NVIDIA only)
cudarc = { version = "0.11", optional = true, features = ["cuda-12050"] }
