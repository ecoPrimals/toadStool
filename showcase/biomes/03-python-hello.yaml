apiVersion: biomeOS/v1
kind: Biome
metadata:
  name: python-hello-demo
  environment: demonstration
  version: "1.0.0"
  description: "Simple Python execution demonstration"
  labels:
    showcase: "true"
    runtime: "python"
    difficulty: "beginner"

primals:
  toadstool:
    enabled: true
    orchestrator: true
    runtime_engines:
      - python
    execution_environments:
      - python3
    substrates:
      - x86_64
      - aarch64
    resources:
      cpu_cores: 1.0
      memory_gb: 0.5
      storage_gb: 1.0
    config: {}

services:
  - name: hello-python
    description: "Hello world using Python runtime"
    runtime: python
    script: |
      #!/usr/bin/env python3
      import platform
      import os
      import sys
      from datetime import datetime
      
      print("╔════════════════════════════════════════════════════════════╗")
      print("║        🍄 ToadStool Python Hello World                   ║")
      print("╚════════════════════════════════════════════════════════════╝")
      print()
      print("Execution Context:")
      print(f"  Runtime:      PYTHON")
      print(f"  Version:      {sys.version.split()[0]}")
      print(f"  Platform:     {platform.system()} {platform.machine()}")
      print(f"  Process ID:   {os.getpid()}")
      print(f"  Timestamp:    {datetime.now().isoformat()}")
      print()
      print("Python Info:")
      print(f"  Implementation: {platform.python_implementation()}")
      print(f"  Compiler:       {platform.python_compiler()}")
      print(f"  Build:          {platform.python_build()[0]}")
      print()
      print("✅ Python execution complete!")
      print()
    resources:
      cpu_limit: 0.5
      memory_limit: "256Mi"
    security:
      isolation: standard
      read_only: false
      capabilities: []

resources:
  cpu_limit: 1.0
  memory_limit: "512Mi"
  storage_limit: "1Gi"

