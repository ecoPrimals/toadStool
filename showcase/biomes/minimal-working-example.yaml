metadata:
  name: minimal-native-hello
  version: "1.0.0"
  description: "Minimal working example of native execution"
  author: "ToadStool Team"
  created: "2025-11-14T15:00:00Z"
  updated: "2025-11-14T15:00:00Z"
  tags:
    - showcase
    - minimal
    - native

primals:
  toadstool:
    version: "0.1.0"
    enabled: true
    source:
      type: registry
      image: "toadstool:latest"
    config: {}
    dependencies: []
    health_check: null

services:
  hello:
    version: "1.0.0"
    source:
      type: script
      script: |
        #!/bin/bash
        echo "Hello from ToadStool!"
    replicas: 1
    resources:
      cpu_limit: 0.5
      memory_limit: "128Mi"
      disk_limit: "100Mi"
      gpu_count: 0
    environment: {}
    ports: []
    volumes: []
    dependencies: []
    health_check: null

resources:
  cpu_limit: 1.0
  memory_limit: "512Mi"
  disk_limit: "1Gi"
  gpu_limit: 0
  network_bandwidth_limit: "100Mbps"

security:
  beardog_required: false
  auth_enabled: false
  encryption_at_rest: false
  network_policies: []
  pod_security_policy: standard

networking:
  mode: bridge
  dns_servers: []
  port_forwards: []
  load_balancer_enabled: false

storage:
  provider: local
  persistent_volumes: []
  backup_enabled: false

