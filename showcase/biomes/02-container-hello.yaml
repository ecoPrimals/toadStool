apiVersion: biomeOS/v1
kind: Biome
metadata:
  name: container-hello-demo
  environment: demonstration
  version: "1.0.0"
  description: "Simple container execution demonstration"
  labels:
    showcase: "true"
    runtime: "container"
    difficulty: "beginner"

primals:
  toadstool:
    enabled: true
    orchestrator: true
    runtime_engines:
      - container
    execution_environments:
      - docker
    substrates:
      - x86_64
      - aarch64
    resources:
      cpu_cores: 1.0
      memory_gb: 0.5
      storage_gb: 2.0
    config: {}

services:
  - name: hello-container
    description: "Hello world using container runtime"
    runtime: container
    image: "alpine:latest"
    command: "/bin/sh"
    args:
      - "-c"
      - |
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║        🍄 ToadStool Container Hello World                ║"
        echo "╚════════════════════════════════════════════════════════════╝"
        echo ""
        echo "Execution Context:"
        echo "  Runtime:      CONTAINER (Docker)"
        echo "  Image:        alpine:latest"
        echo "  Hostname:     $(hostname)"
        echo "  Process ID:   $$"
        echo "  Timestamp:    $(date -Is)"
        echo ""
        echo "Container Info:"
        echo "  Kernel:       $(uname -r)"
        echo "  Architecture: $(uname -m)"
        echo "  Alpine Ver:   $(cat /etc/alpine-release 2>/dev/null || echo 'N/A')"
        echo ""
        echo "✅ Container execution complete!"
        echo ""
    resources:
      cpu_limit: 0.5
      memory_limit: "128Mi"
    security:
      isolation: standard
      read_only: false
      capabilities: []

resources:
  cpu_limit: 1.0
  memory_limit: "512Mi"
  storage_limit: "2Gi"

