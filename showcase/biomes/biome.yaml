services:
  compute:
    version: latest
    source:
      type: Container
      registry: registry.ecosystem.sovereignscience.org
      image: universal-compute
      tag: latest
      digest: null
    replicas: 1
    resources:
      cpu_limit: 2.0
      memory_limit: 4GB
      storage_limit: 10GB
    environment: {}
    ports:
    - container_port: 8080
      host_port: 8080
      protocol: tcp
    volumes: []
    dependencies:
    - beardog
    health_check:
      command:
      - curl
      - -f
      - http://127.0.0.1:8080/health
      interval: 30
      timeout: 10
      retries: 3
      start_period: 30
resources:
  cpu_limit: 4.0
  memory_limit: 8GB
  storage_limit: 50GB
  gpu_limit: null
  network_bandwidth: 1Gbps
security:
  isolation_level: high
  trust_level: verified
  beardog_required: true
  crypto_policies:
  - default
  allowed_networks:
  - private
  forbidden_syscalls:
  - mount
  - reboot
networking:
  mode: bridge
  dns_servers:
  - 8.8.8.8
  - 8.8.4.4
  port_mappings: []
  network_policies:
  - default-deny
storage:
  nestgate_integration: false
  datasets: []
  volumes: []
  backup_policy: null
