# ToadStool Workload - Hello World (Native Execution)
# This uses ToadStool's REAL runtime engine - no simulation!

[metadata]
name = "hello-native"
description = "Hello World demonstrating native execution through ToadStool's runtime"
version = "1.0.0"

[execution]
type = "native"
command = "/bin/bash"
args = [
    "-c",
    '''
echo "╔════════════════════════════════════════════════════════════╗"
echo "║        🍄 ToadStool Universal Hello (NATIVE)             ║"
echo "╚════════════════════════════════════════════════════════════╝"
echo ""
echo "Execution Context:"
echo "  Substrate:    NATIVE"
echo "  Hostname:     $(hostname)"
echo "  Platform:     $(uname -s) $(uname -m)"
echo "  Kernel:       $(uname -r)"
echo "  Process ID:   $$"
echo "  Timestamp:    $(date -Iseconds)"
echo ""
echo "System Resources:"
echo "  CPU Cores:    $(nproc)"
MEMORY=$(free -h 2>/dev/null | grep Mem | awk '{print $2}' || echo "N/A")
echo "  Memory:       $MEMORY"
echo ""
echo "✅ This was executed by ToadStool's REAL RuntimeOrchestrator!"
echo "   • NativeRuntimeEngine selected automatically"
echo "   • No biome.yaml required"
echo "   • Direct workload execution"
echo ""
'''
]

[resources]
cpu_cores = 0.5
memory_mb = 128
disk_mb = 100

[security]
isolation = "standard"

