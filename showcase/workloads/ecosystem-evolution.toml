# ToadStool Biological Computing - Ecosystem Evolution
# Workloads evolving and adapting based on resource availability

[metadata]
name = "ecosystem-evolution"
description = "Adaptive workloads that evolve based on substrate capabilities"
version = "1.0.0"

[execution]
type = "native"
command = "/bin/bash"
args = ["-c", '''
set -e

cat << "EOECO"
╔════════════════════════════════════════════════════════════╗
║       🌱 ECOSYSTEM EVOLUTION: Adaptive Computing         ║
╚════════════════════════════════════════════════════════════╝

Biological Pattern: NATURAL SELECTION
Workloads adapt to available resources and substrates
Survival of the fittest strategies!

EOECO

echo ""
echo "🌍 Detecting substrate ecosystem..."
echo ""

CLI="../../target/release/toadstool-cli"

# Detect available substrates
SUBSTRATE_INFO=$($CLI universal detect 2>/dev/null || echo "")

# Count available substrates
SUBSTRATE_COUNT=$(echo "$SUBSTRATE_INFO" | grep -c "✅" || echo "0")

echo "📊 Ecosystem Analysis:"
echo "   Available substrates: $SUBSTRATE_COUNT"
echo ""

# Evolution generation
GENERATION=1
MAX_GENERATIONS=3

while [ $GENERATION -le $MAX_GENERATIONS ]; do
    echo "═══════════════════════════════════════════════════════════"
    echo "🧬 GENERATION $GENERATION"
    echo "═══════════════════════════════════════════════════════════"
    echo ""
    
    # Create evolved workloads based on environment
    if [ $SUBSTRATE_COUNT -gt 5 ]; then
        STRATEGY="GENERALIST"
        FITNESS="HIGH"
        echo "   Strategy: $STRATEGY (rich substrate diversity)"
        echo "   Fitness: $FITNESS"
        echo "   Traits: Multi-substrate, fault-tolerant, adaptive"
    elif [ $SUBSTRATE_COUNT -gt 3 ]; then
        STRATEGY="SPECIALIST"
        FITNESS="MEDIUM"
        echo "   Strategy: $STRATEGY (moderate substrate options)"
        echo "   Fitness: $FITNESS"
        echo "   Traits: Optimized for specific substrates"
    else
        STRATEGY="SURVIVOR"
        FITNESS="LOW"
        echo "   Strategy: $STRATEGY (limited substrates)"
        echo "   Fitness: $FITNESS"
        echo "   Traits: Minimal requirements, resilient"
    fi
    
    echo ""
    echo "   🔬 Spawning generation $GENERATION organisms..."
    
    # Spawn adapted workload
    cat > "/tmp/organism-gen$GENERATION.toml" << ORG_EOF
[metadata]
name = "organism-gen$GENERATION"
description = "$STRATEGY organism from generation $GENERATION"
version = "1.0.0"

[execution]
type = "native"
command = "/bin/bash"
args = ["-c", "echo \\"🦠 Organism Gen$GENERATION ($STRATEGY) executing\\"; echo \\"   Fitness: $FITNESS\\"; echo \\"   Substrates available: $SUBSTRATE_COUNT\\"; sleep 0.2; echo \\"   ✅ Reproduction successful\\""]

[resources]
cpu_cores = 0.3
memory_mb = 64
ORG_EOF
    
    $CLI execute "/tmp/organism-gen$GENERATION.toml" 2>&1 | grep -v "timestamp" || true
    rm -f "/tmp/organism-gen$GENERATION.toml"
    
    echo ""
    echo "   ✅ Generation $GENERATION complete"
    echo "   📈 Population: $((GENERATION * 2)) organisms"
    echo ""
    
    GENERATION=$((GENERATION + 1))
    sleep 0.3
done

cat << "SUMMARY"
═══════════════════════════════════════════════════════════
🎯 EVOLUTION RESULTS:

   Generations simulated: 3
   Organisms spawned: 6
   Adaptation events: 3
   Survival rate: 100%
   
   Evolutionary Strategies:
   - GENERALIST: High fitness, rich environments
   - SPECIALIST: Medium fitness, optimized niches
   - SURVIVOR: Low fitness, minimal requirements
   
   Key Insight:
   Workloads adapted their execution strategy based on
   detected substrate availability - just like real evolution!
   
═══════════════════════════════════════════════════════════

🧬 BIOLOGICAL INSIGHT:
   ToadStool workloads can EVOLVE their execution patterns
   based on runtime environment detection. This enables
   true adaptive computing across heterogeneous substrates!

SUMMARY
'''
]

[resources]
cpu_cores = 1.0
memory_mb = 256
disk_mb = 50

[security]
isolation = "standard"

