# PROOF: This workload spawns a child and shows the full process tree

[metadata]
name = "prove-spawning"
description = "Demonstrates real workload spawning"
version = "1.0.0"

[execution]
type = "native"
command = "/bin/bash"
args = ["-c", '''
echo "╔════════════════════════════════════════════════════════════╗"
echo "║      🧬 PROOF OF REAL WORKLOAD SPAWNING 🧬              ║"
echo "╚════════════════════════════════════════════════════════════╝"
echo ""
echo "I am the PARENT workload (PID: $$)"
echo ""
echo "Creating a CHILD workload file..."

cat > /tmp/child-proof.toml << "CHILD_EOF"
[metadata]
name = "child-proof"
description = "I am a spawned child"
version = "1.0.0"

[execution]
type = "native"
command = "/bin/bash"
args = ["-c", "echo \"   🔹 CHILD: I exist! My PID is $$ and parent is $PPID\"; echo \"   🔹 CHILD: I can access filesystem:\"; ls /tmp/child-proof.toml 2>&1; echo \"   🔹 CHILD: Execution timestamp: $(date +%s.%N)\""]

[resources]
cpu_cores = 0.1
memory_mb = 32
CHILD_EOF

echo "Child workload file created at: /tmp/child-proof.toml"
echo ""
echo "Now spawning child via ToadStool CLI..."
echo ""
echo "════════════════════════════════════════════════════════════"

# Spawn the child using the REAL toadstool-cli
../../target/release/toadstool-cli execute /tmp/child-proof.toml 2>&1 | grep -E "(CHILD|PID|timestamp)" || echo "Child executed but output captured differently"

echo "════════════════════════════════════════════════════════════"
echo ""
echo "Cleaning up..."
rm -f /tmp/child-proof.toml

echo ""
echo "✅ PROOF: Parent workload spawned child workload via real CLI!"
echo "   This is ACTUAL recursive execution, not simulation."
echo ""
'''
]

[resources]
cpu_cores = 0.5
memory_mb = 128

[security]
isolation = "standard"

