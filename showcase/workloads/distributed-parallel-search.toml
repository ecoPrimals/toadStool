# ToadStool Distributed Parallel Search Demo
# Search across multiple data partitions in parallel

[metadata]
name = "distributed-parallel-search"
description = "Parallel search demonstrating distributed query execution"
version = "1.0.0"

[execution]
type = "python"
script = '''
import os
import time
import random
import hashlib
from datetime import datetime

print("╔════════════════════════════════════════════════════════════╗")
print("║      🔍 DISTRIBUTED PARALLEL SEARCH WORKLOAD             ║")
print("╚════════════════════════════════════════════════════════════╝")
print()

# Search configuration
total_records = 10000
search_target = "target_record_5432"
partitions = 10
records_per_partition = total_records // partitions

print("Search Configuration:")
print(f"  Total records:     {total_records}")
print(f"  Search target:     {search_target}")
print(f"  Partitions:        {partitions}")
print(f"  Records/partition: {records_per_partition}")
print()

print("🔄 In distributed mode, each partition becomes a subtask:")
print(f"   Subtask 1: Search records 1-{records_per_partition}")
print(f"   Subtask 2: Search records {records_per_partition+1}-{records_per_partition*2}")
print(f"   ...")
print(f"   Subtask {partitions}: Search records {records_per_partition*(partitions-1)+1}-{total_records}")
print()

# Simulate search across one partition (single subtask perspective)
print("Simulating partition search (what one subtask would do)...")
partition_id = random.randint(1, partitions)
start_record = (partition_id - 1) * records_per_partition + 1
end_record = partition_id * records_per_partition

print(f"  Partition {partition_id}: Searching records {start_record}-{end_record}")
print()

start_time = time.time()
found = False
matches = []

for i in range(start_record, end_record + 1):
    # Simulate record lookup
    record_id = f"record_{i}"
    record_hash = hashlib.md5(record_id.encode()).hexdigest()[:8]
    
    # Check for match (simulate search criteria)
    if "5432" in str(i) or i == 5432:
        matches.append((i, record_id, record_hash))
        found = True
        print(f"  🎯 MATCH FOUND: {record_id} (hash: {record_hash})")
    
    # Progress indicator
    if i % 200 == 0:
        progress = ((i - start_record) / records_per_partition) * 100
        print(f"  Progress: {progress:.0f}% ({i - start_record}/{records_per_partition})")

elapsed = time.time() - start_time

print()
print("═══════════════════════════════════════════════════════════")
print("🎯 PARTITION SEARCH RESULTS:")
print(f"   Partition:     {partition_id}")
print(f"   Records:       {records_per_partition}")
print(f"   Matches:       {len(matches)}")
print(f"   Search time:   {elapsed:.3f}s")
print()

if matches:
    print("   Matches found:")
    for idx, (record_num, record_id, record_hash) in enumerate(matches[:3]):
        print(f"     {idx+1}. {record_id} (hash: {record_hash})")
    if len(matches) > 3:
        print(f"     ... and {len(matches) - 3} more")

print("═══════════════════════════════════════════════════════════")
print()

print("💡 DISTRIBUTED SEARCH INSIGHTS:")
print(f"   Single partition:  {elapsed:.3f}s")
print(f"   {partitions} parallel subtasks: ~{elapsed:.3f}s (near-linear scaling!)")
print(f"   Total speedup:     ~{partitions}x")
print(f"   Ideal for:         Large datasets, log analysis, pattern matching")
print()

print("🚀 ToadStool distributes search across all partitions simultaneously!")
print()
'''

[resources]
cpu_cores = 1.0
memory_mb = 256
disk_mb = 50

[distribution]
enabled = true
strategy = "ParallelPartitioned"
min_subtasks = 5
max_subtasks = 10

[security]
isolation = "standard"

