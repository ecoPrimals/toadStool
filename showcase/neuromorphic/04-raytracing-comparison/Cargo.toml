[package]
name = "npu-raytracing-comparison"
version = "0.1.0"
edition = "2021"
authors = ["ToadStool Contributors"]
description = "Showcase: Raytracing performance comparison across NPU, GPU, and CPU substrates"
license = "MIT"
repository = "https://github.com/ecoPrimals/toadStool"
keywords = ["raytracing", "npu", "gpu", "benchmark"]
categories = ["science", "hardware-support"]

[[example]]
name = "compare_raytracing"
path = "examples/compare_raytracing.rs"

# NOTE: npu_raytrace and gpu_raytrace examples removed during deep-debt cleanup (Feb 2026)
# Unified comparison example covers both substrates

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ToadStool for hardware discovery
toadstool-core = { path = "../../../crates/toadstool-core" }

# NPU driver
akida-driver = { path = "../../../crates/neuromorphic/akida-driver" }

# BarraCUDA for GPU compute
barracuda = { path = "../../../crates/barracuda" }

# Math
glam = "0.24"  # Vector math

[dev-dependencies]
