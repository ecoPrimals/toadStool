[package]
name = "akida-llm-intent"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
toadstool = { path = "../../../crates/core/toadstool" }
toadstool-distributed = { path = "../../../crates/distributed" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# For SNN/LLM integration
ndarray = "0.15"
rand = "0.8"

[[example]]
name = "train_intent_classifier"
path = "examples/train_intent_classifier.rs"

[[example]]
name = "run_intent_classification"
path = "examples/run_intent_classification.rs"

[[example]]
name = "benchmark_akida_vs_gpu"
path = "examples/benchmark_akida_vs_gpu.rs"

[[example]]
name = "hybrid_pipeline"
path = "examples/hybrid_pipeline.rs"

