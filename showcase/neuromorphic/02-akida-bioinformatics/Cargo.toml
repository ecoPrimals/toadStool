[package]
name = "akida-bioinformatics-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
akida-detection-demo = { path = "../01-akida-detection" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
bio = "1.5"  # Bioinformatics utilities
rayon = "1.8"  # Parallel processing
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"

[[example]]
name = "train_kmer_model"
path = "examples/train_kmer_model.rs"

[[example]]
name = "run_akida_filter"
path = "examples/run_akida_filter.rs"

[[example]]
name = "compare_cpu_akida"
path = "examples/compare_cpu_akida.rs"

[[example]]
name = "power_measurement"
path = "examples/power_measurement.rs"

[[bench]]
name = "kmer_benchmark"
harness = false

