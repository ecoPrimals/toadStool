[package]
name = "akida-detection-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
toadstool-distributed = { path = "../../../crates/distributed" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# PCIe device access
nix = { version = "0.27", features = ["ioctl"] }

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "detect_akida"
path = "examples/detect_akida.rs"

[[example]]
name = "enumerate_boards"
path = "examples/enumerate_boards.rs"

[[example]]
name = "query_capabilities"
path = "examples/query_capabilities.rs"

[[example]]
name = "health_check"
path = "examples/health_check.rs"

