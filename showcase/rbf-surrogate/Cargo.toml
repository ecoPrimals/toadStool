[package]
name = "showcase-rbf-surrogate"
version = "0.1.0"
edition = "2021"
authors = ["ToadStool Contributors"]
description = "Showcase: Radial Basis Function surrogate model on GPU via BarraCUDA"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/toadStool"
keywords = ["rbf", "surrogate", "gpu", "barracuda"]
categories = ["science", "mathematics"]

[[bin]]
name = "rbf_demo"
path = "src/main.rs"

[dependencies]
barracuda = { path = "../../crates/barracuda" }
toadstool-core = { path = "../../crates/toadstool-core" }
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
