[package]
name = "genetic-classroom-showcase"
version = "0.1.0"
edition = "2021"

[workspace]
# Standalone showcase, not part of main workspace

[[bin]]
name = "genetic_classroom"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
rand = "0.8"
futures = "0.3"

