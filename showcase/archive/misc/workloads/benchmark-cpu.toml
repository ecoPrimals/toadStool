# ToadStool Showcase - CPU Benchmark
# Measures pure CPU performance across substrates

[workload]
id = "benchmark-cpu"
name = "CPU Benchmark"
description = "Recursive fibonacci benchmark for CPU performance testing"
version = "1.0.0"

[execution]
type = "script"
entry_point = "main"
timeout_seconds = 120

[execution.script]
language = "python"
code = """
#!/usr/bin/env python3
import time
import os
import sys
import json
from datetime import datetime

SUBSTRATE = os.environ.get('TOADSTOOL_SUBSTRATE', 'unknown')

def fibonacci(n):
    '''Recursive fibonacci - CPU intensive'''
    if n <= 1:
        return n
    return fibonacci(n-1) + fibonacci(n-2)

def format_time(seconds):
    '''Format seconds nicely'''
    if seconds < 0.001:
        return f"{seconds * 1000000:.0f}μs"
    elif seconds < 1:
        return f"{seconds * 1000:.2f}ms"
    else:
        return f"{seconds:.3f}s"

def main():
    print("╔════════════════════════════════════════════════════════════╗")
    print("║            🍄 ToadStool CPU Benchmark                     ║")
    print("╚════════════════════════════════════════════════════════════╝")
    print()
    print(f"Substrate: {SUBSTRATE}")
    print(f"Test:      Recursive Fibonacci")
    print()
    
    # Test parameters
    test_sizes = [30, 32, 34, 35]
    results = []
    
    print("Running CPU-intensive calculations...")
    print()
    
    for n in test_sizes:
        print(f"  Computing fibonacci({n})... ", end='', flush=True)
        
        start = time.perf_counter()
        result = fibonacci(n)
        elapsed = time.perf_counter() - start
        
        ops_per_sec = n / elapsed if elapsed > 0 else 0
        
        print(f"{format_time(elapsed)} (result: {result:,})")
        
        results.append({
            'n': n,
            'result': result,
            'time_seconds': elapsed,
            'ops_per_second': ops_per_sec
        })
    
    print()
    print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
    print("Results:")
    print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
    
    total_time = sum(r['time_seconds'] for r in results)
    avg_time = total_time / len(results)
    avg_ops = sum(r['ops_per_second'] for r in results) / len(results)
    
    print(f"  Total Time:       {format_time(total_time)}")
    print(f"  Average Time:     {format_time(avg_time)}")
    print(f"  Average Ops/Sec:  {avg_ops:.2f}")
    print()
    
    # Performance rating
    if avg_time < 2.0:
        rating = "EXCELLENT"
        emoji = "🚀"
    elif avg_time < 3.0:
        rating = "GOOD"
        emoji = "✅"
    elif avg_time < 5.0:
        rating = "ACCEPTABLE"
        emoji = "⚠️"
    else:
        rating = "SLOW"
        emoji = "🐌"
    
    print(f"  Performance:      {emoji} {rating}")
    print()
    
    # Save results
    output = {
        'substrate': SUBSTRATE,
        'benchmark': 'cpu',
        'test': 'fibonacci',
        'timestamp': datetime.now().isoformat(),
        'results': results,
        'summary': {
            'total_time': total_time,
            'average_time': avg_time,
            'average_ops_per_second': avg_ops,
            'rating': rating
        }
    }
    
    # Print JSON for parsing
    print("BENCHMARK_RESULT_JSON_START")
    print(json.dumps(output, indent=2))
    print("BENCHMARK_RESULT_JSON_END")
    print()
    
    print(f"✅ CPU Benchmark complete on: {SUBSTRATE}")
    return 0

if __name__ == "__main__":
    sys.exit(main())
"""

[resources]
cpu_cores = 2
memory_mb = 512
disk_mb = 50

[benchmark]
type = "cpu"
metric = "time"
iterations = 4

[metadata]
tags = ["benchmark", "cpu", "performance"]
author = "ToadStool Team"
license = "AGPL-3.0"

