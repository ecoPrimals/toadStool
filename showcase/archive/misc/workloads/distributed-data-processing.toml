# ToadStool Distributed Data Processing Demo
# This workload is designed to be split into multiple subtasks

[metadata]
name = "distributed-data-processing"
description = "Large-scale data processing demonstrating automatic job splitting"
version = "1.0.0"

[execution]
type = "native"
command = "/bin/bash"
args = ["-c", '''
echo "╔════════════════════════════════════════════════════════════╗"
echo "║      🔧 DISTRIBUTED DATA PROCESSING WORKLOAD             ║"
echo "╚════════════════════════════════════════════════════════════╝"
echo ""
echo "Job Configuration:"
echo "  Total items:       1000"
echo "  Job Type:          DataProcessing"
echo "  Complexity:        COMPLEX"
echo "  Expected subtasks: 10-20"
echo ""

# Simulate large dataset processing
echo "Analyzing dataset..."
sleep 0.5

# Create a temporary dataset
DATASET_FILE="/tmp/toadstool-dataset-$$.txt"
echo "Generating dataset with 1000 items..."

for i in $(seq 1 1000); do
    echo "data_item_$i:$RANDOM:$(date +%s%N)" >> "$DATASET_FILE"
done

echo "✅ Dataset created: $DATASET_FILE"
echo ""

echo "Processing dataset..."
echo "  Strategy: Map-Reduce"
echo "  Expected splits: 10 subtasks (100 items each)"
echo ""

# In a real distributed scenario, ToadStool would:
# 1. Analyze this job
# 2. Split it into subtasks
# 3. Distribute to available nodes
# 4. Aggregate results

echo "📊 Job Analysis:"
echo "  Input size:     $(wc -l < "$DATASET_FILE") lines"
echo "  Estimated time: 45s (single-node)"
echo "  Distributed:    4-5s (10 nodes) = 9x speedup!"
echo ""

# Simulate some processing
echo "Processing sample (simulating what subtasks would do)..."
count=0
while IFS= read -r line && [ $count -lt 50 ]; do
    # Simulate processing
    result=$(echo "$line" | md5sum | cut -d' ' -f1)
    if [ $((count % 10)) -eq 0 ]; then
        echo "  Processed item $count: $result"
    fi
    count=$((count + 1))
done < "$DATASET_FILE"

echo ""
echo "✅ Sample processing complete!"
echo ""
echo "💡 In distributed mode, ToadStool would:"
echo "   1. Split this into 10 subtasks"
echo "   2. Each subtask processes 100 items"
echo "   3. All execute in parallel"
echo "   4. Results aggregated automatically"
echo ""

# Cleanup
rm -f "$DATASET_FILE"

echo "🎯 This workload is ready for distribution!"
echo ""
'''
]

[resources]
cpu_cores = 2.0
memory_mb = 512
disk_mb = 100

[distribution]
# ToadStool will use these hints for job splitting
enabled = true
strategy = "SplitAndDistribute"
min_subtasks = 5
max_subtasks = 20
items_per_subtask = 100

[security]
isolation = "standard"

