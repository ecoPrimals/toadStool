metadata:
  name: native-hello-demo
  version: "1.0.0"
  description: "Simple native execution demonstration"
  author: "ToadStool Team"
  created: "2025-11-14T15:00:00Z"
  updated: "2025-11-14T15:00:00Z"
  tags:
    - showcase
    - runtime-native
    - beginner

primals:
  toadstool:
    version: "0.1.0"
    enabled: true
    source:
      type: registry
      image: "toadstool:latest"
    config: {}
    dependencies: []
    health_check: null

services:
  hello-native:
    version: "1.0.0"
    source:
      type: script
      script: |
        #!/bin/bash
    args:
      - "-c"
      - |
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║        🍄 ToadStool Native Hello World                   ║"
        echo "╚════════════════════════════════════════════════════════════╝"
        echo ""
        echo "Execution Context:"
        echo "  Runtime:      NATIVE"
        echo "  Hostname:     $(hostname)"
        echo "  Platform:     $(uname -s) $(uname -m)"
        echo "  Process ID:   $$"
        echo "  Timestamp:    $(date -Is)"
        echo ""
        echo "System Info:"
        echo "  CPU Cores:    $(nproc 2>/dev/null || echo 'N/A')"
        echo "  Memory:       $(free -h 2>/dev/null | grep Mem | awk '{print $2}' || echo 'N/A')"
        echo ""
        echo "✅ Native execution complete!"
        echo ""
    resources:
      cpu_limit: 0.5
      memory_limit: "128Mi"
    security:
      isolation: standard
      read_only: false
      capabilities: []

resources:
  cpu_limit: 1.0
  memory_limit: "512Mi"
  storage_limit: "1Gi"

