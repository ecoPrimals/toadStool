# Home Game Server Manager
# Host multiple game servers with priority management for personal gaming

[metadata]
name = "game-server-manager"
description = "Priority-aware game server hosting with auto-suspend/resume"
version = "1.0.0"

[execution]
type = "native"
command = "/bin/bash"
args = ["-c", '''
#!/bin/bash
set -e

cat << "BANNER"
╔═══════════════════════════════════════════════════════════════╗
║          🌐 Home Game Server Manager Starting...             ║
╚═══════════════════════════════════════════════════════════════╝
BANNER

echo ""
echo "🌐 ToadStool Home Game Server Manager"
echo "   Version: 1.0.0"
echo "   Mode: Priority-Aware Server Hosting"
echo ""

# System resources
echo "💻 System Resources:"
if command -v nproc &> /dev/null; then
    TOTAL_CORES=$(nproc)
    TOTAL_MEMORY=$(free -m | awk ''/Mem:/{print $2}'')
else
    TOTAL_CORES=12
    TOTAL_MEMORY=32768
fi

echo "   CPU Cores: $TOTAL_CORES"
echo "   Memory: ${TOTAL_MEMORY}MB"
echo ""

# Server configuration
echo "⚙️  Server Configuration:"
echo "   Servers: 3 (Minecraft, Valheim, Terraria)"
echo "   Your gaming priority: 100 (HIGHEST)"
echo "   Server priority: 80 (HIGH)"
echo "   Reserved for gaming: 6 cores, 12GB"
echo ""

echo "✅ Game Server Manager Active"
echo ""

# Simulate server hosting
echo "═══════════════════════════════════════════════════════════"
echo "🎮 Hosted Game Servers:"
echo "═══════════════════════════════════════════════════════════"
echo ""

TIMESTAMP=$(date +"%H:%M:%S")

echo "[$TIMESTAMP] Server 1: Minecraft (Java Edition)"
echo "           Container: minecraft-java:latest"
echo "           Resources: 2 cores, 4GB RAM"
echo "           Priority: 80"
echo "           Status: ✅ RUNNING (3 players connected)"
echo "           Ports: 25565 (TCP)"
echo ""

echo "[$TIMESTAMP] Server 2: Valheim (Dedicated)"
echo "           Container: valheim-dedicated:latest"
echo "           Resources: 3 cores, 8GB RAM"
echo "           Priority: 75"
echo "           Status: 💤 SUSPENDED (no players, idle 45m)"
echo "           Ports: 2456-2458 (UDP)"
echo ""

echo "[$TIMESTAMP] Server 3: Terraria"
echo "           Container: terraria-server:latest"
echo "           Resources: 2 cores, 2GB RAM"
echo "           Priority: 80"
echo "           Status: ✅ RUNNING (1 player connected)"
echo "           Ports: 7777 (TCP)"
echo ""

echo "═══════════════════════════════════════════════════════════"
echo "📊 Resource Allocation:"
echo "   Active servers: 2/3"
echo "   CPU used: 4 cores / $TOTAL_CORES cores (33.3%)"
echo "   Memory used: 6GB / $((TOTAL_MEMORY / 1024))GB (18.8%)"
echo "   Reserved for gaming: 6 cores, 12GB (priority 100)"
echo "   Available: 2 cores, 14GB"
echo "═══════════════════════════════════════════════════════════"
echo ""

sleep 2

echo "[$TIMESTAMP] Simulating gaming session..."
echo ""

TIMESTAMP=$(date +"%H:%M:%S")
echo "[$TIMESTAMP] 🎮 Personal gaming detected!"
echo "           Game: Cyberpunk 2077"
echo "           Priority: 100 (HIGHEST)"
echo ""

sleep 1

echo "[$TIMESTAMP] 🚨 Activating gaming priority..."
echo "           Analyzing server resource usage..."
sleep 0.5

echo "           ├─ Minecraft: 3 players active, throttling to 1 core"
sleep 0.3
echo "           ├─ Valheim: Suspended (already idle)"
sleep 0.3
echo "           ├─ Terraria: 1 player, saving state and suspending"
sleep 0.5
echo "           └─ Reserved: 6 cores + 12GB for gaming"
echo ""

sleep 1

TIMESTAMP=$(date +"%H:%M:%S")
echo "[$TIMESTAMP] ✅ Gaming priority activated!"
echo "           Your game: Full resources (6c, 12GB)"
echo "           Servers: Throttled/suspended"
echo "           Response time: 1.8 seconds"
echo ""

sleep 2

echo "[$TIMESTAMP] Gaming session active..."
echo "           Duration: 2h 27m (simulated)"
echo "           Servers: Waiting patiently"
echo ""

sleep 2

TIMESTAMP=$(date +"%H:%M:%S")
echo "[$TIMESTAMP] Gaming ended"
echo "           Restoring normal server operation..."
echo ""

sleep 1

echo "           ├─ Minecraft: Restored to 2 cores"
sleep 0.3
echo "           ├─ Terraria: Resuming from checkpoint"
sleep 0.3
echo "           └─ Valheim: Remains suspended (no players)"
echo ""

sleep 1

TIMESTAMP=$(date +"%H:%M:%S")
echo "[$TIMESTAMP] ✅ Normal operations resumed"
echo ""

cat << "STATS"
═══════════════════════════════════════════════════════════════
📊 Home Game Server Statistics (Today)

Servers Hosted:
├─ Minecraft: 8h 45m active, 3-8 players
├─ Valheim: 2h 15m active, 0-4 players (auto-suspended 6x)
├─ Terraria: 5h 30m active, 1-3 players
└─ Total player-hours served: 47.3

Your Gaming:
├─ Sessions: 3
├─ Total time: 2h 27m
├─ Priority: 100% maintained (never compromised)
└─ Average activation time: 1.8s

Resource Efficiency:
├─ CPU utilization: 78.4%
├─ Memory utilization: 71.2%
├─ Auto-suspensions: 8 (saved energy!)
├─ Server throttling: 3 times (for your gaming)
└─ Total efficiency: 74.8%

Cost Savings:
├─ Cloud hosting equivalent: $45/month
│   ├─ Minecraft server: $15/mo
│   ├─ Valheim server: $20/mo
│   └─ Terraria server: $10/mo
├─ Your cost: $0 (using home PC)
└─ Annual savings: $540 💰

Priority Management:
├─ Your gaming priority: NEVER compromised ✅
├─ Server throttling events: 3 (all successful)
├─ Player experience: Minimal impact (latency +5ms avg)
└─ Friend satisfaction: 🟢 HIGH
═══════════════════════════════════════════════════════════════

🌐 Home Game Server Manager: Free hosting with personal priority!
STATS

echo ""
'''
]

[resources]
cpu_cores = 2.0
memory_mb = 1024

[security]
isolation = "standard"

