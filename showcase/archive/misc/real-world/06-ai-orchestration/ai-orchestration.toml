# ToadStool AI Orchestration Configuration
# Demonstrates hybrid local + cloud AI with intelligent routing

[workload]
name = "ai-orchestration"
version = "1.0.0"
description = "Intelligent AI orchestration with local models and cloud APIs"
author = "ToadStool Showcase"

# Define the AI pipeline stages
[pipeline]
type = "multi-stage"
coordination = "songbird"  # Use Songbird for message routing
ai_gateway = "squirrel"     # Use Squirrel for AI model/API management

# ═══════════════════════════════════════════════════════════════
# Stage 1: Request Classification & Routing
# ═══════════════════════════════════════════════════════════════

[stages.classifier]
name = "request-classifier"
description = "Analyze request and determine optimal routing"
agent = "toadstool-classifier"
type = "decision"

[stages.classifier.analysis]
# Factors for routing decision
privacy_level = ["public", "internal", "private", "sensitive"]
complexity = ["simple", "medium", "complex", "expert"]
task_type = ["qa", "code", "writing", "research", "analysis"]
latency_requirement = ["realtime", "fast", "normal", "batch"]
cost_sensitivity = ["free", "low", "normal", "high"]

[stages.classifier.routing_rules]
# Automatic routing based on requirements
sensitive_data = { route = "local", reason = "privacy" }
simple_qa = { route = "local", reason = "cost+speed" }
code_analysis = { route = "local", reason = "privacy+capability" }
complex_writing = { route = "cloud", reason = "quality" }
web_research = { route = "cloud", reason = "capability" }
long_context = { route = "cloud", reason = "context_window" }

# ═══════════════════════════════════════════════════════════════
# Stage 2a: Local AI Execution
# ═══════════════════════════════════════════════════════════════

[stages.local_ai]
name = "local-ai-execution"
description = "Execute AI inference on local GPU"
agent = "toadstool-gpu"
type = "compute"
enabled_when = ["privacy == high", "cost_sensitivity == free", "complexity <= medium"]

[stages.local_ai.models]
# Local models available (managed by Squirrel)
primary = "llama-3-8b"
fallback = "mistral-7b"
specialized = ["codellama", "mistral-7b"]

[stages.local_ai.resources]
gpu_device = "cuda:0"
gpu_memory = "8GB"
max_batch_size = 4
max_context_length = 4096

[stages.local_ai.performance]
target_latency = "200ms"
max_latency = "500ms"
throughput = "200 tokens/sec"

[stages.local_ai.models.llama-3-8b]
path = "/models/llama-3-8b"
device = "cuda:0"
precision = "fp16"
max_tokens = 4096
use_cases = ["general_qa", "code_review", "summarization"]

[stages.local_ai.models.mistral-7b]
path = "/models/mistral-7b"
device = "cuda:0"
precision = "fp16"
max_tokens = 8192
use_cases = ["long_context", "analysis", "reasoning"]

[stages.local_ai.models.codellama]
path = "/models/codellama-7b"
device = "cuda:0"
precision = "fp16"
max_tokens = 4096
use_cases = ["code_generation", "code_review", "debugging"]

# ═══════════════════════════════════════════════════════════════
# Stage 2b: Cloud AI Execution
# ═══════════════════════════════════════════════════════════════

[stages.cloud_ai]
name = "cloud-ai-execution"
description = "Execute AI inference via cloud APIs"
agent = "squirrel-gateway"
type = "api"
enabled_when = ["complexity >= high", "privacy <= internal"]

[stages.cloud_ai.apis]
# Cloud APIs available (managed by Squirrel)
primary = ["claude-3-opus", "gpt-4"]
secondary = ["claude-3-sonnet", "gpt-3.5-turbo"]
specialized = ["perplexity", "google-gemini"]

[stages.cloud_ai.selection_strategy]
# How to choose which API to use
writing = "claude-3-opus"        # Best for creative writing
reasoning = "gpt-4"              # Best for complex reasoning
research = "perplexity"          # Best for web research
code = "claude-3-sonnet"         # Good balance for code
general = "gpt-3.5-turbo"        # Fast and cheap
multimodal = "google-gemini"     # Supports images

[stages.cloud_ai.cost_management]
max_cost_per_request = 0.50      # Maximum $ per request
monthly_budget = 50.00           # Maximum $ per month
fallback_on_budget = "local"     # Use local if budget exceeded

[stages.cloud_ai.apis.claude-3-opus]
provider = "anthropic"
model = "claude-3-opus-20240229"
max_tokens = 200000              # 200K context
cost_per_1k_tokens = 0.015       # $15 per 1M tokens
use_cases = ["writing", "analysis", "complex_reasoning"]

[stages.cloud_ai.apis.gpt-4]
provider = "openai"
model = "gpt-4-turbo-preview"
max_tokens = 128000              # 128K context
cost_per_1k_tokens = 0.01        # $10 per 1M tokens
use_cases = ["reasoning", "code", "general"]

[stages.cloud_ai.apis.perplexity]
provider = "perplexity"
model = "pplx-70b-online"
max_tokens = 4096
cost_per_1k_tokens = 0.001       # $1 per 1M tokens
use_cases = ["research", "web_search", "current_events"]

# ═══════════════════════════════════════════════════════════════
# Stage 3: Response Formatting
# ═══════════════════════════════════════════════════════════════

[stages.formatter]
name = "response-formatter"
description = "Format and return final response"
agent = "toadstool-formatter"
type = "transform"

[stages.formatter.output]
format = "markdown"
include_metadata = true
metadata_fields = ["latency", "cost", "source", "privacy_level"]

# ═══════════════════════════════════════════════════════════════
# Songbird Message Routing Configuration
# ═══════════════════════════════════════════════════════════════

[songbird]
enabled = true
routing_mode = "intelligent"

[songbird.agents]
classifier = "songbird://localhost:7878/ai/classifier"
local_ai = "songbird://localhost:7878/ai/local"
cloud_ai = "songbird://squirrel:8080/ai/cloud"
formatter = "songbird://localhost:7878/ai/formatter"

[songbird.routing]
# Routing patterns based on message content
[songbird.routing.patterns]
sensitive_code = { destination = "local_ai", priority = "high" }
public_writing = { destination = "cloud_ai", priority = "normal" }
web_research = { destination = "cloud_ai", priority = "normal" }

# ═══════════════════════════════════════════════════════════════
# Squirrel AI Gateway Configuration
# ═══════════════════════════════════════════════════════════════

[squirrel]
enabled = true
mode = "hybrid"  # local + cloud

[squirrel.local]
model_dir = "/models"
device = "cuda:0"
cache_models = true
auto_download = false

[squirrel.cloud]
api_keys_file = "~/.squirrel/api-keys.env"
rate_limiting = true
cost_tracking = true
fallback_enabled = true

# ═══════════════════════════════════════════════════════════════
# Monitoring & Observability
# ═══════════════════════════════════════════════════════════════

[monitoring]
enabled = true
metrics_port = 9090
log_level = "info"

[monitoring.metrics]
track_latency = true
track_costs = true
track_privacy = true
track_resource_usage = true

[monitoring.alerts]
high_cost = { threshold = 10.00, interval = "hourly" }
high_latency = { threshold = "5s", interval = "per_request" }
privacy_violation = { action = "block", notify = true }

# ═══════════════════════════════════════════════════════════════
# Example Workflows
# ═══════════════════════════════════════════════════════════════

[[workflows]]
name = "code-review"
description = "Analyze code for bugs and security issues"
stages = ["classifier", "local_ai", "formatter"]
privacy_level = "private"
expected_latency = "200ms"
expected_cost = "$0.00"

[[workflows]]
name = "business-plan"
description = "Generate comprehensive business plan"
stages = ["classifier", "cloud_ai", "formatter"]
privacy_level = "public"
expected_latency = "2-5s"
expected_cost = "$0.10-0.25"

[[workflows]]
name = "research-pipeline"
description = "Research + Analyze + Report"
stages = ["classifier", "cloud_ai", "local_ai", "cloud_ai", "formatter"]
privacy_level = "mixed"
expected_latency = "3-5s"
expected_cost = "$0.10-0.20"

# Stage flow for research pipeline:
# 1. Research (Cloud - web access)
# 2. Analysis (Local - private data)
# 3. Report (Cloud - professional formatting)

[[workflows.research-pipeline.stages]]
name = "research"
agent = "cloud_ai"
model = "perplexity"
task = "web_research"

[[workflows.research-pipeline.stages]]
name = "analysis"
agent = "local_ai"
model = "llama-3-8b"
task = "data_analysis"
privacy = "high"  # Keep analysis private

[[workflows.research-pipeline.stages]]
name = "report"
agent = "cloud_ai"
model = "claude-3-opus"
task = "report_generation"

# ═══════════════════════════════════════════════════════════════
# Privacy & Security
# ═══════════════════════════════════════════════════════════════

[privacy]
default_level = "internal"
pii_detection = true
data_anonymization = "auto"  # Auto-anonymize before cloud

[privacy.rules]
# Data classification rules
personal_code = "private"         # User's code → local only
customer_data = "sensitive"       # Customer data → local only
public_info = "public"            # General info → cloud OK
business_docs = "internal"        # Business docs → prefer local

[security]
encryption_at_rest = true
encryption_in_transit = true
audit_logging = true
access_control = "capability-based"

# ═══════════════════════════════════════════════════════════════
# Performance Tuning
# ═══════════════════════════════════════════════════════════════

[performance]
enable_caching = true
cache_ttl = "1h"
enable_batching = true
batch_size = 4
max_concurrent_requests = 10

[performance.optimization]
prefer_local_for = ["simple_qa", "code_review", "summarization"]
prefer_cloud_for = ["writing", "research", "complex_reasoning"]
auto_tune = true  # Learn from usage patterns

