# ═══════════════════════════════════════════════════════════════
# Routing Rules (Capability-Based)
# ═══════════════════════════════════════════════════════════════

[routing]
strategy = "capability_match"

# Scoring weights for service selection
[routing.scoring]
capability_match = 0.40      # Does it have what we need?
cost = 0.25                  # Is it affordable?
performance = 0.20           # Is it fast enough?
privacy = 0.10               # Does it meet privacy requirements?
reliability = 0.05           # Is it dependable?

# Fallback strategy
[routing.fallback]
enabled = true
strategy = "relax_preferences"  # If no match, relax soft constraints
max_fallback_attempts = 3

# Load balancing
[routing.load_balance]
enabled = true
strategy = "least_loaded"    # Round-robin, least-loaded, weighted
health_check_interval_secs = 30

# ═══════════════════════════════════════════════════════════════
# Service Discovery via Songbird
# ═══════════════════════════════════════════════════════════════

[discovery]
backend = "songbird"
refresh_interval_secs = 60   # Re-query Songbird every minute

[discovery.songbird]
endpoint = "http://localhost:8080"
registry_path = "/registry/services"
query_path = "/registry/query"

# Services register themselves with Songbird
[discovery.registration]
# ToadStool registers as orchestrator
register_as = "orchestrator"
heartbeat_interval_secs = 30

# Squirrel registers AI capabilities
# Each service publishes its capabilities to Songbird
# ToadStool queries Songbird for available services

# ═══════════════════════════════════════════════════════════════
# Provider Adapters (How to Talk to Services)
# ═══════════════════════════════════════════════════════════════

# These are protocol adapters, not vendor lock-in
# Any service implementing these protocols can be used

[[adapters]]
adapter_id = "openai_compatible"
protocol = "openai_chat_completions"
description = "OpenAI-compatible chat completions API"

[adapters.request_format]
type = "json"
method = "POST"
headers = ["Authorization: Bearer {api_key}", "Content-Type: application/json"]

[adapters.response_format]
type = "json"
text_path = "choices[0].message.content"
tokens_path = "usage.total_tokens"
finish_reason_path = "choices[0].finish_reason"

# ---

[[adapters]]
adapter_id = "anthropic_compatible"
protocol = "anthropic_messages"
description = "Anthropic-compatible messages API"

[adapters.request_format]
type = "json"
method = "POST"
headers = ["x-api-key: {api_key}", "anthropic-version: 2023-06-01", "Content-Type: application/json"]

[adapters.response_format]
type = "json"
text_path = "content[0].text"
tokens_path = "usage.input_tokens + usage.output_tokens"
finish_reason_path = "stop_reason"

# ---

[[adapters]]
adapter_id = "ollama_compatible"
protocol = "ollama_generate"
description = "Ollama-compatible generate API"

[adapters.request_format]
type = "json"
method = "POST"
headers = ["Content-Type: application/json"]

[adapters.response_format]
type = "json"
text_path = "response"
streaming_path = "response"

# ---

[[adapters]]
adapter_id = "generic_http"
protocol = "http_json"
description = "Generic HTTP/JSON API"

[adapters.request_format]
type = "json"
method = "POST"
configurable = true

[adapters.response_format]
type = "json"
configurable = true

# ═══════════════════════════════════════════════════════════════
# Monitoring & Observability
# ═══════════════════════════════════════════════════════════════

[monitoring]
enabled = true

[monitoring.metrics]
track_service_latency = true
track_service_costs = true
track_service_errors = true
track_routing_decisions = true

[monitoring.logging]
log_service_selection = true
log_capability_matching = true
log_cost_calculations = true

# ═══════════════════════════════════════════════════════════════
# Example: Adding a New Service (No Code Changes!)
# ═══════════════════════════════════════════════════════════════

# To add a new AI provider:
# 1. Service registers with Songbird with its capabilities
# 2. Squirrel detects it via service discovery
# 3. ToadStool can now route to it
# 4. No code changes needed!

# Example new service:
# [[services]]
# service_id = "new-ai-provider-001"
# service_type = "ai.text.generation"
# [services.capabilities]
# modality = "text"
# max_tokens = 8192
# [services.cost]
# input_cost_per_1k = 0.001
# ... etc
# 
# That's it! System automatically discovers and uses it.

