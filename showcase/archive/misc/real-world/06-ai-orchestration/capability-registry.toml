# ═══════════════════════════════════════════════════════════════
# Workload Requirements (What You Need)
# ═══════════════════════════════════════════════════════════════

[[workload_profiles]]
profile_id = "code_review"
description = "Private code review - must be local"

[workload_profiles.requirements]
service_type = "ai.text.generation"
min_tokens = 2000
preferred_languages = ["en"]

[workload_profiles.constraints]
# Hard constraints - must match
privacy_level = "private"
location = "on_premise"
max_cost_per_request = 0.0  # Must be free

[workload_profiles.preferences]
# Soft constraints - nice to have
preferred_latency_ms = 500
preferred_reliability = 0.99

# ---

[[workload_profiles]]
