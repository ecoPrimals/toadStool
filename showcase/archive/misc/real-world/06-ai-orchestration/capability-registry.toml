# Capability-Based AI Service Registry
# Services register with Songbird, not hardcoded in ToadStool

[registry]
# Songbird acts as service discovery
type = "distributed"
backend = "songbird"
endpoint = "http://localhost:8080/registry"

# ═══════════════════════════════════════════════════════════════
# AI Service Capabilities (Not Vendors!)
# ═══════════════════════════════════════════════════════════════

# Each service advertises what it CAN do, not who it is
# ToadStool routes based on capabilities, not brand names

[[services]]
# Service registers itself (could be OpenAI, could be anything)
service_id = "text-generation-fast-001"
service_type = "ai.text.generation"

[services.capabilities]
modality = "text"
input_types = ["text"]
output_types = ["text"]
max_tokens = 4096
languages = ["en", "es", "fr", "de", "pt", "it", "nl", "pl", "ru", "zh", "ja", "ko"]
streaming = true
function_calling = false
vision = false

[services.performance]
avg_latency_ms = 1500
tokens_per_second = 100
reliability = 0.99

[services.cost]
cost_model = "token"
input_cost_per_1k = 0.0005
output_cost_per_1k = 0.0015
currency = "USD"

[services.privacy]
data_retention = "none"
training_on_data = false
geographic_restrictions = []

[services.endpoint]
# Squirrel resolves this, not hardcoded
protocol = "https"
path = "/v1/chat/completions"
auth_type = "bearer"
# Actual URL resolved at runtime via Songbird

