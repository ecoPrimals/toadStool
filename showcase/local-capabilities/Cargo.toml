[package]
name = "toadstool-showcase-local"
version = "0.1.0"
edition = "2021"
description = "ToadStool local capabilities showcase and demonstrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["showcase", "local", "capabilities", "demos"]
categories = ["development-tools"]

[[bin]]
name = "demo-native-execution"
path = "01-basic-execution/demo_native.rs"

[[bin]]
name = "demo-wasm-execution"
path = "01-basic-execution/demo_wasm.rs"

[dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wat = "1.0"  # WebAssembly Text format parser

# ToadStool dependencies
toadstool = { path = "../../crates/core/toadstool" }
toadstool-server = { path = "../../crates/server" }

