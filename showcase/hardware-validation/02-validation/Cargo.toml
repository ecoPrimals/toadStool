[package]
name = "cross-substrate-validation"
version = "0.1.0"
edition = "2021"

# Standalone showcase
[workspace]

[[bin]]
name = "cross-substrate-validation"
path = "src/main.rs"

[[bin]]
name = "mha-validation"
path = "src/mha_validation.rs"

[[bin]]
name = "causal-validation"
path = "src/causal_validation.rs"

[[bin]]
name = "rope-validation"
path = "src/rope_validation.rs"

[[bin]]
name = "cross-validation"
path = "src/cross_validation.rs"

[[bin]]
name = "alibi-validation"
path = "src/alibi_validation.rs"

[[bin]]
name = "sparse-validation"
path = "src/sparse_validation.rs"

[dependencies]
# BarraCUDA with substrate selection
barracuda = { path = "../../../crates/barracuda" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

# Stats
statistical = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
