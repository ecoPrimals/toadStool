[package]
name = "cross-substrate-validation"
version = "0.1.0"
edition = "2021"

# Standalone showcase
[workspace]

[dependencies]
# BarraCUDA with substrate selection
barracuda = { path = "../../../crates/barracuda" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

# Stats
statistical = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
