[package]
name = "simple-gpu-bench"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
ndarray = "0.15"
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"

[[bin]]
name = "bench"
path = "src/main.rs"

