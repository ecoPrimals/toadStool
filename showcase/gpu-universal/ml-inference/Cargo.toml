[package]
name = "ml-inference-showcase"
version = "0.1.0"
edition = "2021"
authors = ["ToadStool Contributors"]
description = "Showcase: ML inference pipeline demonstration using ToadStool GPU runtime"
license = "MIT"
repository = "https://github.com/ecoPrimals/toadStool"
keywords = ["ml", "inference", "gpu", "showcase"]
categories = ["science", "hardware-support"]

[dependencies]
# Deep Debt Week 1: Add thiserror for comprehensive error handling
thiserror = "1.0"

toadstool = { path = "../../../crates/core/toadstool" }
toadstool-runtime-gpu = { path = "../../../crates/runtime/gpu", features = ["webgpu"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Real ML dependencies
ndarray = "0.15"
rayon = "1.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Image processing for MNIST
flate2 = "1.0"
byteorder = "1.5"

# GPU compute
cudarc = { version = "0.11", optional = true }
ocl = { version = "0.19", optional = true }
ash = { version = "0.37", optional = true }
# EVOLVED: Use workspace wgpu config (Pure Rust! No renderdoc-sys) ✅
# ecoBin: Exclude vulkan-portability by default (pulls wayland-sys on Linux)
# Use feature "native-display" for full Linux desktop with Wayland/X11
wgpu = { workspace = true, default-features = false, features = ["wgsl", "dx12", "metal", "webgpu"] }
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
futures-intrusive = "0.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# TEST HARNESS ONLY: MNIST download helper (has C dependencies via reqwest)
# NOTE: This is ONLY for local testing without other primals
# Production binaries do NOT include this dependency
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

[features]
default = []
# Full Linux desktop: Vulkan surface creation (requires wayland-server.pc / wayland-client)
native-display = ["wgpu/vulkan-portability"]
# TEST HARNESS FEATURE: Enables MNIST download binary (includes C dependencies)
# Production builds NEVER include this feature
test-harness = []
cuda = ["cudarc", "toadstool-runtime-gpu/cuda"]
opencl = ["ocl", "toadstool-runtime-gpu/opencl"]
vulkan = ["ash", "toadstool-runtime-gpu/vulkan"]
webgpu = ["toadstool-runtime-gpu/webgpu"]
all-gpus = ["cuda", "opencl", "vulkan", "webgpu"]

[[bin]]
name = "download-mnist"
path = "src/download.rs"
# IMPORTANT: This binary has C dependencies (reqwest)
# Only builds with: cargo build --bin download-mnist --features test-harness
# Production builds NEVER include this binary
required-features = ["test-harness"]

[[bin]]
name = "mnist-cpu-baseline"
path = "src/cpu_baseline.rs"

[[bin]]
name = "mnist-gpu-cuda"
path = "src/gpu_cuda.rs"

[[bin]]
name = "validate-correctness"
path = "src/validate.rs"

[[bin]]
name = "hybrid-pipeline"
path = "src/hybrid.rs"

[[bin]]
name = "universal-abstraction-demo"
path = "src/universal_demo.rs"

[[bin]]
name = "train-mnist"
path = "src/train_mnist.rs"

[[bin]]
name = "validate-trained"
path = "src/validate_trained.rs"

[[bin]]
name = "dual-gpu-demo"
path = "src/bin/dual_gpu_demo.rs"

[[bin]]
name = "dual-gpu-parallel"
path = "src/bin/dual_gpu_parallel.rs"

[[bin]]
name = "amd-vs-nvidia"
path = "src/bin/amd_vs_nvidia.rs"

[[bin]]
name = "cross-gpu-inference"
path = "src/bin/cross_gpu_inference.rs"

[[bench]]
name = "simple_benchmarks"
harness = false

[[bench]]
name = "layernorm_comparison"
harness = false

[[bench]]
name = "layernorm_fused_benchmark"
harness = false

[[bench]]
name = "matmul_tiled_benchmark"
harness = false
