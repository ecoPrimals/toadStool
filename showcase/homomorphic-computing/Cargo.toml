[package]
name = "homomorphic-computing"
version = "0.1.0"
edition = "2021"

[dependencies]
# ToadStool internal - barraCUDA (our GPU framework) ⭐
barracuda = { path = "../../crates/barracuda" }

# ToadStool internal - Configuration system ⭐
toadstool-config = { path = "../../crates/core/config" }

# ToadStool internal - Universal runtime (substrate abstraction) ⭐
toadstool-runtime-universal = { path = "../../crates/runtime/universal" }

# Core async
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random
rand = "0.8"

# Math (for homomorphic schemes)
num-traits = "0.2"
num-complex = "0.4"

# GPU (via wgpu - barraCUDA's backend)
wgpu = "0.19"
bytemuck = "1.20"
tfhe = { version = "1.5.1", default-features = false, features = ["boolean", "shortint", "integer"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

# NOTE: barraCUDA and cross-substrate-validation integration will come
# after we validate the basic structure compiles

[[example]]
name = "cross_substrate_comparison"
path = "examples/cross_substrate_comparison.rs"

[[example]]
name = "capability_selection"
path = "examples/capability_selection.rs"

[[example]]
name = "real_measurements"
path = "examples/real_measurements.rs"
