[package]
name = "homomorphic-computing"
version = "0.1.0"
edition = "2021"

[dependencies]
# ToadStool internal - barraCUDA (our GPU framework) ⭐
barracuda = { path = "../../crates/barracuda" }

# ToadStool internal - Configuration system ⭐
toadstool-config = { path = "../../crates/core/config" }

# ToadStool internal - Universal runtime (substrate abstraction) ⭐
toadstool-runtime-universal = { path = "../../crates/runtime/universal" }

# Core async
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random
rand = "0.8"

# Math (for homomorphic schemes)
num-traits = "0.2"
num-complex = "0.4"

# GPU (via wgpu - barraCUDA's backend)
wgpu = "0.19"
bytemuck = "1.20"
tfhe = { version = "1.5.1", default-features = false, features = ["boolean", "shortint", "integer"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

# NOTE: Validation benchmarks only
# These use TFHE-rs as reference for comparison

[[example]]
name = "tfhe_cpu_baseline"
path = "examples/tfhe_cpu_baseline.rs"

[[example]]
name = "tfhe_gpu_validation"
path = "examples/tfhe_gpu_validation.rs"

[[example]]
name = "tfhe_npu_validation"
path = "examples/tfhe_npu_validation.rs"

[[example]]
name = "public_benchmark_comparison"
path = "examples/public_benchmark_comparison.rs"

[[example]]
name = "pipeline_validation_matrix"
path = "examples/pipeline_validation_matrix.rs"
