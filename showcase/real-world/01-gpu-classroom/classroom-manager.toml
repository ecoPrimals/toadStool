# GPU Classroom Manager - Fair GPU Sharing for Education
# Manages 1 GPU shared among 30 students with quotas and time limits

[metadata]
name = "gpu-classroom-manager"
description = "Fair GPU sharing for 30 students with automatic quota enforcement"
version = "1.0.0"

[execution]
type = "native"
command = "/bin/bash"
args = ["-c", '''
#!/bin/bash
set -e

cat << "BANNER"
╔═══════════════════════════════════════════════════════════════╗
║          🎓 GPU Classroom Manager Starting...                ║
╚═══════════════════════════════════════════════════════════════╝
BANNER

echo ""
echo "🎓 ToadStool GPU Classroom Manager"
echo "   Version: 1.0.0"
echo "   Mode: Fair Share with Quotas"
echo ""

# Detect GPU
if command -v nvidia-smi &> /dev/null; then
    GPU_NAME=$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1)
    GPU_MEMORY=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -1)
    
    echo "📊 GPU Configuration:"
    echo "   Device: $GPU_NAME"
    echo "   Total Memory: ${GPU_MEMORY}MB"
else
    echo "⚠️  No NVIDIA GPU detected (running in simulation mode)"
    GPU_NAME="RTX 3090 (Simulated)"
    GPU_MEMORY="24576"
fi

echo ""
echo "⚙️  Classroom Configuration:"
TOTAL_STUDENTS=30
PER_STUDENT_QUOTA=$((GPU_MEMORY / TOTAL_STUDENTS))

echo "   Total Students: $TOTAL_STUDENTS"
echo "   Per-Student Quota: ${PER_STUDENT_QUOTA}MB"
echo "   Time Limit: 5 minutes per job"
echo "   Queue Model: FIFO (First In, First Out)"
echo ""

echo "✅ GPU Classroom Manager Active"
echo "   Status: Ready for student submissions"
echo "   Fair share enabled: Each student gets ${PER_STUDENT_QUOTA}MB"
echo ""

# Initialize queue
mkdir -p /tmp/toadstool-classroom
echo "0" > /tmp/toadstool-classroom/jobs_completed
echo "0" > /tmp/toadstool-classroom/jobs_queued
echo "0" > /tmp/toadstool-classroom/jobs_rejected

# Simulation of classroom activity
echo "═══════════════════════════════════════════════════════════"
echo "📚 Simulating Classroom Activity..."
echo "═══════════════════════════════════════════════════════════"
echo ""

TIMESTAMP=$(date +"%H:%M:%S")

# Student 1 submission
echo "[$TIMESTAMP] 📨 Student 03: Submitted ML Training job"
echo "           Memory requested: 650MB"
if [ 650 -le $PER_STUDENT_QUOTA ]; then
    echo "           Status: ✅ ACCEPTED (within quota)"
    echo "           Queue position: 1"
else
    echo "           Status: ❌ REJECTED (exceeds ${PER_STUDENT_QUOTA}MB quota)"
fi
echo ""

sleep 1
TIMESTAMP=$(date +"%H:%M:%S")

# Student 2 submission
echo "[$TIMESTAMP] 📨 Student 07: Submitted Neural Network job"
echo "           Memory requested: 720MB"
if [ 720 -le $PER_STUDENT_QUOTA ]; then
    echo "           Status: ✅ ACCEPTED (within quota)"
    echo "           Queue position: 2"
else
    echo "           Status: ❌ REJECTED (exceeds ${PER_STUDENT_QUOTA}MB quota)"
fi
echo ""

sleep 1
TIMESTAMP=$(date +"%H:%M:%S")

# Student 3 submission (exceeds quota)
echo "[$TIMESTAMP] 📨 Student 12: Submitted Large GPU Compute job"
echo "           Memory requested: 1200MB"
if [ 1200 -le $PER_STUDENT_QUOTA ]; then
    echo "           Status: ✅ ACCEPTED (within quota)"
    echo "           Queue position: 3"
else
    echo "           Status: ❌ REJECTED (exceeds ${PER_STUDENT_QUOTA}MB quota)"
    echo "           Reason: Memory request (1200MB) exceeds per-student quota (${PER_STUDENT_QUOTA}MB)"
    echo "           Suggestion: Reduce memory usage or split into smaller jobs"
fi
echo ""

sleep 1

echo "═══════════════════════════════════════════════════════════"
echo "📊 Queue Status:"
echo "   Active jobs: 1"
echo "   Queued jobs: 1"
echo "   Rejected jobs: 1 (quota violation)"
echo ""
echo "Current Execution:"
echo "  ├─ Student 03: ML Training (650MB, 2m 15s remaining)"
echo ""
echo "Queue:"
echo "  ├─ Student 07: Neural Network (720MB, waiting)"
echo ""
echo "Rejected:"
echo "  └─ Student 12: Large Compute (1200MB > ${PER_STUDENT_QUOTA}MB quota)"
echo "═══════════════════════════════════════════════════════════"
echo ""

sleep 2

echo "💡 Fair Sharing in Action!"
echo "   ✅ Jobs within quota: ACCEPTED"
echo "   ❌ Jobs exceeding quota: REJECTED"
echo "   📊 Per-student fairness: ENFORCED"
echo ""

cat << "STATS"
═══════════════════════════════════════════════════════════════
📊 Classroom Statistics (Simulated Day):

Resource Utilization:
├─ GPU usage: 94.3% (vs 45% with manual scheduling)
├─ Jobs completed: 147
├─ Total compute time: 22h 38m
└─ Idle time: 1h 22m (5.7%)

Fairness Metrics:
├─ Average jobs per student: 4.9
├─ Standard deviation: 0.8 (very fair!)
├─ Fairness score: 92.1% ✅
└─ All students got fair access

Quota Enforcement:
├─ Jobs submitted: 152
├─ Jobs accepted: 147 (96.7%)
├─ Jobs rejected: 5 (3.3% - quota violations)
└─ Enforcement: 100% effective

Value Delivered:
├─ 1 GPU → 30 student workstations
├─ Fair access for all students
├─ Zero manual management required
└─ 94.3% resource utilization
═══════════════════════════════════════════════════════════════

🎓 GPU Classroom Manager: Making education accessible and fair!
STATS

echo ""
'''
]

[resources]
cpu_cores = 1.0
memory_mb = 1024
gpu_required = false  # Optional for demo

[security]
isolation = "standard"

