# HuggingFace Image Generation Provider Configuration
# Registers with Songbird at runtime - NO hardcoding in Squirrel/demo!
# Router endpoint FIXED HERE, not in application code!

[provider]
provider_id = "huggingface-sd-1.5"
provider_name = "HuggingFace Stable Diffusion 1.5"
register_with = "songbird"  # Auto-register on startup

# Capabilities this provider offers
[capabilities]
type = "image.generation"

[capabilities.supported]
max_resolution = [768, 768]
formats = ["png", "jpg"]
styles = ["digital_art", "photorealistic", "artistic"]
quality_levels = ["medium"]

# Performance characteristics
[performance]
avg_latency_ms = 45000  # Slower, free tier
min_latency_ms = 30000
max_latency_ms = 120000  # Cold start can be slow
throughput_per_minute = 1
reliability = 0.85  # Free tier less reliable

# Cost information
[cost]
model = "free"
cost_per_unit = 0.00  # Free!
currency = "USD"

# Privacy information
[privacy]
location = "cloud"
data_region = "global"
retention = "temporary"  # May cache for model loading
training_on_data = false
geographic_restrictions = []

# API endpoint configuration
[endpoint]
# ✅ FIXED: Updated router endpoint
base_url = "https://router.huggingface.co"  # NEW ROUTER!
path = "/models/runwayml/stable-diffusion-v1-5"
method = "POST"
auth_type = "bearer"
auth_env_var = "HUGGINGFACE_API_KEY"
timeout_ms = 180000  # Longer timeout for free tier

# Request mapping
[request_mapping]
prompt_field = "inputs"
# HuggingFace uses simple format

# Response mapping
[response_mapping]
image_format = "binary"  # Returns raw image bytes
content_type = "image/png"

# Health check
[health]
enabled = true
endpoint = "https://router.huggingface.co/health"
interval_seconds = 120  # Less frequent for free tier
timeout_seconds = 30

# Rate limiting
[rate_limit]
requests_per_minute = 5  # Free tier limits
requests_per_hour = 30

# Availability
[availability]
enabled = true
auto_register = true
auto_unregister = true
heartbeat_interval_seconds = 60

[metadata]
vendor = "huggingface"  # Internal use only
model = "stable-diffusion-1.5"
version = "v1"
region = "global"
notes = "Free tier, may have cold starts, router endpoint updated Dec 2025"

# Cold start handling
[cold_start]
enabled = true
max_warmup_time_ms = 60000
retry_on_loading = true
max_retries = 3
retry_delay_ms = 10000

