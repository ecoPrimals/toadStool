[package]
name = "akida-characterization"
version = "0.1.0"
edition = "2021"

[workspace]
# This is a standalone workspace

[dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
bytemuck = { version = "1.14", features = ["derive"] }
wgpu = "0.19"

# ToadStool crates
akida-driver = { path = "../../crates/neuromorphic/akida-driver" }
barracuda = { path = "../../crates/barracuda" }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "dense_vs_sparse"
path = "benchmarks/dense_vs_sparse.rs"
