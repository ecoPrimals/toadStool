[package]
name = "barracuda-validation"
version = "0.1.0"
edition = "2021"

[workspace]
# Standalone validation suite

[dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
bytemuck = { version = "1.14", features = ["derive"] }
wgpu = "0.19"

# ToadStool crates  
barracuda = { path = "../../crates/barracuda" }
akida-driver = { path = "../../crates/neuromorphic/akida-driver" }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# ML/Data processing
ndarray = "0.15"

# Homomorphic encryption
tfhe = { version = "0.4", features = ["boolean", "shortint", "integer", "seeder_unix"] }

[[bin]]
name = "mnist_inference"
path = "benchmarks/mnist/mnist_inference.rs"

[[bin]]
name = "kmer_counting"
path = "benchmarks/genomics/kmer_counting.rs"

[[bin]]
name = "aes_benchmark"
path = "benchmarks/crypto/aes_benchmark.rs"

[[bin]]
name = "mnist_npu"
path = "benchmarks/mnist/mnist_npu.rs"

[[bin]]
name = "kmer_npu"
path = "benchmarks/genomics/kmer_npu.rs"

[[bin]]
name = "cross_platform_mlp"
path = "benchmarks/universal/cross_platform_mlp.rs"

[[bin]]
name = "cross_platform_homomorphic"
path = "benchmarks/universal/cross_platform_homomorphic.rs"
