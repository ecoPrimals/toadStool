[package]
name = "toadstool-showcase"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "showcase-real"
path = "src/main.rs"

[[bin]]
name = "toadstool-showcase-distributed"
path = "src/distributed_compute_demo.rs"

[dependencies]
toadstool = { path = "../crates/core/toadstool" }
toadstool-runtime-native = { path = "../crates/runtime/native" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
colored = "2"

