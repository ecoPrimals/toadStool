[package]
name = "toadstool-showcase"
version = "0.1.0"
edition = "2021"
description = "ToadStool showcase demonstrations and real-world examples"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadstool"
keywords = ["showcase", "demos", "examples", "distributed"]
categories = ["development-tools"]

[[bin]]
name = "showcase-real"
path = "src/main.rs"

[[bin]]
name = "toadstool-showcase-distributed"
path = "src/distributed_compute_demo.rs"

[dependencies]
toadstool = { path = "../crates/core/toadstool" }
toadstool-runtime-native = { path = "../crates/runtime/native" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
colored = "2"

