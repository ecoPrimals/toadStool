[package]
name = "hardware-discovery"
version = "0.1.0"
edition = "2021"

# Standalone showcase (not part of main workspace)
[workspace]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# GPU detection via wgpu
wgpu = "0.19"
pollster = "0.3"

# System info
sysinfo = "0.30"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
