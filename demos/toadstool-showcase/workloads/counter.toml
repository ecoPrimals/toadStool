# ToadStool Showcase - Stateful Counter Workload
# Demonstrates live migration between substrates with state preservation

[workload]
id = "counter-migration"
name = "Stateful Counter (Migration Demo)"
description = "Long-running counter demonstrating live migration capabilities"
version = "1.0.0"

[execution]
type = "script"
entry_point = "main"
timeout_seconds = 300
stateful = true

[execution.script]
language = "python"
code = """
#!/usr/bin/env python3
import time
import os
import json
import sys
import signal
from pathlib import Path
from datetime import datetime

# State management
STATE_DIR = Path(os.environ.get('TOADSTOOL_STATE_DIR', '/tmp/toadstool-state'))
STATE_FILE = STATE_DIR / 'counter_state.json'

def ensure_state_dir():
    '''Create state directory if it doesn't exist'''
    STATE_DIR.mkdir(parents=True, exist_ok=True)

def load_state():
    '''Load counter state from disk'''
    if STATE_FILE.exists():
        try:
            with open(STATE_FILE, 'r') as f:
                return json.load(f)
        except:
            pass
    return {'count': 0, 'start_time': datetime.now().isoformat()}

def save_state(state):
    '''Save counter state to disk'''
    ensure_state_dir()
    with open(STATE_FILE, 'w') as f:
        json.dump(state, f, indent=2)

def signal_handler(signum, frame):
    '''Handle graceful shutdown'''
    print("\\n")
    print("🛑 Received shutdown signal")
    print(f"   Saving state at count: {state['count']}")
    save_state(state)
    print("   ✅ State saved successfully")
    sys.exit(0)

# Setup signal handlers for graceful shutdown
signal.signal(signal.SIGINT, signal_handler)
signal.signal(signal.SIGTERM, signal_handler)

# Load initial state
ensure_state_dir()
state = load_state()
substrate = os.environ.get('TOADSTOOL_SUBSTRATE', 'unknown')

print("╔══════════════════════════════════════════════════╗")
print("║     🍄 ToadStool Live Migration Demo           ║")
print("╚══════════════════════════════════════════════════╝")
print("")
print(f"Starting counter from: {state['count']}")
print(f"Running on substrate:  {substrate}")
print(f"State directory:       {STATE_DIR}")
print(f"State file:            {STATE_FILE}")
print("")
print("Instructions:")
print("  • Watch the counter increment")
print("  • In another terminal, run:")
print("    ./scripts/migrate-counter.sh")
print("  • Counter will seamlessly move to another substrate")
print("")
print("Starting count...")
print("")

try:
    while True:
        state['count'] += 1
        state['last_update'] = datetime.now().isoformat()
        state['substrate'] = substrate
        
        # Save state every iteration (for migration)
        save_state(state)
        
        # Display current state
        timestamp = datetime.now().strftime('%H:%M:%S')
        print(f"[{timestamp}] Count: {state['count']:04d} | Substrate: {substrate:12s} | State: Saved ✓")
        
        time.sleep(1)
        
except KeyboardInterrupt:
    signal_handler(signal.SIGINT, None)
"""

[state]
persistent = true
checkpoint_interval_seconds = 1
state_directory = "/tmp/toadstool-state"
backup_enabled = true

[resources]
cpu_cores = 1
memory_mb = 256
disk_mb = 100

[migration]
enabled = true
allow_live = true
checkpoint_on_migrate = true
max_migration_time_seconds = 10

[metadata]
tags = ["demo", "stateful", "migration", "phase3"]
author = "ToadStool Team"
license = "AGPL-3.0"
notes = "This workload demonstrates ToadStool's killer feature: live migration"

