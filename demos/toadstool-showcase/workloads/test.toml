# ToadStool Showcase - Substrate Capability Test
# Tests and displays substrate capabilities

[workload]
id = "substrate-test"
name = "Substrate Capability Test"
description = "Comprehensive test of substrate capabilities and features"
version = "1.0.0"

[execution]
type = "script"
entry_point = "main"
timeout_seconds = 30

[execution.script]
language = "bash"
code = """
#!/bin/bash

SUBSTRATE="${TOADSTOOL_SUBSTRATE:-unknown}"

echo "╔══════════════════════════════════════════════════╗"
echo "║    🍄 ToadStool Substrate Capability Test      ║"
echo "╚══════════════════════════════════════════════════╝"
echo ""
echo "Testing Substrate: $SUBSTRATE"
echo ""

# System Information
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo "System Information:"
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo "  OS:           $(uname -s)"
echo "  Kernel:       $(uname -r)"
echo "  Architecture: $(uname -m)"
echo "  Hostname:     $(hostname)"
echo ""

# Resource Availability
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo "Resource Availability:"
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

if command -v nproc &> /dev/null; then
    echo "  CPUs:    $(nproc) cores"
elif command -v sysctl &> /dev/null; then
    echo "  CPUs:    $(sysctl -n hw.ncpu) cores"
else
    echo "  CPUs:    unknown"
fi

if command -v free &> /dev/null; then
    echo "  Memory:  $(free -h | grep Mem | awk '{print $2}')"
elif command -v sysctl &> /dev/null; then
    BYTES=$(sysctl -n hw.memsize 2>/dev/null || echo "0")
    GB=$((BYTES / 1024 / 1024 / 1024))
    echo "  Memory:  ${GB}GB"
else
    echo "  Memory:  unknown"
fi

if command -v df &> /dev/null; then
    echo "  Disk:    $(df -h / | tail -1 | awk '{print $4}') available"
else
    echo "  Disk:    unknown"
fi

echo ""

# Substrate-Specific Features
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo "Substrate Features:"
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

case "$SUBSTRATE" in
  native)
    echo "  ✓ Native process execution"
    echo "  ✓ Direct system access"
    echo "  ✓ Maximum performance"
    echo "  ✓ Full resource availability"
    echo "  ✓ No overhead"
    echo ""
    echo "  Best for:"
    echo "    • CPU-intensive workloads"
    echo "    • Low-latency requirements"
    echo "    • Direct hardware access"
    ;;
  
  docker)
    echo "  ✓ Container isolation"
    echo "  ✓ Resource limits"
    echo "  ✓ Network isolation"
    echo "  ✓ Filesystem isolation"
    echo "  ✓ Security boundaries"
    echo ""
    echo "  Best for:"
    echo "    • Untrusted code"
    echo "    • Multi-tenant workloads"
    echo "    • Reproducible environments"
    ;;
  
  python)
    echo "  ✓ Python runtime"
    echo "  ✓ Managed environment"
    echo "  ✓ Package isolation"
    echo "  ✓ Virtual environment support"
    echo "  ✓ Dependency management"
    echo ""
    echo "  Best for:"
    echo "    • Python applications"
    echo "    • Data science workloads"
    echo "    • Rapid prototyping"
    ;;
  
  wasm)
    echo "  ✓ WebAssembly sandbox"
    echo "  ✓ Maximum security"
    echo "  ✓ Cross-platform compatibility"
    echo "  ✓ Near-native performance"
    echo "  ✓ Portable bytecode"
    echo ""
    echo "  Best for:"
    echo "    • Maximum security"
    echo "    • Cross-platform code"
    echo "    • Edge deployment"
    ;;
  
  *)
    echo "  ✓ Universal compatibility"
    echo "  ✓ Substrate: $SUBSTRATE"
    echo ""
    echo "  ToadStool supports this substrate!"
    ;;
esac

echo ""

# Capability Tests
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo "Capability Tests:"
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# Test 1: Command execution
echo -n "  Command execution... "
if echo "test" > /dev/null 2>&1; then
    echo "✓"
else
    echo "✗"
fi

# Test 2: File I/O
echo -n "  File I/O...          "
if echo "test" > /tmp/toadstool-test 2>/dev/null && rm /tmp/toadstool-test 2>/dev/null; then
    echo "✓"
else
    echo "✗"
fi

# Test 3: Environment variables
echo -n "  Environment vars...  "
if [ -n "$SUBSTRATE" ]; then
    echo "✓"
else
    echo "✗"
fi

# Test 4: Process ID
echo -n "  Process isolation... "
if [ -n "$$" ]; then
    echo "✓ (PID: $$)"
else
    echo "✗"
fi

echo ""

# Summary
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo "Test Summary:"
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo "  Substrate:  $SUBSTRATE"
echo "  Status:     ✅ PASSED"
echo "  Verdict:    Ready for production workloads"
echo ""
echo "✅ Substrate test complete!"
"""

[resources]
cpu_cores = 1
memory_mb = 128
disk_mb = 10

[metadata]
tags = ["demo", "test", "substrate", "phase4"]
author = "ToadStool Team"
license = "AGPL-3.0"

