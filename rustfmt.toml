# ToadStool — rustfmt configuration
# Aligned with ecoPrimals ecosystem standards
edition = "2021"
max_width = 100
tab_spaces = 4
use_field_init_shorthand = true
use_try_shorthand = true
# NOTE: imports_granularity and group_imports require nightly rustfmt.
# When toolchain moves to nightly-capable fmt, uncomment:
# imports_granularity = "Crate"
# group_imports = "StdExternalCrate"
