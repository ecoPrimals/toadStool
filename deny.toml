# cargo-deny configuration for ToadStool
#
# Enforces license compliance, known vulnerability scanning, and
# crate-level bans aligned with ecoBin (no C-FFI in core path).
#
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# ── Licenses ──────────────────────────────────────────────────────────────────
[licenses]
version = 2
# Allow OSI-approved permissive / weak-copyleft licences.
# AGPL-3.0 is ToadStool's own licence; it appears for workspace crates.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",              # colored crate
    "AGPL-3.0",             # ToadStool own crates (deprecated SPDX form)
    "AGPL-3.0-or-later",   # ToadStool own crates — canonical; scyBorg trio compat
    "LGPL-2.0-or-later",   # wgpu indirect dep (optional)
    "LGPL-2.1-or-later",
]
unused-allowed-license = "allow"

# Per-crate overrides for edge cases.
# ring: defensive clarify — ring is banned but may appear in Cargo.lock as a
# conditional/transitive dep via quinn-proto and rustls-webpki. This entry
# prevents a license error when those paths are resolved.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]


# ── Advisories (CVE / RUSTSEC) ────────────────────────────────────────────────
[advisories]
version = 2
# Block any crate with an active security advisory.
# Exceptions may be added below with justification.
ignore = [
    # INFO (unmaintained): paste has no patched release.
    # Transitive via: metal→wgpu-hal→wgpu (GPU compute), simba→nalgebra→statrs (analytics).
    # Both chains are upstream-controlled; no direct dependency.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (INFO); transitive via wgpu and statrs — await upstream migration to pastey" },
]

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Deny multiple versions of the same crate — keeps the dependency tree lean.
multiple-versions = "warn"
# Warn on wildcard dependencies (workspace path deps use version = "*" by design).
wildcards = "warn"

# Crates banned from the core binary path for ecoBin compliance.
# These are C-FFI crates that must not appear in the toadstool / server / core
# dependency graph. They are allowed in feature-gated GPU/neuromorphic crates.
deny = [
    # ── Pure Rust Crypto Purity Standard (19-crate ban list) ──────────────────
    # Reference: infra/wateringHole/fossilRecord/wave150s_standards/PURE_RUST_CRYPTO_PURITY_STANDARD.md
    # S344: expanded from 8 → 19+ bans per standard.

    # OpenSSL — use rustls + rustls-rustcrypto instead
    { name = "openssl" },
    { name = "openssl-sys" },
    # aws-lc — C FFI crypto; banned per PURE_RUST_CRYPTO_PURITY_STANDARD.md S1/S2.
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    # ring — C/asm crypto; use RustCrypto alternatives (ed25519-dalek, aes-gcm, etc.).
    # License clarified in [[licenses.clarify]]; present in Cargo.lock as a
    # conditional transitive dep via quinn-proto / rustls-webpki (not on default build path).
    { name = "ring" },
    # BoringSSL — Google's OpenSSL fork; same C-FFI concerns.
    { name = "boring" },
    { name = "boring-sys" },
    # Platform TLS — wraps system C crypto (SChannel/SecureTransport/OpenSSL).
    { name = "native-tls" },
    { name = "security-framework-sys" },
    { name = "schannel" },
    # Compression — C FFI shims; use pure Rust alternatives (flate2/rust_backend, ruzstd).
    { name = "zstd-sys" },
    { name = "lz4-sys" },
    # Database — no SQLite C in compute binary.
    { name = "libsqlite3-sys" },
    # System info — replaced by toadstool-sysmon (ecoBin v3.0, S137).
    { name = "sysinfo" },
    # PKCS#11 — C cryptographic token interface.
    { name = "cryptoki-sys" },
    # Build tools — no C bindgen/cmake in core path.
    { name = "bindgen" },
    { name = "cmake" },

    # ── Architectural bans ────────────────────────────────────────────────────
    # async-trait — fully evolved to manual Pin<Box<dyn Future>> and native AFIT (S203r).
    # Transitive via axum/config/wiggle — wrappers until upstream drops it.
    { name = "async-trait", wrappers = ["axum", "axum-core", "config", "wiggle"] },
    # tungstenite WebSocket — removed in R-011; must not return.
    { name = "tungstenite" },
    { name = "tokio-tungstenite" },
    # reqwest — migrated to pure Rust Unix IPC in production (R-008).
    # Policy: reqwest is allowed ONLY behind the optional `http-downloads` feature
    # on toadstool-runtime-edge (excluded from workspace). No core/server/cli crate
    # may depend on it.
    #{ name = "reqwest", reason = "Use unix-jsonrpc-client instead of reqwest in core paths" },
]

# Skip duplicate version check for crates where multiple major versions
# coexist by design (e.g. wgpu requires specific sub-crate versions).
skip = []

# skip-tree: skip ban traversal for subtrees rooted at a workspace crate (e.g. when a banned dep is
# confined to one member). Empty as of 2026-05: ring appears via quinn-proto/rustls-webpki but is
# conditional; toadstool-runtime-secure-enclave uses ruzstd (pure Rust), not zstd-sys.
skip-tree = []

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io and our own workspace.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
