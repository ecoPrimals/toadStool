# cargo-deny configuration for ToadStool
#
# Enforces license compliance, known vulnerability scanning, and
# crate-level bans aligned with ecoBin (no C-FFI in core path).
#
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# ── Licenses ──────────────────────────────────────────────────────────────────
[licenses]
version = 2
# Allow OSI-approved permissive / weak-copyleft licences.
# AGPL-3.0 is ToadStool's own licence; it appears for workspace crates.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",              # colored crate
    "BSD-3-Clause-Clear",   # tfhe (FHE) crates
    "AGPL-3.0",             # ToadStool own crates (deprecated SPDX form)
    "AGPL-3.0-or-later",   # ToadStool own crates — canonical; scyBorg trio compat
    "LGPL-2.0-or-later",   # wgpu indirect dep (optional)
    "LGPL-2.1-or-later",
]
unused-allowed-license = "allow"

# Per-crate overrides for edge cases
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ── Advisories (CVE / RUSTSEC) ────────────────────────────────────────────────
[advisories]
version = 2
# Block any crate with an active security advisory.
# Exceptions may be added below with justification.
ignore = [
    # Transitive unmaintained deps we cannot fix directly:
    { id = "RUSTSEC-2024-0387", reason = "opentelemetry_api: transitive via tracing-opentelemetry, awaiting upstream merge into opentelemetry" },
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive via simba→nalgebra→statrs, no drop-in replacement available" },
    # wasmtime 18: optional dep behind feature-gated `jit` (not compiled by default).
    # WASI advisories are not relevant — we do not expose WASI host functions.
    # Upgrade to wasmtime 29+ is a major migration tracked as future debt.
    { id = "RUSTSEC-2024-0438", reason = "wasmtime: Windows device filenames — Linux-only, WASI not exposed" },
    { id = "RUSTSEC-2025-0046", reason = "wasmtime: fd_renumber host panic — WASI not exposed in our runtime" },
    { id = "RUSTSEC-2025-0118", reason = "wasmtime: shared linear memory unsoundness — optional jit feature, not compiled by default" },
    { id = "RUSTSEC-2026-0020", reason = "wasmtime: WASI resource exhaustion — WASI not exposed in our runtime" },
    { id = "RUSTSEC-2026-0021", reason = "wasmtime: wasi:http fields panic — WASI HTTP not used" },
]

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Deny multiple versions of the same crate — keeps the dependency tree lean.
multiple-versions = "warn"
# Warn on wildcard dependencies (workspace path deps use version = "*" by design).
wildcards = "warn"

# Crates banned from the core binary path for ecoBin compliance.
# These are C-FFI crates that must not appear in the toadstool / server / core
# dependency graph. They are allowed in feature-gated GPU/neuromorphic crates.
deny = [
    # OpenSSL — use rustls + aws-lc-rs / *ring* instead
    { name = "openssl" },
    { name = "openssl-sys" },
    # ring — C/asm crypto; use aws-lc-rs or other pure Rust alternatives
    # Note: ring enters graph via reqwest (dev-dep) → rustls → ring; not in production binary
    #{ name = "ring" },
    # zstd-sys — C FFI for zstd; banned in production paths
    # Note: appears as dev-dep of toadstool-runtime-secure-enclave only
    # Exempted via bans.skip below
    #{ name = "zstd-sys" },
    # tungstenite WebSocket — removed in R-011; must not return
    { name = "tungstenite" },
    { name = "tokio-tungstenite" },
    # reqwest — migrated to pure Rust Unix IPC in production (R-008)
    # reqwest still used in dev/test deps (integration-tests)
    # Commented out: dev-dep only, not in production binary
    #{ name = "reqwest", reason = "Use unix-jsonrpc-client instead of reqwest in core paths" },
]

# Skip duplicate version check for crates where multiple major versions
# coexist by design (e.g. wgpu requires specific sub-crate versions).
skip = [
    { name = "wgpu", reason = "Multi-version wgpu is intentional for vendor-specific backends" },
    { name = "naga", reason = "wgpu dep" },
]

skip-tree = [
    # CUDA / GPU backends bring a dense C-FFI tree that is separately audited.
    { name = "cudarc", reason = "GPU backend — separately audited, feature-gated" },
    # Secure enclave runtime uses zstd (C FFI) as dev-dep only
    { name = "toadstool-runtime-secure-enclave", reason = "zstd-sys is dev-dep only, not in production binary" },
    # Integration tests use reqwest/ring for HTTP testing — not in production binary
    { name = "toadstool-integration-tests", reason = "reqwest + ring are test-only deps" },
]

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io and our own workspace.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
