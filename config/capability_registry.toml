# ToadStool Capability Registry — machine-readable capability declaration
# Wave 78 ecosystem standard | AGPL-3.0-or-later
# Generated from DIRECT_JSONRPC_METHODS + capabilities.list Wire Standard L3
# Version: v0.2.0 | Session: S321+

[meta]
primal = "toadstool"
version = "0.2.0"
protocol = "jsonrpc-2.0"
transport = ["uds", "tcp"]
sockets = ["compute.sock", "compute-tarpc.sock"]
license = "AGPL-3.0-or-later"

[capabilities.compute]
owner = "toadstool"
description = "GPU job queue, hardware dispatch, and performance routing"
methods = [
    "compute.execute",
    "compute.health",
    "compute.version",
    "compute.capabilities",
    "compute.discover_capabilities",
    "compute.submit",
    "compute.status",
    "compute.result",
    "compute.cancel",
    "compute.list",
    "compute.dispatch",
    "compute.dispatch.submit",
    "compute.dispatch.status",
    "compute.dispatch.result",
    "compute.dispatch.forward",
    "compute.dispatch.capabilities",
    "compute.dispatch.pipeline.submit",
    "compute.dispatch.pipeline.status",
    "compute.fan_out",
    "compute.context.init",
]

[capabilities.hardware_learning]
owner = "toadstool"
description = "Hardware observation, distillation, and autonomous init"
methods = [
    "compute.hardware.observe",
    "compute.hardware.distill",
    "compute.hardware.apply",
    "compute.hardware.share_recipe",
    "compute.hardware.auto_init",
    "compute.hardware.auto_init_all",
    "compute.hardware.status",
    "compute.hardware.vfio_devices",
]

[capabilities.performance_routing]
owner = "toadstool"
description = "All-silicon tolerance-based performance routing"
methods = [
    "compute.performance_surface.report",
    "compute.performance_surface.query",
    "compute.performance_surface.list",
    "compute.route.multi_unit",
]

[capabilities.workload]
owner = "toadstool"
description = "High-level workload executor (multi-runtime)"
