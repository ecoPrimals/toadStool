[package]
name = "barracuda"
version = "0.2.0"
edition = "2021"
authors = ["ToadStool Team <team@toadstool.bio>"]
description = "Hardware-agnostic tensor compute library using WebGPU (WGSL)"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/toadStool"
readme = "README.md"
keywords = ["gpu", "tensor", "compute", "webgpu", "wgsl"]
categories = ["science", "hardware-support"]

[dependencies]
# Core — anyhow removed S66: evolved to typed BarracudaError via thiserror
thiserror = { workspace = true }

# GPU compute (WebGPU - hardware agnostic, handles CPU/GPU/NPU/TPU!)
# Optional: enable with the "gpu" feature for GPU acceleration.
# Without GPU, barracuda provides CPU-only math (special, numerical, linalg).
wgpu = { workspace = true, optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }

# Sovereign compiler: naga as a library for WGSL parsing + SPIR-V emission.
# Same version as wgpu 22 to guarantee type compatibility.
naga = { version = "22.1", features = ["wgsl-in", "spv-out"], optional = true }

# Async runtime (needed for all async operations)
tokio = { version = "1.35", features = ["sync", "time", "macros", "rt-multi-thread"] }
async-trait = "0.1"

# NPU support (pure Rust Akida driver)
akida-driver = { path = "../neuromorphic/akida-driver" }

# ToadStool hardware layer
toadstool-core = { path = "../toadstool-core" }  # Hardware infrastructure

# Logging
tracing = "0.1"

# Utilities
etcetera = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# once_cell, lazy_static removed: evolved to std::sync::LazyLock (Rust 1.80+, pure std)
# dashmap removed: evolved to std::sync::RwLock<HashMap> — zero external dep, read-heavy access ideal fit
rand = "0.8"
rayon = "1.8"
blake3 = "1.5"
num-traits = "0.2"  # Generic numeric traits for CPU precision implementations
half = "2.4"        # f16 support for quantized inference (GGUF/safetensors)
# num_cpus removed: evolved to std::thread::available_parallelism() (pure Rust, no FFI)

# Benchmarking: evolved from chrono to std::time::SystemTime (S64)

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1.35", features = ["full"] }
approx = "0.5"
proptest = { workspace = true }
wgpu = { workspace = true }

[lints.clippy]
unwrap_used = "warn"

[features]
default = ["gpu"]

# GPU acceleration via wgpu/WebGPU. Without this, only CPU math is available.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:naga"]

# Serialization support for calibration caching
serde = []

# Parallel execution support (rayon-based cascade processing)
parallel = []

# TPU support
tpu = []
cloud-tpu = ["tpu"]      # Google Cloud TPU via libtpu
coral-tpu = ["tpu"]      # Coral Edge TPU
mock-tpu = ["tpu"]       # Mock TPU for testing

# Benchmarking (no external deps — uses std::time)
benchmarks = []
cuda-comparison = ["benchmarks"]

# PPPM debug output (verbose charge/potential mesh dumps)
debug-pppm = []

# Unidirectional pipeline feature
unidirectional = []

[[bin]]
name = "bench_fp64_ratio"
required-features = ["gpu"]

[[bin]]
name = "bench_wgsize_nvk"
required-features = ["gpu"]

[[bin]]
name = "bench_f64_builtins"
required-features = ["gpu"]

[[bench]]
name = "unidirectional_benchmark"
harness = false
