[package]
name = "neurobench-runner"
version = "0.1.0"
edition.workspace = true
authors = ["ToadStool Team <team@toadstool.bio>"]
description = "Pure Rust NeuroBench harness for Akida benchmarking"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["neuromorphic", "benchmark", "akida", "spiking", "neurobench"]
categories = ["science", "hardware-support"]

[dependencies]
# Akida driver
akida-driver = { path = "../akida-driver" }

# Data handling
serde = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

# Time measurement: evolved to std::time::Instant (pure Rust, no external dep)

[[bin]]
name = "neurobench"
path = "src/bin/neurobench.rs"

[dev-dependencies]
approx = "0.5"
tempfile = "3"

[lints]
workspace = true

