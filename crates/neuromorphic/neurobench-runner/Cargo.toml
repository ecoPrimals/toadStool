[package]
name = "neurobench-runner"
version = "0.1.0"
edition = "2021"
authors = ["ToadStool Team <team@toadstool.bio>"]
description = "Pure Rust NeuroBench harness for Akida benchmarking"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/toadStool"
readme = "README.md"
keywords = ["neuromorphic", "benchmark", "akida", "spiking", "neurobench"]
categories = ["science", "hardware-support"]

[dependencies]
# Akida driver
akida-driver = { path = "../akida-driver" }

# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "fs"] }

# Data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Random number generation (for test data)
rand = "0.8"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Time measurement: evolved to std::time::Instant (pure Rust, no external dep)

[[bin]]
name = "neurobench"
path = "src/bin/neurobench.rs"

[dev-dependencies]
approx = "0.5"
