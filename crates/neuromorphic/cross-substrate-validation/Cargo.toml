[package]
name = "cross-substrate-validation"
version.workspace = true
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Cross-substrate validation benchmark: CPU vs GPU vs Neuromorphic"
license.workspace = true
repository.workspace = true
keywords = ["benchmark", "validation", "neuromorphic", "gpu"]
categories = ["science", "hardware-support"]

[dependencies]
# ToadStool runtimes
toadstool-runtime-universal = { path = "../../runtime/universal", default-features = false, features = ["cpu"] }
akida-driver = { path = "../akida-driver" }
akida-models = { path = "../akida-models" }

# Core
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["runtime"]
runtime = ["dep:tokio", "toadstool-runtime-universal/runtime"]

[lib]
name = "cross_substrate_validation"
path = "src/lib.rs"

[[bin]]
name = "cross-substrate-benchmark"
path = "src/main.rs"
required-features = ["runtime"]

[[bin]]
name = "cross-substrate-comprehensive"
path = "src/bin/comprehensive_benchmark.rs"
required-features = ["runtime"]

[lints]
workspace = true
