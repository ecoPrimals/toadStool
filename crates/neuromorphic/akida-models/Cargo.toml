[package]
name = "akida-models"
version = "0.1.0"
edition.workspace = true
authors = ["ToadStool Team"]
description = "Akida neural network model parser and loader"
license.workspace = true
repository.workspace = true
keywords = ["akida", "neuromorphic", "model", "parser", "ai"]
categories = ["parser-implementations", "science"]

[dependencies]
# Error handling
thiserror = { workspace = true }

# Zero-copy binary data (Arc<[u8]>-style sharing for model weights)
bytes = { workspace = true }


# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
akida-driver = { path = "../akida-driver" }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Stubs are opt-in: default library builds must not ship NeuroBench stub generators.
# Use `--features dev-stubs` for `model_zoo` or tests that need `create_stub_model`.
default = []
dev-stubs = []

[lib]
crate-type = ["rlib"]

[[bin]]
name = "model_zoo"
path = "src/bin/model_zoo.rs"
required-features = ["dev-stubs"]

[[example]]
name = "parse_fbz"
path = "examples/parse_fbz.rs"

[[example]]
name = "benchmark_parser"
path = "examples/benchmark_parser.rs"

[[example]]
name = "load_to_device"
path = "examples/load_to_device.rs"

[[example]]
name = "benchmark_loading"
path = "examples/benchmark_loading.rs"

[[example]]
name = "run_inference"
path = "examples/run_inference.rs"

[[example]]
name = "benchmark_inference"
path = "examples/benchmark_inference.rs"

[lints]
workspace = true

