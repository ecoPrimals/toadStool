[package]
name = "akida-driver"
version = "0.1.0"
edition = "2021"
authors = ["ToadStool Team"]
description = "Pure Rust driver for BrainChip Akida neuromorphic processors"
license = "AGPL-3.0-or-later"
repository = "https://github.com/easilylazy/toadstool"
keywords = ["akida", "neuromorphic", "ai", "driver", "hardware"]
categories = ["hardware-support", "science"]

[dependencies]
# Error handling
thiserror = { workspace = true }
anyhow = "1"

# Logging
tracing = "0.1"

# Safe byte casting (replaces unsafe f32<->u8 conversions)
bytemuck = { version = "1", features = ["derive"] }

# System utilities — evolved to pure Rust (Feb 21, 2026)
# `which` replaced by find_in_path() in setup.rs
# `glob` replaced by read_hwmon_power() in backends/mod.rs

# Async runtime (optional)
tokio = { version = "1", features = ["fs", "io-util"], optional = true }

# Unix-specific - Pure Rust Evolution (Feb 17, 2026)
# - mmap/munmap/mlock/munlock: rustix (pure Rust)
# - VFIO ioctls: libc (kernel-specific, not in rustix)
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0", features = ["fs", "mm"] }
# libc only for VFIO ioctl() syscall - rustix doesn't cover kernel-specific ioctls
# All other syscalls (mmap, mlock, etc.) use rustix
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.5"

[features]
default = []
async = ["tokio"]

[[example]]
name = "enumerate_devices"
path = "examples/enumerate_devices.rs"

[[example]]
name = "basic_io"
path = "examples/basic_io.rs"

[[example]]
name = "device_info"
path = "examples/device_info.rs"

[[example]]
name = "setup_npu"
path = "examples/setup_npu.rs"

[lib]
crate-type = ["rlib"]
