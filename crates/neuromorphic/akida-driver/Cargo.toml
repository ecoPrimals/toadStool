[package]
name = "akida-driver"
version = "0.1.0"
edition = "2021"
authors = ["ToadStool Team"]
description = "Pure Rust driver for BrainChip Akida neuromorphic processors"
license = "AGPL-3.0-or-later"
repository = "https://github.com/easilylazy/toadstool"
keywords = ["akida", "neuromorphic", "ai", "driver", "hardware"]
categories = ["hardware-support", "science"]

[dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# Safe byte casting (replaces unsafe f32<->u8 conversions)
bytemuck = { version = "1", features = ["derive"] }

# System utilities
which = "6.0"
glob = "0.3"  # For hwmon power discovery

# Async runtime (optional)
tokio = { version = "1", features = ["fs", "io-util"], optional = true }

# Unix-specific - Pure Rust Evolution (Feb 12, 2026)
# OLD: libc + nix (C bindings)
# NEW: rustix (safe Rust syscall wrappers)
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0", features = ["fs", "mm"] }
libc = "0.2"  # For VFIO ioctls (minimal C interface)

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.5"

[features]
default = []
async = ["tokio"]

[[example]]
name = "enumerate_devices"
path = "examples/enumerate_devices.rs"

[[example]]
name = "basic_io"
path = "examples/basic_io.rs"

[[example]]
name = "device_info"
path = "examples/device_info.rs"

[[example]]
name = "setup_npu"
path = "examples/setup_npu.rs"

[lib]
crate-type = ["rlib"]
