[package]
name = "akida-driver"
version.workspace = true
edition.workspace = true
authors = ["ToadStool Team"]
description = "Pure Rust driver for BrainChip Akida neuromorphic processors"
license.workspace = true
repository.workspace = true
keywords = ["akida", "neuromorphic", "ai", "driver", "hardware"]
categories = ["hardware-support", "science"]

[dependencies]
# Silicon model — pure types & constants (register maps, BAR layout, NP mesh)
akida-chip = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Zero-copy binary data for model program and inference results
bytes = { workspace = true }

# Logging
tracing = { workspace = true }
toadstool-common = { path = "../../core/common" }

# Safe byte casting (replaces unsafe f32<->u8 conversions)
bytemuck = { version = "1", features = ["derive"] }

# Async runtime (optional — only for async evolution/sentinel paths)
tokio = { workspace = true, optional = true }

# Unix-specific - Pure Rust Evolution (ecoBin compliant, Mar 2026)
[target.'cfg(unix)'.dependencies]
toadstool-hw-safe = { path = "../../core/hw-safe" }
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }

[features]
default = []
async    = ["dep:tokio"]
kernel   = []
test-mocks = []

[[example]]
name = "enumerate_devices"
path = "examples/enumerate_devices.rs"

[[example]]
name = "basic_io"
path = "examples/basic_io.rs"

[[example]]
name = "device_info"
path = "examples/device_info.rs"

[[example]]
name = "setup_npu"
path = "examples/setup_npu.rs"

[lib]
crate-type = ["rlib"]

# Cannot use `workspace = true` here: workspace forbids unsafe; this crate needs targeted unsafe in
# VFIO/mmap/DMA modules. Deny at crate level, allow only on modules that require it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
dead_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
type_complexity = "allow"
struct_field_names = "allow"
similar_names = "allow"
many_single_char_names = "allow"
needless_pass_by_ref_mut = "allow"
trivially_copy_pass_by_ref = "allow"
too_many_arguments = "allow"
unreadable_literal = "allow"
needless_range_loop = "allow"
option_if_let_else = "allow"
manual_let_else = "allow"
assigning_clones = "allow"
no_effect_underscore_binding = "allow"
or_fun_call = "allow"
unnecessary_wraps = "allow"
needless_for_each = "allow"
match_wildcard_for_single_variants = "allow"
if_same_then_else = "allow"
collection_is_never_read = "allow"
branches_sharing_code = "allow"

