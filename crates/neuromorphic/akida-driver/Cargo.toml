[package]
name = "akida-driver"
version.workspace = true
edition.workspace = true
authors = ["ToadStool Team"]
description = "Pure Rust driver for BrainChip Akida neuromorphic processors"
license.workspace = true
repository.workspace = true
keywords = ["akida", "neuromorphic", "ai", "driver", "hardware"]
categories = ["hardware-support", "science"]

[dependencies]
# Error handling
thiserror = { workspace = true }

# Zero-copy binary data for model program and inference results
bytes = { workspace = true }

# Logging
tracing = { workspace = true }
toadstool-common = { path = "../../core/common" }

# Safe byte casting (replaces unsafe f32<->u8 conversions)
bytemuck = { version = "1", features = ["derive"] }

# System utilities — evolved to pure Rust (Feb 21, 2026)
# `which` replaced by find_in_path() in setup.rs
# `glob` replaced by read_hwmon_power() in backends/mod.rs


# Unix-specific - Pure Rust Evolution (ecoBin compliant, Mar 2026)
# - mmap/munmap/mlock/munlock: rustix (pure Rust)
# - VFIO ioctls: rustix::ioctl (pure Rust, no C deps)
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "mm"] }
toadstool-hw-safe = { path = "../../core/hw-safe" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }

[features]
default = []
test-mocks = []

[[example]]
name = "enumerate_devices"
path = "examples/enumerate_devices.rs"

[[example]]
name = "basic_io"
path = "examples/basic_io.rs"

[[example]]
name = "device_info"
path = "examples/device_info.rs"

[[example]]
name = "setup_npu"
path = "examples/setup_npu.rs"

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

