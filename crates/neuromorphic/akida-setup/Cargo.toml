[package]
name = "akida-setup"
version = "0.1.0"
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Setup and configuration utility for Akida neuromorphic hardware"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["akida", "neuromorphic", "setup", "hardware"]
categories = ["hardware-support", "development-tools"]

[[bin]]
name = "akida-setup"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
glob = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

