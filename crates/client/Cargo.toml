# Re-enabled in parent workspace: reqwest removed, Unix JSON-RPC only.
# See: crates/core/common/src/unix_jsonrpc_client.rs

[package]
name = "toadstool-client"
version = "0.1.0"
edition = "2021"
description = "ToadStool universal compute client library (tarpc evolved to Unix sockets)"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["client", "compute", "distributed", "rpc"]
categories = ["api-bindings", "network-programming"]

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core dependencies
toadstool = { path = "../core/toadstool" }
toadstool-config = { path = "../core/config" }
toadstool-common = { path = "../core/common" }

# HTTP client and networking
# PURE RUST: reqwest removed - unix sockets only! ✅
url = "2.4"

# WebSocket support (optional)
tokio-tungstenite = { version = "0.20", optional = true }
futures-util = { version = "0.3", optional = true }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# UUID support
uuid = { version = "1.0", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Base64 encoding (for basic auth)
base64 = "0.21"

[features]
default = ["websocket"]
websocket = ["tokio-tungstenite", "futures-util"]

[dev-dependencies]
tokio-test = "0.4"
