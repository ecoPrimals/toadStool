# Re-enabled in parent workspace: reqwest removed, Unix JSON-RPC only.
# See: crates/core/common/src/unix_jsonrpc_client.rs

[package]
name = "toadstool-client"
version.workspace = true
edition.workspace = true
description = "ToadStool universal compute client library (tarpc evolved to Unix sockets)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["client", "compute", "distributed", "rpc"]
categories = ["api-bindings", "network-programming"]

[dependencies]
# Core dependencies
toadstool = { path = "../core/toadstool", default-features = false }
toadstool-config = { path = "../core/config", default-features = false }
toadstool-common = { path = "../core/common", default-features = false }

# HTTP client and networking
url = { workspace = true }

# Async runtime (optional — gated behind `runtime` for WASM compat)
tokio = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# UUID support
uuid = { workspace = true }

# tarpc client (optional - for primal-to-primal RPC)
tarpc = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
toadstool-integration-protocols = { path = "../integration/protocols", optional = true }

[features]
default = ["runtime"]
runtime = ["dep:tokio", "toadstool/runtime", "toadstool-config/runtime", "toadstool-common/runtime", "uuid/v4"]
tarpc = ["runtime", "dep:tarpc", "dep:tokio-util", "dep:bytes", "dep:toadstool-integration-protocols", "toadstool-integration-protocols/tarpc-transport"]

[dev-dependencies]
tokio-test = { workspace = true }
temp-env = { workspace = true }

[lints]
workspace = true

