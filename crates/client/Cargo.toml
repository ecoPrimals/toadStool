# Re-enabled in parent workspace: reqwest removed, Unix JSON-RPC only.
# See: crates/core/common/src/unix_jsonrpc_client.rs

[package]
name = "toadstool-client"
version = "0.1.0"
edition.workspace = true
description = "ToadStool universal compute client library (tarpc evolved to Unix sockets)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["client", "compute", "distributed", "rpc"]
categories = ["api-bindings", "network-programming"]

[dependencies]
# Core dependencies
toadstool = { path = "../core/toadstool" }
toadstool-config = { path = "../core/config" }
toadstool-common = { path = "../core/common" }

# HTTP client and networking
# PURE RUST: reqwest removed - unix sockets only! ✅
url = { workspace = true }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = "0.1"

# UUID support
uuid = { version = "1.0", features = ["v4", "serde"] }

# base64 removed: no usage found in source

# tarpc client (optional - for primal-to-primal RPC)
tarpc = { workspace = true, optional = true }
tokio-util = { version = "0.7", optional = true }
bytes = { workspace = true, optional = true }
toadstool-integration-protocols = { path = "../integration/protocols", optional = true }

[features]
default = []
tarpc = ["dep:tarpc", "dep:tokio-util", "dep:bytes", "dep:toadstool-integration-protocols"]

[dev-dependencies]
tokio-test = "0.4"
temp-env = "0.3"

[lints]
workspace = true

