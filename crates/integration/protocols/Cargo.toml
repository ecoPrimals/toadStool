[package]
name = "toadstool-integration-protocols"
version.workspace = true
edition.workspace = true
description = "ToadStool communication protocols and service discovery"
license.workspace = true
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["protocols", "integration", "primal", "rpc"]
categories = ["api-bindings", "network-programming"]

[features]
default = []
networking = []

[dependencies]
# Core ToadStool types
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }

# RPC frameworks
tarpc = { workspace = true }

# HTTP client

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = "0.1"

# UUID support
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
