[package]
name = "toadstool-integration-protocols"
version.workspace = true
edition.workspace = true
description = "ToadStool communication protocols and service discovery"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["protocols", "integration", "primal", "rpc"]
categories = ["api-bindings", "network-programming"]

[features]
default = []
networking = []
tarpc-transport = []
# MessagePack + length-delimited framing (`tarpc::serde_transport`) for Rust-to-Rust peers
binary-transport = ["tarpc-transport", "dep:tokio-serde", "dep:tokio-util", "dep:futures"]

[dependencies]
# Core ToadStool types
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }

# RPC frameworks
tarpc = { workspace = true }

# HTTP client

# Async runtime
tokio = { workspace = true }

# Binary framing (optional; `binary-transport` feature)
futures = { workspace = true, optional = true }
tokio-serde = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

# Serialization (rc for Arc<str> zero-copy serialization)
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
bytes = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# UUID support
uuid = { workspace = true }

[dev-dependencies]
temp-env = "0.3"
tempfile = { workspace = true }
tokio-test = "0.4"

[lints]
workspace = true

