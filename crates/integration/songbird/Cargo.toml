[package]
name = "toadstool-integration-songbird"
version.workspace = true
edition.workspace = true
description = "ToadStool Songbird ecosystem integration"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }

# Async runtime and utilities
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# HTTP client for Songbird API communication
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization and deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging and tracing
tracing = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"
