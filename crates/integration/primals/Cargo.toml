[package]
name = "toadstool-integration-primals"
version.workspace = true
edition.workspace = true
description = "Primal integration framework for biomeOS orchestration"
authors = ["ToadStool Team <team@toadstool.io>"]
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://toadstool.io"
keywords = ["biomeOS", "primals", "orchestration", "integration"]
categories = ["science", "network-programming"]

[dependencies]
# Core dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

# HTTP client for service communication

# Workspace dependencies
toadstool-config = { path = "../../core/config" }
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-integration-storage = { path = "../storage" }

[dev-dependencies]
tokio-test = { workspace = true }
mockall = "0.12"
proptest = { workspace = true }

[features]
default = []

[lints]
workspace = true
