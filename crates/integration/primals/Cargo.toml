[package]
name = "toadstool-integration-primals"
version = "0.1.0"
edition.workspace = true
description = "Primal integration framework for biomeOS orchestration"
authors = ["ToadStool Team <team@toadstool.io>"]
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://toadstool.io"
keywords = ["biomeOS", "primals", "orchestration", "integration"]
categories = ["science", "network-programming"]

[dependencies]
# Core dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"
thiserror = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

# HTTP client for service communication

# Workspace dependencies
toadstool-config = { path = "../../core/config" }
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-integration-storage = { path = "../storage" }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
proptest = "1.0"

[features]
default = ["full"]
full = ["security", "squirrel", "storage"]
security = []
squirrel = []
storage = []
# Exposes `mock_primal::MockPrimal` for tests / explicit consumers — not default
test-mocks = []

[lints]
workspace = true
