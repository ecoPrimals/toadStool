[package]
name = "toadstool-integration-primals"
version = "0.1.0"
edition = "2021"
description = "Primal integration framework for biomeOS orchestration"
authors = ["ToadStool Team <team@toadstool.io>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
homepage = "https://toadstool.io"
keywords = ["biomeOS", "primals", "orchestration", "integration"]
categories = ["science", "network-programming"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

# HTTP client for service communication
reqwest = { version = "0.12", features = ["json"] }

# Workspace dependencies
toadstool-config = { path = "../../core/config" }
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-integration-orchestrator = { path = "../orchestrator" }
toadstool-integration-nestgate = { path = "../nestgate" }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"
proptest = "1.0"

[features]
default = ["full"]
full = ["beardog", "squirrel", "nestgate"]
beardog = []
squirrel = []
nestgate = [] 