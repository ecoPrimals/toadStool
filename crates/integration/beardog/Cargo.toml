[package]
name = "toadstool-integration-beardog"
version = "0.1.0"
edition = "2021"
readme = "README.md"
keywords = ["entropy", "rng", "beardog", "capability-discovery", "deep-debt"]
categories = ["cryptography", "algorithms"]
authors = ["ToadStool Team"]
license.workspace = true
description = "bearDog entropy integration for high-quality random number generation"
repository.workspace = true

[dependencies]
# Core dependencies
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }
async-trait = { workspace = true }

# ToadStool core
toadstool-common = { path = "../../core/common" }

# HTTP client for bearDog discovery/communication

[dev-dependencies]
tokio-test = { workspace = true }
temp-env = "0.3"

[lints]
workspace = true

[features]
default = []

# Testing features
testing = []
mock-beardog = []  # Mock bearDog for testing without real service
