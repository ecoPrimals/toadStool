[package]
name = "toadstool-integration-storage"
version.workspace = true
edition.workspace = true
description = "ToadStool NestGate storage and data pipeline integration"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["storage", "integration", "nestgate", "primal"]
categories = ["api-bindings"]

[dependencies]
# HTTP client

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
toadstool-config = { path = "../../core/config" }
toadstool-common = { path = "../../core/common" }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# UUID support
uuid = { workspace = true }

# Binary data encoding for artifact transfer
base64 = { workspace = true }

# Cryptographic hashing (for checksums)
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true

