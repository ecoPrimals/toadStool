[package]
name = "toadstool-integration-storage"
version.workspace = true
edition.workspace = true
description = "ToadStool NestGate storage and data pipeline integration"
license.workspace = true
repository.workspace = true
keywords = ["storage", "integration", "nestgate", "primal"]
categories = ["api-bindings"]

[dependencies]
# Async runtime (optional — gated behind `runtime` for WASM compat)
tokio = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
toadstool-config = { path = "../../core/config", default-features = false }
toadstool-common = { path = "../../core/common", default-features = false }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# UUID support
uuid = { workspace = true }

# Binary data encoding for artifact transfer
base64 = { workspace = true }

# Cryptographic hashing (for checksums)
sha2 = { workspace = true }

[features]
default = ["runtime"]
runtime = ["dep:tokio", "toadstool-config/runtime", "toadstool-common/runtime", "uuid/v4"]

[dev-dependencies]
tokio-test = { workspace = true }

[lints]
workspace = true

