[package]
name = "toadstool-integration-security"
version.workspace = true
edition.workspace = true
readme = "README.md"
keywords = ["entropy", "rng", "beardog", "capability-discovery", "deep-debt"]
categories = ["cryptography", "algorithms"]
authors = ["ToadStool Team"]
license.workspace = true
description = "bearDog entropy integration for high-quality random number generation"
repository.workspace = true

[dependencies]
# Core dependencies
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }

# ToadStool core
toadstool-common = { path = "../../core/common" }

# OS-level entropy
getrandom = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
temp-env = { workspace = true }

[lints]
workspace = true

[features]
default = []
