[package]
name = "toadstool-integration-security"
version.workspace = true
edition.workspace = true
readme = "README.md"
keywords = ["entropy", "rng", "beardog", "capability-discovery", "deep-debt"]
categories = ["cryptography", "algorithms"]
authors = ["ToadStool Team"]
license.workspace = true
description = "bearDog entropy integration for high-quality random number generation"
repository.workspace = true

[dependencies]
# Core dependencies
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

# ToadStool core
toadstool-common = { path = "../../core/common", default-features = false }

# OS-level entropy
getrandom = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio-test = { workspace = true }
temp-env = { workspace = true }

[lints]
workspace = true

[features]
default = ["runtime"]
runtime = ["dep:tokio", "toadstool-common/runtime"]
