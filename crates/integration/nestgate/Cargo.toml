[package]
name = "toadstool-integration-nestgate"
version.workspace = true
edition.workspace = true
description = "ToadStool NestGate storage and data pipeline integration"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["storage", "integration", "nestgate", "primal"]
categories = ["api-bindings"]

[dependencies]
# HTTP client

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toadstool-config = { path = "../../core/config" }
toadstool-common = { path = "../../core/common" }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = "0.1"

# UUID support
uuid = { version = "1.0", features = ["v4", "serde"] }

# Binary data encoding for artifact transfer
base64 = "0.22"

# Cryptographic hashing (for checksums)
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true

