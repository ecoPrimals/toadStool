[package]
name = "toadstool-integration-nestgate"
version.workspace = true
edition.workspace = true
description = "ToadStool NestGate storage and data pipeline integration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["storage", "integration", "nestgate", "primal"]
categories = ["api-bindings"]

[dependencies]
# HTTP client

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toadstool-config = { path = "../../core/config" }
toadstool-common = { path = "../../core/common" }

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# UUID support
uuid = { version = "1.0", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Base64 encoding (for artifact data)
base64 = "0.21"

# Cryptographic hashing (for checksums)
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
