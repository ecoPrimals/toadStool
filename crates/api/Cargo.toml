[package]
name = "toadstool-api"
version = "0.1.0"
edition = "2021"
description = "Modern API and interface layer for ToadStool"
license.workspace = true
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["api", "rest", "graphql", "web", "http"]
categories = ["web-programming::http-server"]

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-management-monitoring = { path = "../management/monitoring" }
# toadstool-management-analytics = { path = "../management/analytics" }  # Disabled: has sqlx/ring dependency
toadstool-distributed = { path = "../distributed" }
toadstool-config = { path = "../core/config" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Modern web framework with middleware
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", features = ["make", "util", "timeout", "load-shed", "limit"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "timeout", "validate-request", "compression-br", "compression-gzip", "auth"] }
hyper = { version = "1.0", features = ["full"] }

# OpenAPI and documentation
utoipa = { version = "4.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }
utoipa-redoc = { version = "3.0", features = ["axum"] }
utoipa-rapidoc = { version = "3.0", features = ["axum"] }

# Serialization with validation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.16", features = ["derive"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = { workspace = true }

# Configuration
config = "0.14"

# Caching
moka = { version = "0.12", features = ["future"] }

[dev-dependencies]
toadstool-testing = { path = "../testing" }
tokio-test = "0.4"
axum-test = "14.0"
tempfile = "3.8"
proptest = "1.4"