[package]
name = "toadstool-api"
version = "0.1.0"
edition = "2021"
description = "Advanced API and interface layer for ToadStool"
license = "MIT OR Apache-2.0"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-management-monitoring = { path = "../management/monitoring" }
toadstool-management-analytics = { path = "../management/analytics" }
toadstool-distributed = { path = "../distributed" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["make"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WebSocket support
futures-util = "0.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# CLI interface
clap = { version = "4.0", features = ["derive"] }
console = "0.15"
indicatif = "0.17"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.14" 