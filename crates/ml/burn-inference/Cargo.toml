[package]
name = "burn-inference"
version = "0.1.0"
edition = "2024"
authors = ["ToadStool Team <team@toadstool.bio>"]
description = "HuggingFace model inference via Burn (wgpu backend)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["ml", "inference", "burn", "wgpu", "huggingface"]
categories = ["science", "machine-learning"]

[dependencies]
# Burn ML framework with wgpu backend (GPU)
burn = { version = "0.16", features = ["default"] }
burn-wgpu = "0.16"
burn-tch = { version = "0.16", optional = true }

# For model loading
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tokenizers for NLP models
tokenizers = { version = "0.20", optional = true, default-features = false }

# Image processing for vision models
image = { version = "0.25", optional = true }

# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

# Error handling
thiserror = "2.0"

# Byte manipulation
bytemuck = { version = "1.14", features = ["derive"] }

# Half-precision floats (for GGUF/safetensors f16)
half = "2.4"

# Logging
tracing = "0.1"

[features]
default = ["wgpu"]
wgpu = []
tch = ["burn-tch"]
nlp = ["tokenizers"]
vision = ["image"]

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
approx = "0.5"
