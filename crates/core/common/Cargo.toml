[package]
name = "toadstool-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Common utilities and types for ToadStool"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tracing = { workspace = true }
sysinfo = { workspace = true }
humantime-serde = "1.1"

# EVOLVED: Pure Rust UID detection (removed libc dependency!)
# libc = "0.2"  # NO LONGER NEEDED - using pure Rust uid_detector!

# Infant discovery dependencies
async-trait = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
base64 = "0.22"
semver = { version = "1.0.27", features = ["serde"] }

# mDNS discovery (pure Rust, cross-platform)
mdns-sd = "0.10"

[dev-dependencies]
tokio-test = { workspace = true }
tokio = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
temp-env = "0.3"

[features]
default = [] 
