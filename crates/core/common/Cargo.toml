[package]
name = "toadstool-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Common utilities and types for ToadStool"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# EVOLVED: sysinfo removed (Mar 9, 2026) — replaced by toadstool-sysmon
humantime-serde = "1.1"
zeroize = { version = "1.7", features = ["derive"] }

# EVOLVED: Pure Rust UID detection (removed libc dependency!)
# libc = "0.2"  # NO LONGER NEEDED - using pure Rust uid_detector!

# Infant discovery dependencies
async-trait = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
base64 = "0.22"
semver = { version = "1.0.27", features = ["serde"] }

# mDNS bootstrap discovery (Songbird's domain; cold-start only)
mdns-sd = { version = "0.10", optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
tokio = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
temp-env = { version = "0.3", features = ["async_closure"] }

[features]
default = ["mdns"]
# mDNS bootstrap discovery (Songbird's domain; use for cold-start only)
mdns = ["dep:mdns-sd"]

[lints]
workspace = true

