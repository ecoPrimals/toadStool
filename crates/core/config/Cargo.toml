[package]
name = "toadstool-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Configuration management for ToadStool - Zero hardcoding hierarchical configuration system"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints.clippy]
# Production-grade safety lints  
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync"] }
thiserror = { workspace = true }
# once_cell removed: evolved to std::sync::LazyLock (Rust 1.80+)
tracing = { workspace = true }
validator = { version = "0.18", features = ["derive"] }
# File watching (Pure Rust Evolution - Jan 17, 2026)
# notify 6.x uses inotify-sys on Linux (C FFI to kernel inotify).
# Acceptable: inotify is a thin kernel syscall wrapper, not a heavy C library.
# Future: consider rustix-backed watcher or polling fallback for pure Rust.
notify = "6.1"
chrono = { workspace = true }
# ring = "0.17"  # REMOVED: Unused, violates pure Rust principle (C dependency)
base64 = "0.22"
async-trait = "0.1"
semver = "1.0"
url = "2.5"

# File system and path handling (Pure Rust Evolution - Jan 17, 2026)
# OLD: directories = "5.0" (pulls in dirs-sys with C FFI)
# NEW: etcetera = "0.8" (100% Pure Rust!)
etcetera = "0.8"

# Internal dependencies
toadstool-common = { path = "../common" }

# Note: mDNS discovery available via toadstool crate (when needed for tests)
# Production code uses cache-based discovery; full mDNS via toadstool::discovery

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
# num_cpus removed: use std::thread::available_parallelism() instead (pure Rust, no FFI)

[features]
default = [] 