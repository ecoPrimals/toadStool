[package]
name = "toadstool-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Configuration management for ToadStool - Zero hardcoding hierarchical configuration system"
keywords.workspace = true
categories.workspace = true

[lints.clippy]
# Production-grade safety lints  
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync"] }
thiserror = { workspace = true }
once_cell = { workspace = true }
tracing = { workspace = true }
validator = { version = "0.18", features = ["derive"] }
notify = "4.0"
chrono = { workspace = true }
ring = "0.17"
base64 = "0.22"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
semver = "1.0"
num_cpus = "1.16"
url = "2.5"

# File system and path handling
directories = "5.0"

# Internal dependencies
toadstool-common = { path = "../common" }

# Note: mDNS discovery available via toadstool crate (when needed for tests)
# Production code uses cache-based discovery; full mDNS via toadstool::discovery

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
serial_test = "3.0"

[features]
default = [] 