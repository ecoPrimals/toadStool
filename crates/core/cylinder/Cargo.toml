[package]
name = "toadstool-cylinder"
version.workspace = true
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Sovereign hardware driver layer — DRM/VFIO ioctl dispatch (Phase C absorption from coral-driver)"
license.workspace = true
repository.workspace = true
keywords = ["gpu", "drm", "vfio", "hardware", "driver"]
categories = ["hardware-support", "os::linux-apis"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
object = { version = "0.39.1", features = ["read", "write"] }
ruzstd = { workspace = true }
toml = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toadstool-common = { path = "../../core/common" }
toadstool-ember = { path = "../ember" }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
toadstool-hw-safe = { path = "../hw-safe" }

[[bin]]
name = "rm_trigger"
path = "src/bin/rm_trigger/main.rs"

[[bin]]
name = "sovereign_acr_boot"
path = "src/bin/sovereign_acr_boot.rs"

[[bin]]
name = "sovereign_pmu_boot"
path = "src/bin/sovereign_pmu_boot.rs"

[[bin]]
name = "capture_pmu_falcon"
path = "src/bin/capture_pmu_falcon.rs"

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["vfio"]
vfio = []
amd = []
test-utils = []

[lints]
workspace = true
