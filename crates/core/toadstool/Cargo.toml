[package]
name = "toadstool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "ToadStool Universal Compute Platform - Core library for universal execution"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Core dependencies
toadstool-common = { path = "../common" }
toadstool-config = { path = "../config" }

# Hardware discovery
akida-driver = { path = "../../neuromorphic/akida-driver" }
barracuda = { path = "../../barracuda" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = { workspace = true }
serde_yaml = { workspace = true }

# Unique identifiers
uuid = { version = "1.0", features = ["v4"] }

# Time handling
humantime-serde = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# System monitoring
sysinfo = { workspace = true }

# Encoding
base64 = "0.22"

# Security
zeroize = { version = "1.7", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Regex for security hardening
regex = "1.0"

# Validation
validator = { version = "0.18", features = ["derive"] }
mdns-sd = "0.10"
# MUST use same version as workspace to prevent duplicate symbol errors  
wgpu = { workspace = true, optional = true }
pollster = { version = "0.3", optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
temp-env = "0.3"
toadstool-testing = { path = "../../testing" }

[features]
default = []
# Networking is now always available (reqwest is standard dependency)
# This feature kept for backward compatibility but does nothing
networking = []
# Full ecosystem features
full-ecosystem = [] 
wgpu = ["dep:wgpu", "dep:pollster"]
# Development mock auth - allows mock signatures when no signing key configured
# WARNING: Do not enable in production builds
dev-mock-auth = []
