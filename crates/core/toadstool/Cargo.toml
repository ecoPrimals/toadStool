[package]
name = "toadstool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "ToadStool Universal Compute Platform - Core library for universal execution"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Core dependencies
toadstool-common = { path = "../common" }
toadstool-config = { path = "../config" }

# Hardware discovery
akida-driver = { path = "../../neuromorphic/akida-driver" }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }

# Serialization (rc for Arc<str> zero-copy in storage types)
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
bytes = { workspace = true }

# Unique identifiers
uuid = { workspace = true }

# Time handling
humantime-serde = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Property-test strategies (`proptest_strategies` module) — optional for downstream crates
proptest = { workspace = true, optional = true }

# System monitoring — Pure Rust via /proc (replaces sysinfo)
toadstool-sysmon = { workspace = true }

# Encoding
base64 = { workspace = true }

# Security
zeroize = { version = "1.7", features = ["derive"] }

libloading = { workspace = true, optional = true }

mdns-sd = { version = "0.10", optional = true }
# MUST use same version as workspace to prevent duplicate symbol errors  
wgpu = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
toadstool-testing = { path = "../../testing" }
proptest = { workspace = true }

[features]
# S206: test-mocks removed from default — production builds no longer compile mock backends.
# Run `cargo test --features test-mocks` for InMemory/mock test targets.
default = ["mdns"]
# Real `dlopen`/`dlclose` plugin loading (`libloading`). Omit from default so unit tests
# without `.so` fixtures keep simulated load/unload unless this feature is enabled.
plugin-loading = ["dep:libloading"]
# In-memory auth mock (`InMemoryAuthBackend`); for tests and explicit `--features test-mocks`
test-mocks = []
# Gates reqwest-based HTTP communication in ecosystem modules
networking = []
wgpu = ["dep:wgpu"]
# Marker for WASM runtime probe in StubRuntimeEngine (wired by CLI `wasm` feature).
wasm-runtime = []
# mDNS bootstrap discovery (songBird's domain -- use for cold-start only)
mdns = ["dep:mdns-sd"]
# Proptest generators for workload/resource types (`crate::proptest_strategies`).
proptest-strategies = ["dep:proptest"]

[[test]]
name = "biomeos_auth_coverage_tests"
path = "tests/test_mocks/biomeos_auth_coverage_tests.rs"
required-features = ["test-mocks"]

[[test]]
name = "biomeos_backend_comprehensive_tests"
path = "tests/test_mocks/biomeos_backend_comprehensive_tests.rs"
required-features = ["test-mocks"]

[[test]]
name = "biomeos_auth_tests"
path = "tests/test_mocks/biomeos_auth_tests.rs"
required-features = ["test-mocks"]

[lints]
workspace = true

