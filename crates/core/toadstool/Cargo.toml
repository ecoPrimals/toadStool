[package]
name = "toadstool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "ToadStool Universal Compute Platform - Core library for universal execution"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Core dependencies
toadstool-common = { path = "../common" }
toadstool-config = { path = "../config" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { workspace = true }

# Unique identifiers
uuid = { version = "1.0", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }
thiserror = "1.0"

# System monitoring
sysinfo = "0.30"
num_cpus = "1.16"

# Encoding
base64 = "0.22"

# Security
zeroize = { version = "1.7", features = ["derive"] }

# Networking for ecosystem integration (now standard - ToadStool is distributed)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.23", optional = true }

# Regex for security hardening
regex = "1.0"

# Validation
validator = "0.16"
mdns-sd = "0.10"
# MUST use same version as workspace to prevent duplicate symbol errors  
wgpu = { workspace = true, optional = true }
pollster = { version = "0.3", optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
toadstool-testing = { path = "../../testing" }

[features]
default = []
# Networking is now always available (reqwest is standard dependency)
# This feature kept for backward compatibility but does nothing
networking = []
# WebSocket support (optional)
websocket = ["tokio-tungstenite"]
# Full ecosystem features
full-ecosystem = ["websocket"] 
wgpu = ["dep:wgpu", "dep:pollster"]
