[package]
name = "nvpmu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sovereign GPU power management for NVIDIA GPUs — pure Rust, no firmware dependency"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["gpu", "nvidia", "power-management", "pmu"]
categories = ["hardware-support", "science"]

[dependencies]
toadstool-common = { path = "../common", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
hw-learn = { path = "../hw-learn" }
toadstool-hw-safe = { path = "../hw-safe" }

[[bin]]
name = "nvpmu-apply"
path = "src/bin/nvpmu_apply.rs"

[[bin]]
name = "nvpmu-monitor"
path = "src/bin/nvpmu_monitor.rs"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

