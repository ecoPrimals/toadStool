[package]
name = "hw-learn"
version = "0.1.0"
edition.workspace = true
description = "Vendor-neutral GPU hardware learning — observe, distill, apply compute init patterns across AMD/Intel/NVIDIA"
license.workspace = true
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["gpu", "hardware-learning", "compute-init", "vendor-neutral"]
categories = ["hardware-support", "science"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toadstool-sysmon = { path = "../sysmon" }
proptest = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies.rustix]
workspace = true
features = ["fs"]

[features]
default = []
proptest-strategies = ["dep:proptest"]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

