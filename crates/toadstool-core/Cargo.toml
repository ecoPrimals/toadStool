[package]
name = "toadstool-core"
version.workspace = true
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Core hardware infrastructure layer for ToadStool compute primals"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["hardware", "infrastructure", "compute", "npu"]
categories = ["hardware-support", "development-tools"]

[dependencies]
toadstool-common = { path = "../core/common", default-features = false }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
# Full akida backend requires akida-driver + rustChip/akida-chip (biomeGate-only, C5)
akida = []

[lints]
workspace = true

