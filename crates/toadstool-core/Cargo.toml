[package]
name = "toadstool-core"
version = "0.1.0"
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Core hardware infrastructure layer for ToadStool compute primals"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["hardware", "infrastructure", "compute", "npu"]
categories = ["hardware-support", "development-tools"]

[dependencies]
thiserror = { workspace = true }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }

# For NPU backend selection
akida-driver = { path = "../neuromorphic/akida-driver" }

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true

