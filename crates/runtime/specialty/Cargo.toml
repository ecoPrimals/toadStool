[package]
name = "toadstool-runtime-specialty"
version.workspace = true
edition.workspace = true
description = "Specialty Hardware Runtime for ToadStool - Mainframes, embedded systems, industrial controllers, and exotic platforms"
authors = ["ToadStool Team <team@toadstool.dev>"]
license.workspace = true
repository.workspace = true
categories = ["embedded", "hardware-support", "computation"]
keywords = ["specialty", "mainframe", "embedded", "industrial", "universal-compute"]

[dependencies]
# Core dependencies
tokio = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

bytes = { workspace = true }

# Industrial control protocols
modbus = { version = "1.0", optional = true }

# ToadStool core
toadstool = { path = "../../core/toadstool", default-features = false }
toadstool-common = { path = "../../core/common", default-features = false }

[features]
default = ["runtime"]
runtime = ["dep:tokio", "toadstool/runtime", "toadstool-common/runtime", "uuid/v4"]
embedded-placeholder-impls = []
modbus-transport = ["modbus"]

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
