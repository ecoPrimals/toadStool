[package]
name = "toadstool-runtime-legacy"
version = "0.1.0"
edition = "2021"
description = "Legacy systems runtime engine for ToadStool Universal Compute Platform"
authors = ["ToadStool Team <team@toadstool.dev>"]
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/toadstool"
categories = ["embedded", "legacy", "computation"]
keywords = ["legacy", "mainframe", "embedded", "industrial", "universal-compute"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"

# Legacy system communication
serialport = "4.0"
rexpect = "0.5"
telnet = "0.2"
ssh2 = "0.9"
regex = "1.0"
encoding = "0.2"
bytes = "1.0"

# Mainframe and enterprise systems
ibm-mq = { version = "0.1", optional = true }
cobol-parser = { version = "0.2", optional = true }
jcl-parser = { version = "0.1", optional = true }
ebcdic = "1.0"
fixed-width = "0.1"

# Embedded systems
embedded-hal = { version = "1.0", optional = true }
# arduino-hal = { version = "0.1", optional = true }  # Temporarily disabled - not available on crates.io
nb = "1.0"
void = "1.0"
cortex-m = { version = "0.7", optional = true }

# Cross-compilation support
cc = "1.0"
bindgen = { version = "0.65", optional = true }
cross = { version = "0.2", optional = true }

# Industrial control protocols
modbus = "1.0"
ethercat = { version = "0.2", optional = true }
canbus = { version = "0.3", optional = true }
profinet = { version = "0.1", optional = true }

# Legacy networking
netbios = { version = "0.1", optional = true }
ipx = { version = "0.1", optional = true }
decnet = { version = "0.1", optional = true }

# Real-time systems
real-time-for-the-masses = { version = "0.6", optional = true }
vxworks-sys = { version = "0.1", optional = true }
qnx-sys = { version = "0.1", optional = true }

# ToadStool core
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }

[features]
default = ["mainframe", "embedded", "industrial"]
mainframe = ["ibm-mq", "cobol-parser", "jcl-parser"]
embedded = ["cortex-m", "bindgen"]  # arduino-hal temporarily removed
industrial = ["ethercat", "canbus", "profinet"]
legacy-networking = ["netbios", "ipx", "decnet"]
real-time = ["real-time-for-the-masses", "vxworks-sys", "qnx-sys"]
cross-compilation = ["cross", "bindgen"]
all = ["mainframe", "embedded", "industrial", "legacy-networking", "real-time", "cross-compilation"]

[build-dependencies]
cc = "1.0"
bindgen = { version = "0.65", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0" 