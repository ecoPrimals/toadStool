[package]
name = "toadstool-runtime-edge"
version = "0.1.0"
edition.workspace = true
authors = ["ToadStool Team"]
description = "Edge/IoT runtime engine for ToadStool Universal Compute Platform"
license.workspace = true
repository.workspace = true

[dependencies]
# Core dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
# Cache keys / sketch filenames — SHA-256 (RustCrypto), not MD5
sha2 = { workspace = true }

# Edge-specific dependencies
# default-features = false: avoids libudev-sys (C dep) for ecoBin pure-Rust compliance.
# Pure-Rust serial on top of OS TTY APIs; no practical no_std replacement for host USB-UART.
serialport = { version = "4.3", default-features = false, optional = true }
embedded-hal = "1.0"
rppal = { version = "0.17", optional = true }
esp-idf-sys = { version = "0.34", optional = true }
# Use the `cross` *binary* (`cargo install cross`) for toolchains — not the crates.io `cross` crate
# (that crate pulls clap 3 + extra deps and is unrelated to this runtime's `Command`-based toolchains).
# C build dependencies - only needed for native bindings
cc = { version = "1.0", optional = true }
bindgen = { version = "0.69", optional = true }

# Network and communication
# mdns removed: MDNSDiscovery is a stub with no mDNS usage; use mdns-sd for consistency

# HTTP client for file downloads (optional - used by ESP32 download_file when path is URL)
# reqwest 0.13 defaults to aws-lc-rs instead of ring for rustls crypto — aligns with deny.toml ring ban.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls"] }
# Pure Rust udev parsing - reading /sys/class directly instead of libudev
# Removed: udev = "0.8" (uses libudev C library)
# Removed: libudev = "0.3" (C library dependency)

# Cross-compilation support
# cargo-cross = "0.2"  # Not available on crates.io, use `cross` binary directly
# cross-toolchain = "0.1"  # Not available on crates.io

[features]
# Default features: zero C dependencies for ecoBin compliance
default = []
# USB-UART serial discovery and communication (opt-in; not in `default`)
serial-transport = ["serialport"]
# Platform-specific features (enable as needed)
raspberry-pi = ["rppal"]
# ESP32 support requires esp-idf-sys (C dependency) - not in default
esp32 = ["esp-idf-sys"]
all-platforms = ["raspberry-pi", "esp32"]
# Enable HTTP downloads for ESP32 (e.g. OTA firmware URLs)
http-downloads = ["reqwest"]
# Enable C build dependencies for native bindings (only if needed)
native-bindings = ["cc", "bindgen"]