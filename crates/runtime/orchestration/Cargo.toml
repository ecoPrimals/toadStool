[package]
name = "toadstool-runtime-orchestration"
version.workspace = true
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Intelligent workload orchestration across compute substrates"
license.workspace = true
repository.workspace = true
keywords = ["orchestration", "runtime", "workload", "scheduling"]
categories = ["development-tools", "hardware-support"]

[dependencies]
# Core dependencies
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# ToadStool internal
toadstool-runtime-universal = { path = "../universal", default-features = false, features = ["cpu"] }
toadstool-sysmon = { path = "../../core/sysmon" }

[features]
default = ["runtime"]
runtime = ["dep:tokio", "toadstool-runtime-universal/runtime"]

[dev-dependencies]
tokio-test = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true
