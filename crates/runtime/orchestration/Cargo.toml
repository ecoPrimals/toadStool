[package]
name = "toadstool-runtime-orchestration"
version = "0.1.0"
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Intelligent workload orchestration across compute substrates"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["orchestration", "runtime", "workload", "scheduling"]
categories = ["development-tools", "hardware-support"]

[dependencies]
# Core dependencies
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

# ToadStool internal
toadstool-runtime-universal = { path = "../universal" }
toadstool-config = { path = "../../core/config" }
toadstool-sysmon = { path = "../../core/sysmon" }

# Concurrency
futures = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[lints]
workspace = true

