[package]
name = "toadstool-display"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
authors = ["Toadstool Team"]
description = "Display and input backend for ecoPrimals (drm/evdev use kernel FFI via libc)"
license.workspace = true
keywords = ["display", "input", "drm", "evdev", "pure-rust"]
categories = ["gui", "graphics", "hardware-support"]

[dependencies]
# Display management (Pure Rust! ARM64 compatible!)
drm = "0.14"                # Safe DRM/KMS bindings (Pure Rust, no linux-unsafe!)
drm-fourcc = "2.2"          # Pixel format definitions (Pure Rust!)
rustix = { version = "1.1", features = ["fs", "all-apis"] }  # Safe system calls (Pure Rust!) — evolved from 0.38 to 1.x Ioctl trait pattern (S203)

# Input handling (Pure Rust!)
evdev = "0.13"              # Pure Rust evdev (NO libevdev!)

# Serial transport (wraps edge crate's serialport capability)
# default-features = false: avoids libudev-sys (C dep) for ecoBin pure-Rust compliance.
# Port enumeration still works; may return less detail or stale entries.
serialport = { version = "4.3", optional = true, default-features = false }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }

# IPC
tarpc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
uuid = { workspace = true }

# Common utilities
toadstool-common = { path = "../../core/common" }

# Cold-start port defaults (shared registry; see `toadstool_config::defaults::ports`)
toadstool-config = { path = "../../core/config" }

# Safe hardware primitives (DeviceMmap for V4L2 buffer mapping)
toadstool-hw-safe = { path = "../../core/hw-safe" }

# Core hardware transport traits
toadstool-core = { path = "../../toadstool-core" }

# System monitoring (GPU discovery, PCIe topology)
toadstool-sysmon = { path = "../../core/sysmon" }

[dev-dependencies]
tokio-test = "0.4"
criterion = { workspace = true }
tracing-subscriber = "0.3"
tempfile = { workspace = true }
temp-env = { version = "0.3", features = ["async_closure"] }
toadstool-core = { path = "../../toadstool-core" }


[features]
default = []
# Test doubles for router / handler tests — not in default (see `#[cfg(any(test, feature = "test-mocks"))]`).
test-mocks = []
# Enable serial transport (USB/UART) for edge device bridging
serial-transport = ["serialport"]

[[test]]
name = "transport_integration_tests"
path = "tests/transport_integration_tests.rs"
required-features = ["test-mocks"]

[lints]
workspace = true

