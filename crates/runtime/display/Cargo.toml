[package]
name = "toadstool-display"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/ecoPrimals/toadStool"
authors = ["Toadstool Team"]
description = "Display and input backend for ecoPrimals (drm/evdev use kernel FFI via libc)"
license.workspace = true
keywords = ["display", "input", "drm", "evdev", "pure-rust"]
categories = ["gui", "graphics", "hardware-support"]

[dependencies]
# Display management (Pure Rust! ARM64 compatible!)
drm = "0.14"                # Safe DRM/KMS bindings (Pure Rust, no linux-unsafe!)
drm-fourcc = "2.2"          # Pixel format definitions (Pure Rust!)
rustix = { version = "0.38", features = ["fs", "mm", "process", "io_uring"] }  # Safe system calls (Pure Rust!)

# Input handling (Pure Rust!)
evdev = "0.13"              # Pure Rust evdev (NO libevdev!)

# Optional: GPU buffer management (Pure Rust!)
gbm = { version = "0.15", optional = true }  # For zero-copy GPU rendering

# Serial transport (wraps edge crate's serialport capability)
# default-features = false: avoids libudev-sys (C dep) for ecoBin pure-Rust compliance.
# Port enumeration still works; may return less detail or stale entries.
serialport = { version = "4.3", optional = true, default-features = false }

# Async runtime
tokio = { workspace = true }
futures = "0.3"

# IPC
tarpc = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }

# Common utilities
toadstool-common = { path = "../../core/common" }

# Core hardware transport traits
toadstool-core = { path = "../../toadstool-core" }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
tracing-subscriber = "0.3"
tempfile = "3"
temp-env = "0.3"
toadstool-core = { path = "../../toadstool-core" }


[features]
default = []
# Use rustix instead of linux-drm (fallback)
rustix-backend = []
# Enable serial transport (USB/UART) for edge device bridging
serial-transport = ["serialport"]
