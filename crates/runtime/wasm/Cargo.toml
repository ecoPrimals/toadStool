[package]
name = "toadstool-runtime-wasm"
version.workspace = true
edition.workspace = true
description = "ToadStool WebAssembly runtime engine with Wasmtime and WASI support"

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = { workspace = true }

# WebAssembly runtime
wasmtime = "20.0.0"
wasmtime-wasi = "20.0.0"
wasi-common = "20.0.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { workspace = true }

# Utilities
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
log = "0.4"
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# System integration
reqwest = { version = "0.12.0", features = ["stream"], optional = true }
tempfile = { workspace = true }
md5 = "0.7"
sha2 = "0.10"
hex = "0.4"
num_cpus = "1.16"

[features]
default = ["url-module-loading"]
url-module-loading = ["dep:reqwest"]

# ⚠️ UNSAFE FEATURE: Enable unsafe `Module::deserialize()` for extreme performance
# 
# **DEFAULT**: 100% safe Rust with intelligent compilation pooling (<5% slower)
# **THIS FEATURE**: Unsafe deserialization (requires trusting cached bytes)
#
# Philosophy: We prioritize safety. Unsafe is opt-in for specialized needs.
# Most users should NOT enable this feature.
unsafe-fast-cache = []

[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tokio-test = { workspace = true }
tempfile = { workspace = true }
wat = "1.0"
