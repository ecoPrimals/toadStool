[package]
name = "toadstool-runtime-wasm"
version.workspace = true
edition.workspace = true
description = "ToadStool WebAssembly runtime engine with wasmi and WASI support"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["wasm", "webassembly", "wasmi", "wasi"]
categories = ["wasm", "development-tools"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool", default-features = false }
toadstool-common = { path = "../../core/common", default-features = false }
bytes = { workspace = true }

# Async runtime (optional — gated behind `runtime` for WASM compat)
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# wasmi 1.0 — Pure Rust WASM interpreter (instant startup, zero C deps)
wasmi = { version = "1.0", features = ["std"] }
wasmi_wasi = { version = "1.0", optional = true }

# WAT format support
wat = "1.0"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { version = "1.7", default-features = false, features = ["serde"] }
tracing = { workspace = true }
sha2 = { workspace = true }

[features]
default = ["runtime"]
runtime = ["dep:tokio", "dep:futures", "dep:wasmi_wasi", "toadstool/runtime", "toadstool-common/runtime", "uuid/v4"]

[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tokio-test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

