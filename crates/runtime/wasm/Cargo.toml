[package]
name = "toadstool-runtime-wasm"
version.workspace = true
edition.workspace = true
description = "ToadStool WebAssembly runtime engine with Wasmtime and WASI support"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["wasm", "webassembly", "wasmtime", "wasi"]
categories = ["wasm", "development-tools"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
bytes = { workspace = true }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = { workspace = true }

# WebAssembly runtime - Pure Rust Evolution (Jan 17, 2026)
# 
# OLD: wasmtime 20.0.0 (JIT compiler with C dependencies)
#   ❌ C code in wasmtime-runtime (signal handling)
#   ❌ C code in wasmtime-fiber (stack switching)
#   ❌ C code in Cranelift JIT
#   ❌ Blocked ARM cross-compilation
#   ✅ Fast execution (~10x faster than interpreter)
#   ⚠️ Higher memory (JIT code)
#   ⚠️ Slower startup (JIT compilation)
#
# NEW: wasmi 1.0.7 (Pure Rust interpreter - STABLE!)
#   ✅ 100% Pure Rust (ZERO C dependencies!)
#   ✅ Trivial ARM cross-compilation
#   ✅ Instant startup (no JIT warmup)
#   ✅ Lower memory usage
#   ✅ Better security (no JIT exploits)
#   ⚠️ Slower execution (~10x slower than JIT)
#   ✅ PERFECT for ToadStool's short-lived WASM workloads!
#
# Architectural Decision: Short WASM (seconds-minutes) via wasmi interpreter.
# For truly long WASM compute: Phase 2 will orchestrate wasmtime as subprocess.
# This achieves 100% Pure Rust core while supporting all workload types!
wasmi = { version = "1.0", features = ["std"] }
wasmi_wasi = { version = "1.0" }

# Kept for development/testing WAT format
wat = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = { workspace = true }

# Utilities
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = { workspace = true }
# System integration
tempfile = { workspace = true }
sha2 = "0.10"
hex = "0.4"

[features]
# PURE RUST: default features simplified
default = []

# Component model support (Phase 2 - wasmtime subprocess)
component-model = []

# ⚠️ UNSAFE FEATURE: Enable unsafe for extreme performance (DEPRECATED for wasmi)
# wasmi is 100% safe by default, so this feature is kept for API compatibility only
unsafe-fast-cache = []

[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tokio-test = { workspace = true }
tempfile = { workspace = true }
# wat moved to main dependencies (needed for wasmi parsing)

[lints]
workspace = true

