[package]
name = "toadstool-runtime-secure-enclave"
version = "0.1.0"
edition = "2021"
authors = ["ToadStool Contributors"]
description = "Secure enclave runtime for zero-knowledge compute"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadstool"
keywords = ["security", "enclave", "zero-knowledge", "cryptography"]
categories = ["cryptography", "no-std"]

[dependencies]
# Core ToadStool
toadstool-common = { path = "../../core/common" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Compression (Pure Rust Evolution - Jan 17, 2026)
# OLD: zstd, lz4 (both pulled in C dependencies via zstd-sys, lz4-sys)
# NEW: 100% Pure Rust alternatives for NestGate decompression support!
lz4_flex = "0.11"  # Pure Rust LZ4 implementation
ruzstd = "0.8"  # Pure Rust Zstd implementation (no C dependencies!)

# Cryptography
aes-gcm = "0.10"
# blake3: Pure Rust mode (no C/ASM optimizations for TRUE cross-compile!)
blake3 = { version = "1.5", default-features = false, features = ["std", "pure"] }
getrandom = { version = "0.2", features = ["std"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Memory management
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3.8"

[build-dependencies]
# None yet

[features]
default = []
gpu-compute = [] # Future: GPU-accelerated processing
hardware-enclave = [] # Future: SGX/SEV support

[[bench]]
name = "performance"
harness = false

