[package]
name = "toadstool-runtime-secure-enclave"
version.workspace = true
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Secure enclave runtime for zero-knowledge compute"
license.workspace = true
repository.workspace = true
keywords = ["security", "enclave", "zero-knowledge", "cryptography"]
categories = ["cryptography", "no-std"]

[dependencies]
# Core ToadStool
toadstool-common = { path = "../../core/common", default-features = false }

# Compression (Pure Rust Evolution - Jan 17, 2026)
# OLD: zstd, lz4 (both pulled in C dependencies via zstd-sys, lz4-sys)
# NEW: 100% Pure Rust alternatives for NestGate decompression support!
lz4_flex = { version = "0.13", default-features = false, features = ["safe-decode"] }  # Pure Rust LZ4, safe-decode prevents RUSTSEC-2026-0041
ruzstd = { workspace = true }  # Pure Rust Zstd implementation (no C dependencies!)

# Cryptography — encryption/decryption delegated to BearDog via Tower Atomic
# (crypto.encrypt / crypto.decrypt over JSON-RPC Unix socket).
# blake3 kept for local tamper-evident audit chain hashing (latency-critical,
# no network round-trip; pure Rust mode for ecoBin cross-compilation).
blake3 = { version = "1.5", default-features = false, features = ["std", "pure"] }

# Serialization
serde_json = { workspace = true }

# Logging & tracing
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
toadstool-hw-safe = { path = "../../core/hw-safe" }
rustix = { workspace = true, features = ["mm"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
default = []

[lints]
workspace = true
