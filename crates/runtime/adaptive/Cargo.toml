[package]
name = "toadstool-runtime-adaptive"
version.workspace = true
edition.workspace = true
readme = "README.md"
keywords = ["gpu", "optimization", "adaptive", "performance", "runtime"]
categories = ["algorithms", "hardware-support", "science"]
authors = ["ToadStool Team"]
license.workspace = true
description = "Adaptive optimization system for barraCuda GPU operations"
repository.workspace = true

[dependencies]
# Core dependencies
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

# GPU runtime (optional — only needed for live GPU fingerprinting)
wgpu = { workspace = true, optional = true }

# ToadStool core
toadstool-common = { path = "../../core/common" }

# Pure Rust directory discovery
etcetera = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[features]
default = ["gpu-discovery"]
gpu-discovery = ["dep:wgpu"]


[lints]
workspace = true

