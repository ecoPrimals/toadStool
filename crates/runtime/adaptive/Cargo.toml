[package]
name = "toadstool-runtime-adaptive"
version = "0.1.0"
edition.workspace = true
readme = "README.md"
keywords = ["gpu", "optimization", "adaptive", "performance", "runtime"]
categories = ["algorithms", "hardware-support", "science"]
authors = ["ToadStool Team"]
license.workspace = true
description = "Adaptive optimization system for barraCuda GPU operations"
repository.workspace = true

[dependencies]
# Core dependencies
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }

# GPU runtime
wgpu = { workspace = true }

# ToadStool core
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }

# Pure Rust directory discovery
etcetera = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
criterion = "0.5"
proptest = "1.0"

[features]
default = []

# Telemetry (opt-in)
telemetry = []

# Testing
testing = []

# [[bench]]
# name = "adaptive_benchmarks"
# harness = false
