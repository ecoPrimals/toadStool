[package]
name = "toadstool-runtime-universal"
version = "0.1.0"
edition = "2021"
authors = ["ToadStool Contributors"]
description = "Universal Compute Runtime - CPU, GPU, and future compute paradigms unified"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["compute", "runtime", "gpu", "wasm"]
categories = ["development-tools", "hardware-support"]

[dependencies]
# Core dependencies
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

# ToadStool runtimes
toadstool-runtime-native = { path = "../native" }
toadstool-runtime-gpu = { path = "../gpu", optional = true }

# GPU backends (all optional, capability-based discovery)
ocl = { version = "0.19", optional = true }
wgpu = { workspace = true, optional = true }  # EVOLVED: Pure Rust! (no renderdoc) ✅
bytemuck = { version = "1.14", features = ["derive", "extern_crate_alloc"], optional = true }
futures-intrusive = { version = "0.5", optional = true }

# For CPU parallelism and discovery
rayon = "1.8"

# Hardware learning (optional)
hw-learn = { path = "../../core/hw-learn", optional = true }
toadstool-sysmon = { path = "../../core/sysmon", optional = true }

[features]
default = ["cpu", "wgpu-backend"]
cpu = []
opencl = ["ocl", "toadstool-runtime-gpu/opencl"]
wgpu-backend = ["dep:wgpu", "bytemuck", "futures-intrusive"]
hardware-learning = ["hw-learn", "toadstool-sysmon"]
all = ["cpu", "opencl", "wgpu-backend", "hardware-learning"]

[dev-dependencies]
criterion = "0.5"

