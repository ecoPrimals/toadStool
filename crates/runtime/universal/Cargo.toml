[package]
name = "toadstool-runtime-universal"
version = "0.1.0"
edition = "2021"
authors = ["ToadStool Contributors"]
description = "Universal Compute Runtime - CPU, GPU, and future compute paradigms unified"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadStool"
readme = "README.md"
keywords = ["compute", "runtime", "gpu", "wasm"]
categories = ["development-tools", "hardware-support"]

[dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }

# ToadStool runtimes
toadstool-runtime-native = { path = "../native" }
toadstool-runtime-gpu = { path = "../gpu", optional = true }

# GPU backends (all optional, capability-based discovery)
ocl = { version = "0.19", optional = true }
wgpu = { version = "22", optional = true }  # Updated to match barraCUDA framework
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
futures-intrusive = { version = "0.5", optional = true }

# For CPU parallelism and discovery
rayon = "1.8"
num_cpus = "1.16"

[features]
default = ["cpu", "wgpu-backend"]
cpu = []
opencl = ["ocl", "toadstool-runtime-gpu/opencl"]
wgpu-backend = ["dep:wgpu", "pollster", "bytemuck", "futures-intrusive"]
all = ["cpu", "opencl", "wgpu-backend"]

[dev-dependencies]
criterion = "0.5"

