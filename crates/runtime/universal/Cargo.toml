[package]
name = "toadstool-runtime-universal"
version.workspace = true
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Universal Compute Runtime - CPU, GPU, and future compute paradigms unified"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["compute", "runtime", "gpu", "wasm"]
categories = ["development-tools", "hardware-support"]

[dependencies]
# Core dependencies
toadstool-common = { path = "../../core/common", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# ToadStool core (silicon unit types)
toadstool-core = { path = "../../toadstool-core" }

# GPU backends (all optional, capability-based discovery)
wgpu = { workspace = true, optional = true }
toadstool-runtime-gpu = { path = "../../runtime/gpu", default-features = false, features = ["webgpu"], optional = true }
bytemuck = { workspace = true }

# For CPU parallelism and discovery
rayon = { version = "1.8", optional = true }

# Hardware learning (optional)
hw-learn = { path = "../../core/hw-learn", optional = true }
toadstool-sysmon = { path = "../../core/sysmon", optional = true }

[features]
default = ["cpu", "runtime"]
cpu = ["dep:rayon"]
runtime = ["dep:tokio", "toadstool-common/runtime", "wgpu-backend"]
wgpu-backend = ["dep:wgpu", "dep:toadstool-runtime-gpu"]
hardware-learning = ["hw-learn", "toadstool-sysmon"]
all = ["cpu", "wgpu-backend", "hardware-learning", "runtime"]

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true
