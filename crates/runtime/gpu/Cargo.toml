[package]
name = "toadstool-runtime-gpu"
version.workspace = true
edition.workspace = true
description = "ToadStool Universal GPU Compute Runtime - If it has parallel compute units, we can harness it"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["gpu", "compute", "cuda", "opencl", "webgpu"]
categories = ["hardware-support", "science"]

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { workspace = true }

# HTTP client for distributed execution

# Utilities
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
log = "0.4"
anyhow = "1.0"
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# Concurrency primitives (for unified memory)
dashmap = "6.0"
parking_lot = "0.12"

# System integration and monitoring
sysinfo = { workspace = true }
num_cpus = "1.0"
rayon = "1.8"

# Universal GPU compute frameworks (all optional for universal support)
# AGNOSTIC DESIGN: Each framework is truly optional and mutually exclusive in features

# WebGPU support (universal, future-ready) - Feature-gated to avoid conflicts
# MUST use same version as workspace to prevent duplicate symbol errors
wgpu = { workspace = true, optional = true, features = ["wgsl"] }

# Vulkan compute support (universal) - Only enabled explicitly
vulkano = { version = "0.34", optional = true }
ash = { version = "0.37", optional = true }

# OpenCL support (universal) - Only enabled explicitly
ocl = { version = "0.19", optional = true }

# Universal intermediate representations - Only for spirv feature
spirv = { version = "0.3", optional = true }

# CUDA support (NVIDIA-specific) - Only enabled explicitly
cudarc = { version = "0.11", optional = true, features = ["cuda-12050"] }

# JIT compilation and optimization - Only for jit feature
cranelift-jit = { version = "0.100", optional = true }
wasmtime = { version = "18", optional = true }

[features]
# SOVEREIGN + PRAGMATIC DESIGN:
# Default: Pure Rust WebGPU (self-sovereign, universal)
# Optional: Vendor backends for optimization (CUDA for AI/ML)
default = ["webgpu"]

# PRIMARY: Pure Rust, self-contained, universal (like NestGate's internal ZFS)
webgpu = ["wgpu"]

# OPTIMIZATION: Vendor-specific backends (pragmatic, opt-in)
# Use when ecosystem requires it (e.g., Python AI needs CUDA in 2025)
cuda = ["cudarc"]          # For PyTorch/TensorFlow AI workloads
opencl = ["ocl"]           # Legacy fallback for broader compatibility
vulkan = ["vulkano", "ash"] # Direct Vulkan for advanced use cases

# AI/ML CONVENIENCE: CUDA + WebGPU fallback
ai-ml = ["cuda", "webgpu"]

# MAXIMUM COMPATIBILITY: All backends (testing, development)
all-backends = ["webgpu", "cuda", "opencl", "vulkan"]

# Platform-specific detection features (no dependencies, pure logic)
detect-nvidia = []
detect-amd = []
detect-intel = []
detect-apple = []

# EVOLUTION PATH:
# 2025: CUDA needed for Python AI (PyTorch/TensorFlow)
# 2026+: WebGPU AI libraries mature (torch-webgpu, Burn, Candle)
# 2027+: Drop CUDA, go full WebGPU (true vendor agnosticism)

# Additional features (independent)
spirv = ["dep:spirv"]
jit = ["cranelift-jit", "wasmtime"]
testing = []

[dev-dependencies]
tokio-test = { workspace = true }
proptest = "1.0"
criterion = "0.5"
tracing-subscriber = "0.3"

# Dev dependencies don't share features - each test runs in isolation

[[example]]
name = "universal_compute_demo"
path = "examples/universal_compute_demo.rs"
required-features = [] # Can run with just detection, no actual GPU needed

# Bench configuration removed - benches directory not yet implemented
