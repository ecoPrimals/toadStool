[package]
name = "toadstool-runtime-gpu"
version.workspace = true
edition.workspace = true
description = "ToadStool Universal GPU Compute Runtime - If it has parallel compute units, we can harness it"
license.workspace = true
repository.workspace = true
keywords = ["gpu", "compute", "webgpu", "vulkan", "hardware"]
categories = ["hardware-support", "science"]

[dependencies]
toadstool = { path = "../../core/toadstool", default-features = false }
toadstool-common = { path = "../../core/common", default-features = false }
toadstool-glowplug = { path = "../../core/glowplug", default-features = false, optional = true }
tokio = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
toadstool-sysmon = { workspace = true }
rayon = "1.8"
wgpu = { workspace = true, optional = true, features = ["wgsl", "spirv"] }

[target.'cfg(target_os = "linux")'.dependencies]
toadstool-hw-safe = { path = "../../core/hw-safe" }
nvpmu = { path = "../../core/nvpmu" }

[features]
default = ["runtime"]
runtime = [
    "dep:tokio",
    "dep:toadstool-glowplug",
    "toadstool/runtime",
    "toadstool-common/runtime",
    "toadstool-glowplug/runtime",
    "uuid/v4",
    "webgpu",
]
webgpu = ["dep:wgpu"]
vulkan = ["webgpu"]
ai-ml = ["webgpu"]
all-backends = ["webgpu"]
fuzz = []

[dev-dependencies]
bytes = { workspace = true }
tokio-test = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "universal_compute_demo"
path = "examples/universal_compute_demo.rs"
required-features = ["runtime"]

[lints]
workspace = true
