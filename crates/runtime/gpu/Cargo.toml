[package]
name = "toadstool-runtime-gpu"
version.workspace = true
edition.workspace = true
description = "ToadStool Universal GPU Compute Runtime - If it has parallel compute units, we can harness it"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { workspace = true }

# Utilities
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
log = "0.4"
anyhow = "1.0"
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# System integration and monitoring
sysinfo = { workspace = true }
num_cpus = "1.0"

# Universal GPU compute frameworks (all optional for universal support)
# WebGPU support (universal, future-ready)
wgpu = { version = "0.19", optional = true }

# Vulkan compute support (universal)
vulkano = { version = "0.34", optional = true }
ash = { version = "0.37", optional = true }

# OpenCL support (universal) - using working version
ocl = { version = "0.19", optional = true }

# Universal intermediate representations
spirv = { version = "0.3", optional = true }

# CUDA support (NVIDIA-specific)
cudarc = { version = "0.11", optional = true, features = ["cuda-12050"] }

# Metal support (Apple-specific) - Not available on Linux, so commenting out for now
# metal = { version = "0.25", optional = true }

# JIT compilation and optimization (using compatible versions)
cranelift-jit = { version = "0.100", optional = true }
wasmtime = { version = "18", optional = true }

[features]
default = ["universal-basic"]
# Advanced features (require additional setup)
full = ["webgpu", "opencl", "vulkan", "cuda"]
universal-basic = []
universal-detection = []
universal-optimized = []
webgpu = ["wgpu"]
opencl = ["ocl"]
vulkan = ["vulkano", "ash"]
# Add missing features to fix cfg warnings
cuda = ["cudarc"]
# metal = ["metal"] # Not available on Linux
rocm = []
directcompute = []
spirv = ["dep:spirv"]
spirv-support = ["spirv"]
jit = ["cranelift-jit", "wasmtime"]
testing = []

[dev-dependencies]
tokio-test = { workspace = true }
proptest = "1.0"
criterion = "0.5"
