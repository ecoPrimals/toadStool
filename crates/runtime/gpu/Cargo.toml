[package]
name = "toadstool-runtime-gpu"
version.workspace = true
edition.workspace = true
description = "ToadStool Universal GPU Compute Runtime - If it has parallel compute units, we can harness it"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpu", "compute", "webgpu", "vulkan", "hardware"]
categories = ["hardware-support", "science"]

[dependencies]
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-glowplug = { path = "../../core/glowplug" }
toadstool-ember = { path = "../../core/ember" }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = "0.12"
toadstool-sysmon = { workspace = true }
rayon = "1.8"
wgpu = { workspace = true, optional = true, features = ["wgsl"] }
vulkano = { version = "0.34", optional = true }
ash = { version = "0.37", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
toadstool-hw-safe = { path = "../../core/hw-safe" }
nvpmu = { path = "../../core/nvpmu" }

[features]
default = ["webgpu"]
webgpu = ["wgpu"]
vulkan = ["vulkano", "ash"]
ai-ml = ["webgpu"]
all-backends = ["webgpu", "vulkan"]
fuzz = []

[dev-dependencies]
bytes = { workspace = true }
tokio-test = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "universal_compute_demo"
path = "examples/universal_compute_demo.rs"
required-features = []

[lints]
workspace = true
