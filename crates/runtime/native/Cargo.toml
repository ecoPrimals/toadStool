[package]
name = "toadstool-runtime-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native executable runtime engine for ToadStool with security and monitoring"

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
toadstool = { path = "../../core/toadstool" }
tokio = { workspace = true, features = ["full", "process"] }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
async-trait = { workspace = true }
