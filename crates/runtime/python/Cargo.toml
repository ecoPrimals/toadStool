[package]
name = "toadstool-runtime-python"
version.workspace = true
edition.workspace = true
description = "Python runtime engine for ToadStool - preparing for Squirrel MCP integration"
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[lib]
name = "toadstool_runtime_python"
crate-type = ["rlib"]  # Only Rust library (subprocess execution, no embedded PyO3)

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }

# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Python integration (optional — ecoBin builds use subprocess-only path)
pyo3 = { workspace = true, optional = true }
pyo3-asyncio = { workspace = true, features = ["tokio-runtime"], optional = true }

# EVOLVED: sysinfo removed (Mar 9, 2026) — replaced by toadstool-sysmon
# EVOLVED: nix dependency removed (Feb 14, 2026) - unused, prefer rustix

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["python-subprocess"]
python-subprocess = []
python-embedded = ["dep:pyo3", "dep:pyo3-asyncio"]
ai-ml = []
squirrel-preparation = []

[build-dependencies]
pyo3-build-config = { version = "0.20", optional = true }