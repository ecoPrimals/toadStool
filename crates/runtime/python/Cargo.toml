[package]
name = "toadstool-runtime-python"
version.workspace = true
edition.workspace = true
description = "Python runtime engine for ToadStool - preparing for Squirrel MCP integration"
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "toadstool_runtime_python"
crate-type = ["rlib"]  # Only Rust library (subprocess execution, no embedded PyO3)

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }

# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }

# EVOLVED: pyo3/pyo3-asyncio removed from workspace deps (ecoBin v3.0).
# Python embedded feature is dormant — ecoBin builds use subprocess-only path.
# Squirrel MCP owns embedded Python integration via IPC.

# EVOLVED: sysinfo removed (Mar 9, 2026) — replaced by toadstool-sysmon
# EVOLVED: nix dependency removed (Feb 14, 2026) - unused, prefer rustix

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["python-subprocess"]
python-subprocess = []
# python-embedded feature dormant — pyo3 deps removed per ecoBin v3.0

[lints]
workspace = true
