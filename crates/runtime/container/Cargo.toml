[package]
name = "toadstool-runtime-container"
version = "0.1.0"
edition.workspace = true
description = "ToadStool container runtime engine"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["container", "docker", "runtime", "orchestration"]
categories = ["development-tools"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
bytes = { workspace = true }

# Logging
tracing = { workspace = true }

# UUID generation
uuid = { workspace = true }

# Futures utilities
futures = { workspace = true }

# Container runtime support
bollard = { workspace = true, optional = true }
# containerd-client = { version = "0.6.0", optional = true } # REMOVED: protobuf dependency

# Utilities
thiserror = { workspace = true }

# System integration
# PURE RUST: reqwest removed - no registry auth via HTTP! ✅
# (reqwest dependency completely removed for pure Rust)
tempfile = { workspace = true }
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
# EVOLVED: nix dependency removed (Feb 14, 2026) - unused, prefer rustix

# New dependencies
# BYOB HTTP server — future: migrate to UDS JSON-RPC (songBird owns HTTP)
axum = "0.7"
clap = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }

[features]
default = []
docker = ["bollard"]
# containerd = ["containerd-client"] # REMOVED: protobuf dependency
# PURE RUST: registry-auth feature removed (no HTTP!)
# registry-auth = ["reqwest"]

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true

