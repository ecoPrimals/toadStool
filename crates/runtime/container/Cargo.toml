[package]
name = "toadstool-runtime-container"
version = "0.1.0"
edition = "2021"
description = "ToadStool container runtime engine"
license = "MIT OR Apache-2.0"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { workspace = true }

# Logging
tracing = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Futures utilities
futures = "0.3"

# Container runtime support
bollard = { version = "0.16", optional = true }
containerd-client = { version = "0.6.0", optional = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }

# System integration
reqwest = { workspace = true, optional = true }
tempfile = { workspace = true }
tar = "0.4"
flate2 = "1.0"

# Process management
nix = { version = "0.29.0", features = ["process", "signal"] }

# New dependencies
axum = "0.7"
clap = { version = "4.0", features = ["derive"] }
tracing-subscriber = "0.3"
toml = "0.8"
toadstool-api = { path = "../../api" }
tower = "0.4"

[features]
default = ["docker"]
docker = ["bollard"]
containerd = ["containerd-client"]
registry-auth = ["reqwest"]

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "toadstool-byob-server"
path = "src/bin/toadstool-byob-server.rs"
