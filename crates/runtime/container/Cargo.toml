[package]
name = "toadstool-runtime-container"
version = "0.1.0"
edition = "2021"
description = "ToadStool container runtime engine"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["container", "docker", "runtime", "orchestration"]
categories = ["development-tools"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = { workspace = true }
bytes = { workspace = true }

# Logging
tracing = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Futures utilities
futures = "0.3"

# Container runtime support
bollard = { version = "0.16", optional = true }
# containerd-client = { version = "0.6.0", optional = true } # REMOVED: protobuf dependency

# Utilities
thiserror = { workspace = true }

# System integration
# PURE RUST: reqwest removed - no registry auth via HTTP! ✅
# (reqwest dependency completely removed for pure Rust)
tempfile = { workspace = true }
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
# EVOLVED: nix dependency removed (Feb 14, 2026) - unused, prefer rustix

# New dependencies
axum = "0.7"
clap = { version = "4.0", features = ["derive"] }
tracing-subscriber = "0.3"
toml = "0.8"
tower = { version = "0.4", features = ["util"] }

[features]
default = ["docker"]
docker = ["bollard"]
# containerd = ["containerd-client"] # REMOVED: protobuf dependency
# PURE RUST: registry-auth feature removed (no HTTP!)
# registry-auth = ["reqwest"]

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
