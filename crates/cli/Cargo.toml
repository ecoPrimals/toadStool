[package]
name = "toadstool-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "ToadStool CLI - Universal Compute Command Center for Sovereign Science"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[[bin]]
name = "toadstool"
path = "src/main.rs"
doc = false  # Avoid doc collision with toadstool lib (target/doc/toadstool/index.html)

# UNIBIN EVOLUTION (Jan 27, 2026):
# Removed legacy binary aliases (toadstool-cli, toadstool-server).
# These violated the UniBin standard (wateringHole/UNIBIN_ARCHITECTURE_STANDARD.md).
#
# MIGRATION PATH:
# - Old: toadstool-server
# - New: toadstool daemon
#
# The main.rs still detects legacy names (for symlinks) but we no longer
# build multiple binaries. Users should migrate to the canonical UniBin interface.
#
# See: EVOLUTION_SESSION_JAN_27_2026.md for details.

[dependencies]
# Core ToadStool crates
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-config = { path = "../core/config" }
toadstool-distributed = { path = "../distributed" }
toadstool-server = { path = "../server" }  # UniBin Phase 2: Server library integration (library compiles!)
humantime-serde = "1.1"

# Runtime engines
toadstool-runtime-container = { path = "../runtime/container" }
toadstool-runtime-native = { path = "../runtime/native" }
toadstool-runtime-python = { path = "../runtime/python" }
toadstool-runtime-wasm = { path = "../runtime/wasm", optional = true }  # Optional: has zstd C dependency
wasmi = { version = "1.0", features = ["std"], optional = true }  # For WASM execution when wasm feature enabled
toadstool-runtime-gpu = { path = "../runtime/gpu", optional = true }

# CLI framework
clap = { version = "4.4", features = ["derive", "color", "suggestions"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Error handling
thiserror = { workspace = true }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bytes = { workspace = true }

# UUID generation
uuid = { workspace = true, features = ["v4"] }

# File system operations (Pure Rust!)
etcetera = { workspace = true }

# Networking
# PURE RUST: reqwest removed - unix sockets only! ✅
# mdns = "3.0"  # Note: mDNS discovery available via toadstool-config crate

# System information
sysinfo = { workspace = true }

# Terminal UI and formatting
console = "0.15"
indicatif = "0.17"
colored = "2.0"
# term_size removed: unused, terminal size available via console crate already in deps
# atty removed (Feb 14, 2026): use std::io::IsTerminal (Rust 1.70+)

# Process management
# which removed: CLI uses Command::new("which"), not the crate

# Cryptography (for BearDog integration) - Pure Rust (RustCrypto)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# Template engine
handlebars = "4.5"

# Configuration management
figment = { version = "0.10", features = ["toml", "yaml", "env"] }

# Metrics and monitoring
prometheus = { version = "0.13", default-features = false }

# HTTP client
url = "2.5"

# HTTP server (for daemon mode)
axum = { workspace = true, optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[target.'cfg(unix)'.dev-dependencies]
# EVOLVED: libc replaced with rustix (Feb 16, 2026) - ecoBin compliant, safer API
rustix = { version = "0.38", features = ["process"] }

[features]
default = ["full"]
full = ["ecosystem", "universal", "monitoring", "templates", "daemon", "wasm"]
ecosystem = []
universal = []
monitoring = []
templates = []
daemon = ["axum", "tower", "tower-http"]
wasm = ["dep:toadstool-runtime-wasm", "dep:wasmi"]  # Optional: WASM runtime

# GPU FEATURES: Sovereign + Pragmatic
gpu = ["toadstool-runtime-gpu"]  # WebGPU by default (pure Rust, universal)
gpu-ai = ["gpu", "toadstool-runtime-gpu/ai-ml"]  # Add CUDA for Python AI
gpu-full = ["gpu", "toadstool-runtime-gpu/all-backends"]  # Maximum compatibility

# NPU FEATURES: Neuromorphic accelerator support
npu = []  # Enables Akida NPU commands

# PURE RUST: Build without C dependencies (no WASM, minimal features)
pure-rust = ["ecosystem", "universal", "monitoring"]
