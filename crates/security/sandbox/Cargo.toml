[package]
name = "toadstool-security-sandbox"
version = "0.1.0"
edition.workspace = true
description = "Cross-platform security sandboxing for ToadStool"
authors = ["ToadStool Project"]
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["security", "sandbox", "isolation", "containerization"]
categories = ["os"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-security-policies = { path = "../policies" }

# Async runtime
tokio = { workspace = true }

# Serialization and configuration
serde = { workspace = true }
serde_json = { workspace = true }

# Security and cryptography
uuid = { workspace = true }

# Logging and tracing
tracing = { workspace = true }

# EVOLVED: nix removed (Feb 14, 2026) - prefer rustix
# EVOLVED: caps removed (Mar 9, 2026) - unused, libc dep eliminated
# EVOLVED: procfs removed (Mar 20, 2026) — unused; toadstool-sysmon provides /proc parsing
[target.'cfg(target_os = "linux")'.dependencies]
# `rustix`: mounts, capabilities, `no_new_privs`, `/proc` helpers via `param`.
rustix = { version = "1.1", features = ["fs", "mount", "process", "thread", "param"] }
# Pure Rust seccomp-BPF compile/install (Firecracker); optional — see `seccomp` feature.
seccompiler = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9", optional = true }
core-foundation-sys = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects"
] }

[features]
default = ["seccomp"]
# Enable seccomp filtering on Linux (seccompiler + kernel install path)
seccomp = ["dep:seccompiler"]
# Enable macOS sandbox features
macos-sandbox = ["core-foundation", "core-foundation-sys"]

[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tempfile = { workspace = true }
test-log = "0.2"
env_logger = "0.11"

[lints]
workspace = true

