[package]
name = "toadstool-security-sandbox"
version = "0.1.0"
edition = "2021"
description = "Cross-platform security sandboxing for ToadStool"
authors = ["ToadStool Project"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/toadstool-project/toadstool"

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }
toadstool-security-policies = { path = "../policies" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Security and cryptography
uuid = { version = "1.0", features = ["v4", "serde"] }

# Collections and utilities
indexmap = "2.0"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["process", "signal", "user", "mount"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"
procfs = "0.16"
seccomp-sys = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects"
] }

[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tempfile = "3.0"
test-log = "0.2"
env_logger = "0.10"
