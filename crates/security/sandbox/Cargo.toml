[package]
name = "toadstool-security-sandbox"
version.workspace = true
edition.workspace = true
description = "Cross-platform security sandboxing for ToadStool"
authors = ["ToadStool Project"]
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["security", "sandbox", "isolation", "containerization"]
categories = ["os"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-security-policies = { path = "../policies" }

# Async runtime
tokio = { workspace = true }

# Serialization and configuration
serde = { workspace = true }
serde_json = { workspace = true }

# Security and cryptography
uuid = { workspace = true }

# Logging and tracing
tracing = { workspace = true }

# EVOLVED: nix removed (Feb 14, 2026) - prefer rustix
# EVOLVED: caps removed (Mar 9, 2026) - unused, libc dep eliminated
# EVOLVED: procfs removed (Mar 20, 2026) — unused; toadstool-sysmon provides /proc parsing
# EVOLVED: rustix removed (Aug 7, 2026) — migrated to hw-safe platform backends
[target.'cfg(target_os = "linux")'.dependencies]
toadstool-hw-safe = { path = "../../core/hw-safe" }
# Pure Rust seccomp-BPF compile/install (Firecracker); optional — see `seccomp` feature.
seccompiler = { version = "0.5", optional = true }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects"
] }

[features]
default = ["seccomp"]
# Enable seccomp filtering on Linux (seccompiler + kernel install path)
seccomp = ["dep:seccompiler"]
[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tempfile = { workspace = true }
test-log = "0.2"
env_logger = "0.11"

[lints]
workspace = true

