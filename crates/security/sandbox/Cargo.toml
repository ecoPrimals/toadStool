[package]
name = "toadstool-security-sandbox"
version = "0.1.0"
edition = "2021"
description = "Cross-platform security sandboxing for ToadStool"
authors = ["ToadStool Project"]
license.workspace = true
repository = "https://github.com/toadstool-project/toadstool"
readme = "README.md"
keywords = ["security", "sandbox", "isolation", "containerization"]
categories = ["os"]

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }
toadstool-security-policies = { path = "../policies" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# Security and cryptography
uuid = { version = "1.0", features = ["v4", "serde"] }

# Collections and utilities
indexmap = "2.0"
regex = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = { workspace = true }

# EVOLVED: nix dependency removed (Feb 14, 2026) - unused, prefer rustix
[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"
procfs = "0.16"
# Pure Rust seccomp implementation (used by Firecracker)
seccompiler = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9", optional = true }
core-foundation-sys = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects"
] }

[features]
default = []
# Enable seccomp filtering on Linux (pure Rust implementation)
seccomp = ["seccompiler"]
# Enable macOS sandbox features
macos-sandbox = ["core-foundation", "core-foundation-sys"]

[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tempfile = "3.0"
test-log = "0.2"
env_logger = "0.10"
