[package]
name = "toadstool-security-policies"
version.workspace = true
edition.workspace = true
description = "Advanced security policy management for ToadStool"
authors = ["ToadStool Project"]
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["security", "policy", "access-control", "rbac"]
categories = ["authentication"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool", default-features = false }
toadstool-common = { path = "../../core/common", default-features = false }
# Async runtime (optional — gated behind `runtime` for WASM compat)
tokio = { workspace = true, optional = true }

# Serialization and configuration
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }

# Security and cryptography
sha2 = { workspace = true }
uuid = { workspace = true }

# Collections and utilities
regex = { workspace = true }
toadstool-sysmon = { workspace = true }

# Logging and tracing
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus"
] }

[features]
default = ["runtime"]
runtime = ["dep:tokio", "toadstool/runtime", "toadstool-common/runtime", "uuid/v4"]

[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tempfile = { workspace = true }
test-log = "0.2"
env_logger = "0.11"

[lints]
workspace = true

