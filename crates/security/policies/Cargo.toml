[package]
name = "toadstool-security-policies"
version = "0.1.0"
edition.workspace = true
description = "Advanced security policy management for ToadStool"
authors = ["ToadStool Project"]
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["security", "policy", "access-control", "rbac"]
categories = ["authentication"]

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "0.8"

# Security and cryptography
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Collections and utilities
regex = "1.0"
toadstool-sysmon = { workspace = true }

# Logging and tracing
tracing = "0.1"

# Error handling
thiserror = { workspace = true }
# lazy_static removed: evolved to std::sync::LazyLock (Rust 1.80+)

# EVOLVED: nix removed (Feb 14, 2026) - prefer rustix
# EVOLVED: caps removed (Mar 9, 2026) - unused, libc dep eliminated
# EVOLVED: procfs removed (Mar 20, 2026) — unused; toadstool-sysmon provides /proc parsing
[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus"
] }

[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tempfile = "3.0"
test-log = "0.2"
env_logger = "0.11"
