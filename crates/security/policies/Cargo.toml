[package]
name = "toadstool-security-policies"
version.workspace = true
edition.workspace = true
description = "Advanced security policy management for ToadStool"
authors = ["ToadStool Project"]
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["security", "policy", "access-control", "rbac"]
categories = ["authentication"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
# Async runtime
tokio = { workspace = true }

# Serialization and configuration
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }

# Security and cryptography
sha2 = { workspace = true }
uuid = { workspace = true }

# Collections and utilities
regex = { workspace = true }
toadstool-sysmon = { workspace = true }

# Logging and tracing
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
# lazy_static removed: evolved to std::sync::LazyLock (Rust 1.80+)

# EVOLVED: nix removed (Feb 14, 2026) - prefer rustix
# EVOLVED: caps removed (Mar 9, 2026) - unused, libc dep eliminated
# EVOLVED: procfs removed (Mar 20, 2026) — unused; toadstool-sysmon provides /proc parsing
[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus"
] }

[dev-dependencies]
toadstool-testing = { path = "../../testing" }
tempfile = { workspace = true }
test-log = "0.2"
env_logger = "0.11"

[lints]
workspace = true

