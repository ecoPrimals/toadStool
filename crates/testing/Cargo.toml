[package]
name = "toadstool-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true  
homepage.workspace = true
documentation.workspace = true
description = "Testing utilities, mocks, and infrastructure for ToadStool"
keywords = ["testing", "mocks", "utilities", "toadstool"]
categories = ["development-tools::testing"]
readme = "README.md"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
hw-learn = { path = "../core/hw-learn" }

# Testing framework
tokio = { version = "1.0", features = ["full"] }
tokio-test = "0.4"

# Mocking and testing utilities
mockall = "0.12"
proptest = "1.0"
wiremock = { version = "0.6", optional = true }

# Async testing
futures = "0.3"

# Serialization for test data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
bytes = { workspace = true }

# Time and UUID for test data
uuid = { version = "1.0", features = ["v4", "serde"] }

# Temporary directories and files for testing
tempfile = "3.0"
# tempdir removed: deprecated crate, tests already use tempfile

# HTTP client for integration tests
# PURE RUST: reqwest removed even from testing (use unix sockets in tests too!)
# reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }

# Logging for tests
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Random data generation
rand = "0.8"
fake = { version = "2.0", features = ["derive", "uuid"] }


# EVOLVED: sysinfo removed (Mar 9, 2026) — replaced by toadstool-sysmon

[dev-dependencies]
criterion = "0.5"
temp-env = "0.3"

[[bench]]
name = "hot_paths"
harness = false

[features]
default = []
integration-tests = ["wiremock"] # Pure Rust: removed libc (unix sockets via std)
benchmarks = []
slow-tests = []

[lints]
workspace = true
