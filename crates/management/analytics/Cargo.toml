[package]
name = "toadstool-management-analytics"
version.workspace = true
edition.workspace = true
description = "Advanced monitoring and analytics engine for ToadStool"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["analytics", "monitoring", "metrics", "observability"]
categories = ["development-tools::profiling"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool", default-features = false }
toadstool-common = { path = "../../core/common", default-features = false }

# Async runtime (optional — gated behind `runtime` for WASM compat)
tokio = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Machine learning and analytics (behind runtime — pulls rand/getrandom, not WASM-safe)
statrs = { version = "0.18", optional = true }

# Utilities
uuid = { workspace = true }
tracing = { workspace = true }

[features]
default = ["runtime"]
runtime = ["dep:tokio", "dep:statrs", "toadstool/runtime", "toadstool-common/runtime", "uuid/v4"]

[lints]
workspace = true

