[package]
name = "toadstool-management-analytics"
version = "0.1.0"
edition = "2021"
description = "Advanced monitoring and analytics engine for ToadStool"
license = "MIT OR Apache-2.0"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-management-monitoring = { path = "../monitoring" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Machine learning and analytics
ndarray = "0.15"
statrs = "0.16"

# Database for storing metrics
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Networking
reqwest = { version = "0.12", features = ["json"] }
hyper = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.14" 