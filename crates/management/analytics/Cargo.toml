[package]
name = "toadstool-management-analytics"
version.workspace = true
edition.workspace = true
description = "Advanced monitoring and analytics engine for ToadStool"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["analytics", "monitoring", "metrics", "observability"]
categories = ["development-tools::profiling"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-management-monitoring = { path = "../monitoring" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Machine learning and analytics
ndarray = { workspace = true }
statrs = "0.18"

# Database for storing metrics - REMOVED: Brings in ring via rustls (violates pure Rust)
# PURE RUST: Database persistence disabled by default (in-memory only)
# Future: Use pure Rust alternatives (sled, redb, etc.) when persistence needed
# sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"], optional = true }

# Utilities
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Configuration
config = { workspace = true }

[lints]
workspace = true

