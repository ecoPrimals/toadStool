[package]
name = "toadstool-management-monitoring"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Resource monitoring and metrics collection for ToadStool runtime environments"
readme = "README.md"
repository.workspace = true
keywords = ["monitoring", "metrics", "observability", "telemetry"]
categories = ["development-tools::profiling"]

[dependencies]
toadstool = { path = "../../core/toadstool" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
async-trait = { workspace = true }

[dev-dependencies]
serde_json = "1.0"
