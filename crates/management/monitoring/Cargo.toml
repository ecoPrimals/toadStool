[package]
name = "toadstool-management-monitoring"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Resource monitoring and metrics collection for ToadStool runtime environments"
readme = "README.md"
repository.workspace = true
keywords = ["monitoring", "metrics", "observability", "telemetry"]
