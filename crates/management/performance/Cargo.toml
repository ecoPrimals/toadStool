[package]
name = "toadstool-management-performance"
version = "0.1.0"
edition.workspace = true
description = "Performance management and optimization for ToadStool"
readme = "README.md"
authors = ["ToadStool Project"]
license.workspace = true
repository.workspace = true
keywords = ["performance", "optimization", "profiling", "benchmarking"]
categories = ["development-tools::profiling"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# EVOLVED: sysinfo removed (Mar 9, 2026) — replaced by toadstool-sysmon

# Statistics
statrs = "0.18"
ndarray = { version = "0.16", features = ["serde"] }

# Collections and utilities
indexmap = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = { workspace = true }

# EVOLVED: nix dependency removed (Feb 14, 2026) - unused, prefer rustix
# EVOLVED: procfs removed (Mar 20, 2026) — unused; toadstool-sysmon provides /proc parsing
[target.'cfg(target_os = "linux")'.dependencies]

[dev-dependencies]
tempfile = "3.0"
test-log = "0.2"
env_logger = "0.11"

[lints]
workspace = true

