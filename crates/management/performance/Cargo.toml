[package]
name = "toadstool-management-performance"
version.workspace = true
edition.workspace = true
description = "Performance management and optimization for ToadStool"
readme = "README.md"
authors = ["ToadStool Project"]
license.workspace = true
repository.workspace = true
keywords = ["performance", "optimization", "profiling", "benchmarking"]
categories = ["development-tools::profiling"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool", default-features = false }
toadstool-common = { path = "../../core/common", default-features = false }

# Serialization and configuration
serde = { workspace = true }

# Collections and utilities
uuid = { version = "1.7", default-features = false, features = ["serde"] }

# Logging and tracing
tracing = { workspace = true }

[features]
default = ["runtime"]
runtime = ["toadstool/runtime", "toadstool-common/runtime", "uuid/v4"]

[dev-dependencies]
tempfile = { workspace = true }
test-log = "0.2"
env_logger = "0.11"

[lints]
workspace = true

