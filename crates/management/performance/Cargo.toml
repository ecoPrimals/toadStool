[package]
name = "toadstool-management-performance"
version = "0.1.0"
edition = "2021"
description = "Performance management and optimization for ToadStool"
readme = "README.md"
authors = ["ToadStool Project"]
license.workspace = true
repository = "https://github.com/toadstool-project/toadstool"
keywords = ["performance", "optimization", "profiling", "benchmarking"]
categories = ["development-tools::profiling"]

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../../core/toadstool" }
toadstool-common = { path = "../../core/common" }
toadstool-config = { path = "../../core/config" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# Performance monitoring and profiling
sysinfo = { workspace = true }

# Statistics and machine learning
statrs = "0.16"
linfa = { version = "0.7", features = ["serde"] }
ndarray = { version = "0.15", features = ["serde"] }

# Collections and utilities
indexmap = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = { workspace = true }

# EVOLVED: nix dependency removed (Feb 14, 2026) - unused, prefer rustix
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.16"

[dev-dependencies]
tempfile = "3.0"
test-log = "0.2"
env_logger = "0.10"
