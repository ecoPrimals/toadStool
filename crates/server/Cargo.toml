[package]
name = "toadstool-server"
version.workspace = true
edition.workspace = true
description = "ToadStool universal compute server library"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["server", "compute", "distributed", "orchestration"]
categories = ["network-programming"]

[dependencies]
# ToadStool core dependencies
toadstool = { path = "../core/toadstool", features = ["networking"] }
toadstool-config = { path = "../core/config" }
toadstool-core = { path = "../toadstool-core" }
toadstool-display = { path = "../runtime/display" }
toadstool-common = { path = "../core/common" }
toadstool-cylinder = { path = "../core/cylinder" }
toadstool-ember = { path = "../core/ember" }
toadstool-glowplug = { path = "../core/glowplug" }
toadstool-distributed = { path = "../distributed" }
toadstool-integration-protocols = { path = "../integration/protocols" }
toadstool-runtime-container = { path = "../runtime/container", features = ["docker"] }
toadstool-runtime-gpu = { path = "../runtime/gpu" }
toadstool-runtime-native = { path = "../runtime/native" }
toadstool-runtime-specialty = { path = "../runtime/specialty" }
toadstool-runtime-wasm = { path = "../runtime/wasm" }
toadstool-runtime-orchestration = { path = "../runtime/orchestration" }

# JSON-RPC server
# jsonrpsee removed (pulls ring C dependency). pure_jsonrpc is canonical (Pure Rust).

# tarpc for high-performance RPC (optional per wateringHole PRIMAL_IPC_PROTOCOL)
tarpc = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tokio-serde = { version = "0.9", features = ["json"], optional = true }

# Base64 encoding
base64 = { workspace = true }

# Async runtime and channels
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# Error handling
thiserror = { workspace = true }

# systemd sd_notify protocol (SCM_RIGHTS fd passing for warm keepalive)
# + mm: catalyst watchdog emergency BAR0 mmap for interrupt quench
rustix = { workspace = true, features = ["net", "mm", "fs"] }

# Logging
tracing = { workspace = true }

# UUID support
uuid = { workspace = true }

# System monitoring — Pure Rust via /proc (replaces sysinfo, zero C)
toadstool-sysmon = { workspace = true }

# Hardware learning pipeline — observe → distill → apply
hw-learn = { path = "../core/hw-learn" }

# NVIDIA GPU power management — BAR0, firmware inventory, sensors
nvpmu = { path = "../core/nvpmu" }

# GPU detection via barraCuda (vendor-agnostic)
wgpu = { workspace = true, optional = true }  # EVOLVED: Pure Rust! (no renderdoc) ✅
futures = { workspace = true }

# Security sandboxing (optional — workload isolation via seccomp/capabilities)
toadstool-security-sandbox = { path = "../security/sandbox", optional = true }
toadstool-security-policies = { path = "../security/policies", optional = true }

[features]
default = ["gpu-discovery", "tarpc", "btsp"]
gpu-discovery = ["wgpu"]
tarpc = ["dep:tarpc", "dep:tokio-util", "dep:tokio-serde"]
btsp = ["toadstool-common/btsp"]
# Cross-platform sandbox + policy enforcement (seccomp, capabilities, RBAC)
sandbox = ["dep:toadstool-security-sandbox", "dep:toadstool-security-policies"]
# UNIBIN EVOLUTION (Feb 2, 2026):
# Removed [[bin]] section to make this a library-only crate.
# The toadstool-server binary violated UniBin standard.
#
# MIGRATION:
# - Old: toadstool-server (separate binary)
# - New: toadstool daemon (UniBin subcommand)
#
# The crates/cli binary already includes daemon mode and calls
# toadstool_server::run_server_main() from this library.
#
# Users can create symlink for compatibility:
#   ln -s toadstool toadstool-server
#
# See: UNIBIN_MIGRATION_STATUS_FEB02_2026.md
# Reference: wateringHole/UNIBIN_ARCHITECTURE_STANDARD.md

[dev-dependencies]
toadstool-display = { path = "../runtime/display", features = ["test-mocks"] }
criterion = { workspace = true }
hw-learn = { path = "../core/hw-learn" }
tokio-test = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
toadstool-testing = { path = "../testing" }
proptest = { workspace = true }

[lints]
workspace = true

