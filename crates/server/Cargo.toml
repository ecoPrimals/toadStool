[package]
name = "toadstool-server"
version.workspace = true
edition.workspace = true
description = "ToadStool universal compute server library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["server", "compute", "distributed", "orchestration"]
categories = ["web-programming::http-server", "network-programming"]

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# ToadStool core dependencies
toadstool = { path = "../core/toadstool", features = ["networking"] }
toadstool-config = { path = "../core/config" }
toadstool-common = { path = "../core/common" }
toadstool-distributed = { path = "../distributed" }
# toadstool-integration-protocols = { path = "../integration/protocols" }  # Disabled: peripheral crate with HTTP remnants

# HTTP server framework (optional)
axum = { version = "0.7", features = ["ws"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }

# JSON-RPC server
jsonrpsee = { version = "0.21", features = ["server", "macros"] }

# tarpc for high-performance RPC
tarpc = { version = "0.33", features = ["tokio1", "serde-transport", "serde-transport-json"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-serde = { version = "0.9", features = ["json"] }

# Base64 encoding
base64 = "0.22"

# Async runtime and channels
tokio = { version = "1.0", features = ["full"] }

# Async utilities
futures-util = "0.3"
async-trait = "0.1"

# HTTP client - REMOVED: Legacy artifact from old Songbird HTTP registration
# ARCHITECTURAL EVOLUTION (Jan 17, 2026):
#   OLD: ToadStool used HTTP to register with Songbird (violated concentrated gap)
#   NEW: Songbird discovers ToadStool via Unix socket (capability-based discovery)
#   RESULT: ToadStool has NO legitimate need for HTTP/TLS dependencies!
# 
# Deep Debt Solution: ToadStool provides Unix socket server (manual_jsonrpc.rs),
# Songbird discovers ToadStool via socket path, registration happens via JSON-RPC over Unix.
# This achieves 100% Pure Rust and TRUE UniBin (no C deps, trivial cross-compilation).
#
# reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID support
uuid = { version = "1.0", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Unix socket support (libc for getuid)
libc = "0.2"

# System info (for memory query)
sys-info = "0.9"

# CPU info
num_cpus = "1.0"

# GPU detection via barraCUDA (vendor-agnostic)
wgpu = { version = "22", optional = true }
futures = "0.3"

[features]
default = ["api", "websocket", "gpu-discovery"]
api = ["axum", "tower", "tower-http"]
websocket = ["axum/ws"]
gpu-discovery = ["wgpu"]

[[bin]]
name = "toadstool-server"
path = "src/main.rs"

[dev-dependencies]
tokio-test = "0.4"
toadstool-testing = { path = "../testing" }
tokio-tungstenite = "0.21"
