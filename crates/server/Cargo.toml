[package]
name = "toadstool-server"
version.workspace = true
edition.workspace = true
description = "ToadStool universal compute server library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadstool"
readme = "README.md"
keywords = ["server", "compute", "distributed", "orchestration"]
categories = ["web-programming::http-server", "network-programming"]

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[dependencies]
# ToadStool core dependencies
toadstool = { path = "../core/toadstool", features = ["networking"] }
toadstool-config = { path = "../core/config" }
toadstool-common = { path = "../core/common" }
toadstool-distributed = { path = "../distributed" }
toadstool-integration-protocols = { path = "../integration/protocols" }

# HTTP server framework (optional)
axum = { version = "0.7", features = ["ws"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }

# JSON-RPC server
jsonrpsee = { version = "0.21", features = ["server", "macros"] }

# tarpc for high-performance RPC
tarpc = { version = "0.33", features = ["tokio1", "serde-transport", "serde-transport-json"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-serde = { version = "0.9", features = ["json"] }

# Base64 encoding
base64 = "0.22"

# Async runtime and channels
tokio = { version = "1.0", features = ["full"] }

# HTTP client (for Songbird registration)
reqwest = { version = "0.11", features = ["json"] }

# Async utilities
futures-util = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID support
uuid = { version = "1.0", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Unix socket support (libc for getuid)
libc = "0.2"

# System info (for memory query)
sys-info = "0.9"

# CPU info
num_cpus = "1.0"

[features]
default = ["api", "websocket"]
api = ["axum", "tower", "tower-http"]
websocket = ["axum/ws"]

[[bin]]
name = "toadstool-server"
path = "src/main.rs"

[dev-dependencies]
tokio-test = "0.4"
toadstool-testing = { path = "../testing" }
tokio-tungstenite = "0.21"
