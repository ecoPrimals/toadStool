[package]
name = "toadstool-auto-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Zero-touch auto-configuration system for ToadStool Universal Compute Platform"
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-config = { path = "../core/config" }

# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
regex = "1.0"

# System information
sysinfo = { workspace = true }

# Process management
nix = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
gpu-support = []
ml-optimization = []
enterprise-features = [] 