[package]
name = "toadstool-auto-config"
version = "0.1.0"
edition = "2021"
description = "Intelligent auto-configuration and zero-touch setup for ToadStool"
license = "MIT OR Apache-2.0"

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# System detection
sysinfo = "0.30"
hostname = "0.3"
local-ip-address = "0.5"

# Network discovery
mdns = "3.0"
reqwest = { version = "0.12", features = ["json"] }

# Configuration
config = "0.14"
toml = "0.8"

# Natural language processing
regex = "1.0"
once_cell = "1.19"

# ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"

[features]
default = []
gpu-detection = ["opencl3"]
advanced-nlp = []

[dependencies.opencl3]
version = "0.9"
optional = true 