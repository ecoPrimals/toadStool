[package]
name = "toadstool-auto-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Zero-touch auto-configuration system for ToadStool Universal Compute Platform"
readme = "README.md"
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-config = { path = "../core/config" }

# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# PURE RUST: reqwest removed - unix sockets only! ✅
url = { workspace = true }
regex = "1.0"

# EVOLVED: sysinfo removed (Mar 9, 2026) — replaced by toadstool-sysmon (pure Rust /proc)
# EVOLVED: nix dependency removed (Feb 14, 2026) - unused, prefer rustix

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
temp-env = "0.3.6"

[features]
default = []
gpu = []
ml-optimization = []
enterprise-features = []
test-mocks = []  # Enable mock implementations for testing
slow-tests = []  # Enable slow integration tests (hardware detection, NL processing)

[lints]
workspace = true

