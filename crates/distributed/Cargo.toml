[package]
name = "toadstool-distributed"
version = "0.1.0"
edition = "2021"
description = "Distributed computing coordination for ToadStool"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/toadstool"
keywords = ["distributed", "compute", "orchestration", "coordination"]
categories = ["asynchronous", "network-programming"]

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[features]
default = []
channels = []

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-config = { path = "../core/config" }
toadstool-management-monitoring = { path = "../management/monitoring" }
toadstool-management-analytics = { path = "../management/analytics" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
humantime-serde = "1.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Networking and communication
hyper = { version = "1.0", features = ["full"] }
tower = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
http = "0.2"

# Clustering and load balancing
rand = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
dashmap = "5.5"
num_cpus = "1.16"

# Configuration
config = "0.14" 
[dev-dependencies]
toadstool-testing = { path = "../testing" }
tokio-test = "0.4"
tempfile = "3.0"
