[package]
name = "toadstool-distributed"
version = "0.1.0"
edition.workspace = true
description = "Distributed computing coordination for ToadStool"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["distributed", "compute", "orchestration", "coordination"]
categories = ["asynchronous", "network-programming"]

[features]
default = []
channels = []
testing = ["dev-crypto"]  # Exposes new_for_testing + dev-crypto fallback for integration tests
dev-crypto = ["dep:aes-gcm", "dep:ed25519-dalek"]  # In-process SoftwareHsmProvider for dev/CI (production uses BearDog)
# `SecurityProviderFactory::create_mock` + `MockSecurityProvider` — not default
test-mocks = []

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-config = { path = "../core/config" }
toadstool-management-monitoring = { path = "../management/monitoring" }
# toadstool-management-analytics = { path = "../management/analytics" }  # Disabled: optional analytics integration

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
humantime-serde = { workspace = true }
bytes = { workspace = true }

# Clustering and load balancing
base64 = { workspace = true }
rand = { workspace = true }
aes-gcm = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true }

# Utilities
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# dashmap removed: evolved to std::sync::RwLock<HashMap> (no usage in source)

# System monitoring — Pure Rust via /proc (replaces sysinfo, zero C)
toadstool-sysmon = { workspace = true }

# Configuration
config = { workspace = true }
[[test]]
name = "coordination_rpc_coverage_tests"
required-features = ["testing"]

[[test]]
name = "beardog_client_coverage_tests"

[[test]]
name = "access_control_coverage_tests"

[[test]]
name = "cloud_orchestrator_coverage_tests"
required-features = ["test-mocks"]

[[test]]
name = "distributed_coverage_s155b_tests"
required-features = ["test-mocks"]

[dev-dependencies]
toadstool-testing = { path = "../testing" }
tokio-test = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
toml = { workspace = true }
anyhow = "1"
proptest = { workspace = true }

[lints]
workspace = true
