[package]
name = "toadstool-distributed"
version = "0.1.0"
edition = "2021"
description = "Distributed computing coordination for ToadStool"
readme = "README.md"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/toadstool"
keywords = ["distributed", "compute", "orchestration", "coordination"]
categories = ["asynchronous", "network-programming"]

[lints.clippy]
# Production-grade safety lints
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
# Performance lints
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
# Concurrency lints
mutex_atomic = "warn"

[features]
default = []
channels = []

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-config = { path = "../core/config" }
toadstool-management-monitoring = { path = "../management/monitoring" }
# toadstool-management-analytics = { path = "../management/analytics" }  # Disabled: has sqlx/ring dependency

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
humantime-serde = "1.1"
bytes = { workspace = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Networking and communication
hyper = { version = "1.0", features = ["full"] }
tower = "0.4"
# PURE RUST: reqwest removed - unix sockets only! ✅
http = "0.2"

# Clustering and load balancing
rand = "0.8"
aes-gcm = { workspace = true }
ed25519-dalek = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

# Database - REMOVED: Unused dependency with ring/TLS
# PURE RUST: sqlx removed - was bringing in ring via rustls for DB TLS
# If database needed in future, use pure Rust alternatives or feature-gate
# sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = { workspace = true }
anyhow = "1.0"
# dashmap removed: evolved to std::sync::RwLock<HashMap> (no usage in source)

# System information (pure Rust!)
sysinfo = { workspace = true }

# Configuration
config = "0.14" 
[dev-dependencies]
toadstool-testing = { path = "../testing" }
tokio-test = "0.4"
tempfile = "3.0"
