[package]
name = "toadstool-distributed"
version = "0.1.0"
edition = "2021"
description = "Distributed computing coordination for ToadStool"
license = "MIT OR Apache-2.0"

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool_management_monitoring = { path = "../management/monitoring" }
toadstool-management-analytics = { path = "../management/analytics" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Networking and communication
hyper = { version = "1.0", features = ["full"] }
tower = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }

# Clustering and load balancing
rand = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
dashmap = "5.5"
num_cpus = "1.16"

# Configuration
config = "0.14" 