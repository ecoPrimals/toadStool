[package]
name = "toadstool-distributed"
version = "0.1.0"
edition.workspace = true
description = "Distributed computing coordination for ToadStool"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["distributed", "compute", "orchestration", "coordination"]
categories = ["asynchronous", "network-programming"]

[features]
default = []
channels = []
testing = ["dev-crypto"]  # Exposes new_for_testing + dev-crypto fallback for integration tests
dev-crypto = ["dep:aes-gcm", "dep:ed25519-dalek"]  # In-process SoftwareHsmProvider for dev/CI (production uses BearDog)
# `SecurityProviderFactory::create_mock` + `MockSecurityProvider` — not default
test-mocks = []

[dependencies]
# Core ToadStool dependencies
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-config = { path = "../core/config" }
toadstool-management-monitoring = { path = "../management/monitoring" }
# toadstool-management-analytics = { path = "../management/analytics" }  # Disabled: optional analytics integration

# Async runtime
tokio = { workspace = true }
tokio-util = { version = "0.7" }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
# bincode removed: was declared but unused in source (RUSTSEC-2025-0141 unmaintained).
# tarpc uses its own serde transport; if raw binary serialization is needed,
# use postcard (pure Rust, no_std, varint) or bitcode instead.
humantime-serde = "1.1"
bytes = { workspace = true }

# Clustering and load balancing
rand = "0.8"
aes-gcm = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true }

# Database - REMOVED: Unused dependency with ring/TLS
# PURE RUST: sqlx removed - was bringing in ring via rustls for DB TLS
# If database needed in future, use pure Rust alternatives or feature-gate
# sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Utilities
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# dashmap removed: evolved to std::sync::RwLock<HashMap> (no usage in source)

# System monitoring — Pure Rust via /proc (replaces sysinfo, zero C)
toadstool-sysmon = { workspace = true }

# Configuration
config = { workspace = true }
[[test]]
name = "coordination_rpc_coverage_tests"
required-features = ["testing"]

[[test]]
name = "beardog_client_coverage_tests"

[[test]]
name = "access_control_coverage_tests"

[dev-dependencies]
toadstool-testing = { path = "../testing" }
tokio-test = "0.4"
tempfile = "3.0"
temp-env = "0.3"
toml = "0.8"
anyhow = "1"
proptest = { workspace = true }

[lints]
workspace = true
