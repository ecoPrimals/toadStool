[workspace]
resolver = "2"
members = [
    # Core crates
    "crates/core/common",
    "crates/core/config", 
    "crates/core/ember",        # Hardware-agnostic device holder (glowPlug subsystem)
    "crates/core/glowplug",     # Hardware-agnostic device lifecycle interface
    "crates/core/hw-safe",      # Safe wrappers for hardware primitives (mmap, MMIO, alloc)
    "crates/core/hw-learn",
    "crates/core/nvpmu",
    "crates/core/sysmon",
    "crates/core/toadstool",
    "crates/toadstool-core",  # NEW: Hardware infrastructure layer (Feb 8, 2026) 🍄
    "crates/auto_config",  # Re-enabled for zero-touch demo
    
    # API and interfaces
    "crates/cli",
    "crates/client",  # EVOLVED: reqwest removed, Unix JSON-RPC only ✅
    "crates/server",
    "crates/integration/security",     # NEW: bearDog entropy integration (Jan 15, 2026)
    "crates/integration/storage",
    "crates/integration/primals",
    "crates/integration/protocols", 
    "crates/management/monitoring",
    "crates/management/performance",
    "crates/management/resources",
    "crates/management/analytics",
    "crates/runtime/adaptive",        # NEW: Adaptive optimization (Jan 15, 2026)
    "crates/runtime/container",
    "crates/runtime/display",         # Display backend for petalTongue (drm/evdev use kernel FFI)
    "crates/runtime/gpu",
    "crates/runtime/specialty",
    "crates/runtime/edge",
    "crates/runtime/native",
    "crates/runtime/orchestration",   # NEW: Workload orchestration (Jan 31, 2026) 🎯
    # "crates/runtime/python",        # Excluded: pyo3 FFI violates ecoBin v3.0. Use Squirrel IPC for Python.
    "crates/runtime/wasm",
    "crates/runtime/secure_enclave",  # NEW: Zero-knowledge compute (Dec 22, 2025)
    "crates/runtime/universal",       # NEW: Universal compute runtime (Jan 8, 2026)
    
    # Neuromorphic hardware
    "crates/neuromorphic/akida-driver",  # NEW: Pure Rust Akida driver (Jan 29, 2026) 🧠
    "crates/neuromorphic/akida-models",  # NEW: Model parser (Jan 29, 2026) 🧠
    
    # ML inference — excluded: burn-wgpu pulls wgpu v23 (conflicts with workspace wgpu v22)
    # Build individually: cargo build -p burn-inference
    # "crates/ml/burn-inference",
    "crates/neuromorphic/akida-reservoir-research",  # NEW: Reservoir computing research (Jan 29, 2026) 🔬
    "crates/neuromorphic/akida-setup",  # NEW: Rust binary for NPU setup (Feb 8, 2026)
    "crates/neuromorphic/cross-substrate-validation",  # NEW: Cross-substrate benchmark (Jan 29, 2026) 🧠
    "crates/neuromorphic/neurobench-runner",  # NEW: Pure Rust NeuroBench harness (Feb 12, 2026) 📊
    
    "crates/security/monitoring",
    "crates/security/policies",
    "crates/security/sandbox",
    "crates/distributed",             # Sprint 5
    "crates/testing",
    "crates/integration-tests", # D-S16-004: Workspace orphan tests → proper crate (Feb 2026)
    "examples",
]

exclude = ["fuzz", "crates/ml/burn-inference"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["ToadStool Development Team"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/toadstool"
homepage = "https://github.com/ecoPrimals/toadstool"
documentation = "https://docs.rs/toadstool"
description = "Universal compute platform for execution environments, security sandboxing, and resource management"
keywords = ["compute", "sandbox", "runtime", "security", "execution"]
categories = ["development-tools", "web-programming", "api-bindings"]

[workspace.dependencies]
# ============================================================================
# GPU COMPUTE FRAMEWORKS - Universal versioning to prevent linker conflicts
# ============================================================================
# CRITICAL: wgpu must be the same version across all crates to prevent
# duplicate symbol errors during linking (wgpu_core symbols)
# barraCuda framework uses wgpu for vendor-agnostic GPU compute
#
# PURE RUST EVOLVED! ✅
# NOTE: Default features include 'renderdoc' (C dependency for GPU debugging)
# EVOLVED: Disable renderdoc, use Pure Rust profiling via tracing crate instead!
# This achieves ABSOLUTE 100.00% Pure Rust! 🎉
wgpu = { version = "22", default-features = false, features = [
    "wgsl",                # WGSL shader language support
    "dx12",                # DirectX 12 (Windows)
    "metal",               # Metal (macOS/iOS)
    "webgpu",              # WebGPU (browsers)
    "vulkan-portability",  # Vulkan support (enables wgpu-hal/vulkan internally)
    # "renderdoc",         # ❌ DISABLED - C dependency! Use tracing instead! ✅
]}

# Pure Rust directory discovery (replaces dirs/dirs-sys)
etcetera = "0.8"


# Zero-copy binary payload transport (already a transitive dep via tokio/hyper/axum)
# Use bytes::Bytes instead of Vec<u8> for data that is cloned across threads/tasks.
# bytes::Bytes is Arc<[u8]>: clone() bumps a refcount, not a memcpy.
bytes = { version = "1.11.1", features = ["serde"] }

# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
uuid = { version = "1.7", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
thiserror = "2.0"
regex = "1.10"

# Configuration
config = "0.15"
toml = "0.8"

# RPC Protocols - PRIMARY (following Songbird pattern)
# tarpc: High-performance binary RPC for primal-to-primal (Rust-to-Rust)
tarpc = { version = "0.37", features = ["tokio1", "serde-transport", "serde-transport-json"] }
# jsonrpsee removed (pulls ring C dependency). Pure Rust JSON-RPC via pure_jsonrpc.
# See: crates/server/src/pure_jsonrpc/ (canonical JSON-RPC handler)

# EVOLVED: axum/tower/tower-http removed — HTTP is songBird's domain.
# toadStool uses pure_jsonrpc over Unix sockets per wateringHole standard.
url = "2.5"

# Container runtimes
bollard = "0.18" # Docker API
# containerd-client = "0.4" # Containerd - REMOVED: protobuf dependency

# WebAssembly
# EVOLVED: Removed dead dependencies (Feb 14, 2026)
# - wasmtime, wasmtime-wasi, wasmer, wasi-common were unused
# - Runtime uses wasmi (Pure Rust) for WASM execution
# - runtime/gpu has optional wasmtime via local dependency for JIT path

# EVOLVED: pyo3/pyo3-asyncio removed — Python FFI violates ecoBin v3.0.
# Python integration belongs to Squirrel via IPC.

# Security and sandboxing
# once_cell removed: evolved to std::sync::LazyLock (Rust 1.80+)
# EVOLVED: caps removed (Mar 12, 2026) — unused; was dead dep in security crates
# EVOLVED: nix removed (Feb 14, 2026) — unused in production, libc for tests

# Cryptography — minimal; signing/encryption delegates to bearDog via IPC.
# aes-gcm + ed25519-dalek: only used by distributed/software_hsm behind dev-crypto feature
aes-gcm = "0.10.3"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
hex = "0.4"
sha2 = "0.10"

# BTSP handshake (BTSP_PROTOCOL_STANDARD.md): pure Rust, no C FFI
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"

# Networking
# EVOLVED: ipnet removed (Mar 12, 2026) — unused; no crate references it
# mdns removed: standardized on mdns-sd; edge stub doesn't need it

# System monitoring — Pure Rust via /proc (replaces sysinfo)
toadstool-sysmon = { path = "crates/core/sysmon" }
# EVOLVED: sysinfo removed (Mar 9, 2026) — replaced by toadstool-sysmon (pure Rust /proc, zero C)
# EVOLVED: psutil removed (Feb 14, 2026) - unused

# Async utilities
futures = "0.3"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Development dependencies
tokio-test = "0.4"
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

# ============================================================================
# BUILD PROFILES — tuned for 45-crate, 602-package workspace
# ============================================================================
# Baseline (clean build, Ryzen 7 5700X / 16 threads / 62 GB):
#   dev:          ~2m30s wall (26m CPU)  — mold linker cuts ~30s
#   release:      ~8-12m wall            — LTO + codegen-units=1
#   release-fast: ~6-10m wall            — LTO + opt-level=3
#   lib tests:    ~45s execution
# ============================================================================

[profile.dev]
opt-level = 0
# line-tables-only: keeps backtraces but cuts debug info size ~60%
# change to `true` (or 2) if you need full variable inspection in a debugger
debug = "line-tables-only"
overflow-checks = true
# unpacked splits debug info per object file — faster incremental linking
split-debuginfo = "unpacked"
# 256 codegen units: max parallelism for local crates in dev
codegen-units = 256
incremental = true

[profile.dev.package."*"]
# Dependencies (naga, wgpu, tarpc, serde, etc.) at opt-level 2:
# naga shader compilation is 5-10x faster optimized; serde derive is faster.
opt-level = 2

[profile.release]
# genomeBin: size-optimized for single-binary deployment (ecoBin v3.0)
opt-level = "z"
debug = false
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
# Speed-optimized release for benchmarks and latency-sensitive production
inherits = "release"
opt-level = 3
strip = false

[profile.bench]
opt-level = 3
debug = false
lto = true

 
# Unsafe policy (wateringHole: STANDARDS_AND_EXPECTATIONS.md)
#
# Workspace level: `deny` (not `forbid`). Rationale:
#   - `forbid` cannot be overridden — hardware crates (hw-safe, nvpmu, akida-driver,
#     runtime/gpu, runtime/display) need module-scoped `#[allow(unsafe_code)]` for
#     VFIO ioctls, DMA, volatile MMIO, and V4L2 FFI.
#   - Per-crate `#![forbid(unsafe_code)]` is set on all non-hardware crate roots
#     (23 forbid + 20 deny = 43/43 crates covered).
#   - Hardware crates use `#![deny(unsafe_code)]` with narrow `#[allow(unsafe_code)]`
#     on specific modules, each with `// SAFETY:` documentation.
#   - Central unsafe containment: `hw-safe` crate wraps all low-level primitives
#     (LockedMemory, VolatileMmio, vfio_dma) so downstream crates stay safe.
#
# Net: every crate enforces at least `deny`; most enforce `forbid`.
[workspace.lints.rust]
unsafe_code = "deny"

# Pedantic + Nursery clippy enabled for production-grade code quality
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Cargo lints - selectively enabled (not using full cargo group
# to avoid multiple_crate_versions blocking on transitive conflicts)

# Allow reasonable exceptions for production code
missing_errors_doc = "allow"       # Too verbose for every Result
missing_panics_doc = "allow"       # Most panics are obvious
module_name_repetitions = "allow"  # Common in domain modeling
must_use_candidate = "allow"        # Too noisy at workspace scale; add #[must_use] intentionally
doc_markdown = "allow"             # Too strict about backticks
wildcard_imports = "allow"         # Useful for test prelude
uninlined_format_args = "allow"    # Sometimes clearer explicit
cast_precision_loss = "allow"      # Explicit casts are intentional
cast_possible_truncation = "allow" # Explicit casts are intentional
cast_sign_loss = "allow"           # Explicit casts are intentional
cast_possible_wrap = "allow"       # Explicit casts are intentional

# Nursery lint exceptions — these fire at high volume without catching real bugs
use_self = "allow"                 # Noisy on struct impls; Self is optional style
redundant_pub_crate = "allow"      # Private-mod pub(crate) is intentional visibility layering
missing_const_for_fn = "allow"     # Compiler will inline regardless; const adds API commitment
option_if_let_else = "allow"       # match/if-let is often clearer than map_or
significant_drop_tightening = "allow" # False positives on lock guards

# Pedantic lint exceptions — match_same_arms is common in dispatch tables
match_same_arms = "allow"          # Dispatch tables intentionally share arms for clarity
