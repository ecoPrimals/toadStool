    "crates/core/config", 
    "crates/core/toadstool",
    "crates/toadstool-core",  # NEW: Hardware infrastructure layer (Feb 8, 2026) 🍄
    "crates/auto_config",  # Re-enabled for zero-touch demo
    "crates/barracuda",     # NEW: Hardware-agnostic tensor compute (Jan 30, 2026) 🦈
    
    # API and interfaces
    "crates/cli",
    "crates/client",  # EVOLVED: reqwest removed, Unix JSON-RPC only ✅
    "crates/server",
    "crates/integration/beardog",     # NEW: bearDog entropy integration (Jan 15, 2026)
    "crates/integration/nestgate",
    "crates/integration/primals",
    "crates/integration/protocols", 
    # "crates/integration/songbird",  # Temporarily commented - missing crate
    "crates/management/monitoring",
    "crates/management/performance",
    "crates/management/resources",
    # "crates/management/analytics",    # DISABLED: sqlx (removed for Pure Rust) ✅
    "crates/runtime/adaptive",        # NEW: Adaptive optimization (Jan 15, 2026)
    "crates/runtime/container",
    "crates/runtime/display",         # NEW: 100% Pure Rust display backend for petalTongue (Jan 19, 2026) 🍄🌸
    "crates/runtime/gpu",
    # "crates/runtime/specialty",  # Future feature (P3) - incomplete trait implementations (see docs/sessions/dec-4-2025/SPECIALTY_RUNTIME_11_HOUR_ASSESSMENT.md)
    "crates/runtime/native",
    "crates/runtime/orchestration",   # NEW: Workload orchestration (Jan 31, 2026) 🎯
    "crates/runtime/python",
    "crates/runtime/wasm",
    "crates/runtime/secure_enclave",  # NEW: Zero-knowledge compute (Dec 22, 2025)
    "crates/runtime/universal",       # NEW: Universal compute runtime (Jan 8, 2026)
    
    # Neuromorphic hardware
    "crates/neuromorphic/akida-driver",  # NEW: Pure Rust Akida driver (Jan 29, 2026) 🧠
    "crates/neuromorphic/akida-models",  # NEW: Model parser (Jan 29, 2026) 🧠
    
    # ML inference
    "crates/ml/burn-inference",  # NEW: Burn-based ML inference (Feb 12, 2026) 🔥
    "crates/neuromorphic/akida-reservoir-research",  # NEW: Reservoir computing research (Jan 29, 2026) 🔬
    "crates/neuromorphic/akida-setup",  # NEW: Rust binary for NPU setup (Feb 8, 2026)
    "crates/neuromorphic/cross-substrate-validation",  # NEW: Cross-substrate benchmark (Jan 29, 2026) 🧠
    "crates/neuromorphic/neurobench-runner",  # NEW: Pure Rust NeuroBench harness (Feb 12, 2026) 📊
    
    "crates/security/monitoring",
    "crates/security/policies",
    "crates/security/sandbox",
    "crates/distributed",             # Sprint 5
    "crates/testing",
    "examples",
    # Showcases - Core working demonstrations
    "showcase/neuromorphic/01-akida-detection",  # Akida detection showcase
    "showcase/neuromorphic/04-raytracing-comparison",  # NPU vs GPU raytracing (Feb 8, 2026)
    "showcase/rbf-surrogate",  # RBF surrogate learning (Feb 8, 2026)
    "showcase/gpu-universal/ml-inference",  # BarraCUDA ML inference showcase
    "showcase/cross-platform",  # NEW: Cross-platform compute showcase (Feb 12, 2026) 🌐
    "showcase/homomorphic-computing",  # NPU-accelerated homomorphic encryption (Jan 31, 2026)
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["ToadStool Development Team"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/your-org/toadstool"
homepage = "https://github.com/your-org/toadstool"
documentation = "https://docs.rs/toadstool"
description = "Universal compute platform for execution environments, security sandboxing, and resource management"
keywords = ["compute", "sandbox", "runtime", "security", "execution"]
categories = ["development-tools", "web-programming", "api-bindings"]

[workspace.dependencies]
# ============================================================================
# GPU COMPUTE FRAMEWORKS - Universal versioning to prevent linker conflicts
# ============================================================================
# CRITICAL: wgpu must be the same version across all crates to prevent
# duplicate symbol errors during linking (wgpu_core symbols)
# barraCUDA framework uses wgpu for vendor-agnostic GPU compute
#
# PURE RUST EVOLVED! ✅
# NOTE: Default features include 'renderdoc' (C dependency for GPU debugging)
# EVOLVED: Disable renderdoc, use Pure Rust profiling via tracing crate instead!
# This achieves ABSOLUTE 100.00% Pure Rust! 🎉
wgpu = { version = "22", default-features = false, features = [
    "wgsl",                # WGSL shader language support
    "dx12",                # DirectX 12 (Windows)
    "metal",               # Metal (macOS/iOS)
    "webgpu",              # WebGPU (browsers)
    "vulkan-portability",  # Vulkan support (enables wgpu-hal/vulkan internally)
    # "renderdoc",         # ❌ DISABLED - C dependency! Use tracing instead! ✅
]}

# Pure Rust directory discovery (replaces dirs/dirs-sys)
etcetera = "0.8"


# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.7", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

# Configuration
config = "0.14"
toml = "0.8"

# RPC Protocols - PRIMARY (following Songbird pattern)
# tarpc: High-performance binary RPC for primal-to-primal (Rust-to-Rust)
tarpc = { version = "0.34", features = ["tokio1", "serde-transport", "serde-transport-json"] }
# ⚠️ REMOVED: jsonrpsee pulls ring (C dependency)
# jsonrpsee = { version = "0.21", features = ["server", "client", "macros"] }
# ✅ EVOLVED: Use manual_jsonrpc.rs or pure_jsonrpc.rs instead (Pure Rust!)
# See: crates/server/src/manual_jsonrpc.rs (Unix sockets)
# See: crates/server/src/pure_jsonrpc.rs (BearDog pattern)

# HTTP and networking - FALLBACK (enabled but not primary)
# PURE RUST: reqwest removed - all primal communication uses unix sockets! ✅
hyper = { version = "0.14", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
url = "2.5"

# Container runtimes
bollard = "0.15" # Docker API
# containerd-client = "0.4" # Containerd - REMOVED: protobuf dependency

# WebAssembly
# EVOLVED: Removed dead dependencies (Feb 14, 2026)
# - wasmtime, wasmtime-wasi, wasmer, wasi-common were unused
# - Runtime uses wasmi (Pure Rust) for WASM execution
# - runtime/gpu has optional wasmtime via local dependency for JIT path

# Python integration (preparing for Squirrel MCP integration)
# NOTE: Python 3.13 requires: export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
# Waiting for pyo3-asyncio to support pyo3 0.22+
pyo3 = { version = "0.20", features = ["auto-initialize", "extension-module", "abi3-py38"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }

# Security and sandboxing
once_cell = "1.19"
caps = "0.5"
# EVOLVED: nix removed (Feb 14, 2026) - unused in production, libc for tests

# Cryptography — all pure Rust (no C/FFI deps)
aes-gcm = "0.10"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

# Networking
ipnet = "2.9"
mdns = "3.0"

# System monitoring
sysinfo = "0.30"
# EVOLVED: psutil removed (Feb 14, 2026) - unused, sysinfo covers all use cases

# Async utilities
futures = "0.3"
futures-util = "0.3"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
console = "0.15"
indicatif = "0.17"

# Development dependencies
tokio-test = "0.4"
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[profile.dev]
# Optimize dependencies but not local code for faster builds
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
# Maximum optimization for production builds
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
# Optimized for benchmarking
opt-level = 3
debug = false
lto = true




 
# Production code quality: warnings as errors
[workspace.lints.rust]

# Pedantic clippy enabled for improved code quality
[workspace.lints.clippy]
# PEDANTIC MODE - Production-grade code quality
pedantic = { level = "warn", priority = -1 }

# Cargo lints - selectively enabled (not using full cargo group
# to avoid multiple_crate_versions blocking on transitive conflicts)

# Allow reasonable exceptions for production code
missing_errors_doc = "allow"       # Too verbose for every Result
missing_panics_doc = "allow"       # Most panics are obvious
module_name_repetitions = "allow"  # Common in domain modeling
must_use_candidate = "allow"       # Too noisy for builders
doc_markdown = "allow"             # Too strict about backticks
wildcard_imports = "allow"         # Useful for test prelude
uninlined_format_args = "allow"    # Sometimes clearer explicit
cast_precision_loss = "allow"      # Explicit casts are intentional
cast_possible_truncation = "allow" # Explicit casts are intentional
cast_sign_loss = "allow"           # Explicit casts are intentional
cast_possible_wrap = "allow"       # Explicit casts are intentional
